<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP 規劃師題庫</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --border:#dde1e7;
  --text:#1c2230; --muted:#5d6676; --accent:#2457c5; --accent-soft:#e7eefc;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c53030; --bad-soft:#fbe9e9;
  --warn:#9a6700; --warn-soft:#fff4d6; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --surface:#1b1f27; --surface-2:#232833; --border:#2f3542;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#7aa2ff; --accent-soft:#1f2a44;
    --ok:#4cc782; --ok-soft:#173326; --bad:#ff7b7b; --bad-soft:#3a1d1f;
    --warn:#f2c14e; --warn-soft:#3a3018; --shadow:none; --on-accent:#0d1220;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b1f27; --surface-2:#232833; --border:#2f3542;
  --text:#e6e9ef; --muted:#9aa3b2; --accent:#7aa2ff; --accent-soft:#1f2a44;
  --ok:#4cc782; --ok-soft:#173326; --bad:#ff7b7b; --bad-soft:#3a1d1f;
  --warn:#f2c14e; --warn-soft:#3a3018; --shadow:none; --on-accent:#0d1220;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px; margin:0 auto; padding:24px 16px 64px}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
header h1{font-size:1.5rem; margin:0; letter-spacing:.02em}
header p{margin:2px 0 0; color:var(--muted); font-size:.9rem}
.theme-btn{background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; font-size:.85rem}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow)}
.stat b{display:block; font-size:1.3rem; line-height:1.2; font-variant-numeric:tabular-nums}
.stat span{color:var(--muted); font-size:.8rem}

nav.tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:16px; overflow-x:auto}
nav.tabs button{flex:1 0 auto; border:0; background:transparent; color:var(--muted); font:inherit; font-size:.92rem; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap}
nav.tabs button.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
nav.tabs .badge{display:inline-block; min-width:1.4em; padding:0 6px; margin-left:4px; border-radius:99px; background:var(--bad-soft); color:var(--bad); font-size:.75rem; line-height:1.5; text-align:center}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; box-shadow:var(--shadow)}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:12px}
.toolbar .left{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.chip{font-size:.78rem; color:var(--muted); background:var(--surface-2); border-radius:99px; padding:2px 10px; white-space:nowrap}
.chip.src-ok{background:var(--ok-soft); color:var(--ok)}
.chip.src-mid{background:var(--accent-soft); color:var(--accent)}
.chip.src-low{background:var(--warn-soft); color:var(--warn)}
.btn{border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-size:.9rem; padding:7px 14px; border-radius:8px; cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
select,input[type=search]{font:inherit; font-size:.9rem; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; max-width:100%}
input[type=search]{min-width:0; flex:1 1 200px}
label.toggle{display:inline-flex; align-items:center; gap:6px; font-size:.88rem; color:var(--muted); cursor:pointer}

.qhead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:8px}
.qhead .chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.qno{font-weight:700; color:var(--accent); white-space:nowrap}
.chlabel{font-size:.8rem; color:var(--muted); margin-bottom:6px}
.stem{font-size:1.06rem; margin:0 0 10px}
.items{margin:0 0 12px; padding:10px 14px; background:var(--surface-2); border-radius:10px; list-style:none}
.items li{padding:1px 0}
.opts{display:grid; gap:8px; margin-top:8px}
.opt{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; border:1.5px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:10px 14px; font:inherit; cursor:pointer; transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); font-weight:700; font-size:.85rem; margin-top:1px}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.opt.picked .key{background:var(--accent); color:var(--on-accent)}
.opt.correct{border-color:var(--ok); background:var(--ok-soft)}
.opt.correct .key{background:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); color:var(--surface)}

.explain{margin-top:16px; border-left:4px solid var(--accent); background:var(--surface-2); border-radius:0 10px 10px 0; padding:12px 16px}
.explain.ok{border-left-color:var(--ok)}
.explain.bad{border-left-color:var(--bad)}
.explain .verdict{font-weight:700; margin-bottom:4px}
.explain.ok .verdict{color:var(--ok)}
.explain.bad .verdict{color:var(--bad)}
.explain p{margin:6px 0}
.explain ul{margin:6px 0; padding-left:1.3em}
.explain .tip{margin-top:8px; padding:6px 10px; background:var(--warn-soft); color:var(--text); border-radius:8px; font-size:.92rem}
.explain .tip b{color:var(--warn)}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:8px 0; font-size:.88rem}
.flow span.n{background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:2px 8px}
.flow span.a{color:var(--muted); font-size:.8rem}
.flow span.a.hl{color:var(--accent); font-weight:700}
table.mini{border-collapse:collapse; width:100%; font-size:.9rem; margin:6px 0}
table.mini th,table.mini td{border:1px solid var(--border); padding:4px 8px; text-align:left; vertical-align:top}
table.mini th{background:var(--surface); white-space:nowrap}

.navrow{display:flex; justify-content:space-between; gap:8px; margin-top:18px}
details.navgrid{margin-top:16px}
details.navgrid summary{cursor:pointer; color:var(--muted); font-size:.88rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:6px; margin-top:10px}
.grid button{height:36px; border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:8px; font:inherit; font-size:.78rem; cursor:pointer; padding:0}
.grid button.cur{outline:2px solid var(--accent); outline-offset:1px; color:var(--text); font-weight:700}
.grid button.done{background:var(--accent-soft); color:var(--accent)}
.grid button.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.grid button.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.hint{color:var(--muted); font-size:.8rem; margin-top:10px; text-align:center}

.result-top{display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.score{font-size:3rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.score small{font-size:1rem; color:var(--muted); font-weight:500}
.pass{display:inline-block; padding:2px 10px; border-radius:99px; font-size:.85rem; font-weight:700}
.pass.y{background:var(--ok-soft); color:var(--ok)} .pass.n{background:var(--bad-soft); color:var(--bad)}
.review-item{border-top:1px solid var(--border); padding:16px 0}
.review-item:first-child{border-top:0; padding-top:0}
.ans-line{font-size:.9rem; margin:4px 0}
.ans-line .c{color:var(--ok); font-weight:700} .ans-line .w{color:var(--bad); font-weight:700}
.optline{font-size:.95rem}
.optline.c{color:var(--ok); font-weight:700}

.chprog{display:grid; gap:6px; margin-top:12px}
.chprog .row{display:grid; grid-template-columns:1fr 120px 64px; gap:10px; align-items:center; font-size:.85rem}
.bar{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.chprog .num{color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}

details.qa{border:1px solid var(--border); border-radius:12px; background:var(--surface); margin-bottom:10px; box-shadow:var(--shadow)}
details.qa summary{cursor:pointer; padding:14px 18px; font-weight:600; list-style:none; display:flex; gap:10px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"▸"; color:var(--accent); transition:transform .15s}
details.qa[open] summary::before{transform:rotate(90deg)}
details.qa .body{padding:0 18px 16px 40px}
details.qa .body ul{margin:4px 0; padding-left:1.2em}
.note{font-size:.85rem; color:var(--muted); background:var(--surface-2); border-radius:10px; padding:10px 14px; margin-bottom:14px}
.empty{text-align:center; color:var(--muted); padding:40px 10px}
.hidden{display:none !important}
mark{background:var(--warn-soft); color:inherit; padding:0 1px; border-radius:3px}

.searchbox input[type=search]{display:block; width:100%; font-size:1.05rem; padding:10px 14px; border-radius:10px}
.searchbox input[type=search]:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.suggest{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center}
.suggest .lbl{font-size:.8rem; color:var(--muted); margin-right:2px}
.kw{border:1px solid var(--border); background:var(--surface-2); color:var(--text); font:inherit; font-size:.8rem; border-radius:99px; padding:2px 10px; cursor:pointer}
.kw:hover{border-color:var(--accent); color:var(--accent)}
.kw small{color:var(--muted); margin-left:4px; font-variant-numeric:tabular-nums}
.btn.sm{font-size:.78rem; padding:2px 10px; white-space:nowrap}
#srchMeta .toolbar{margin:14px 0 10px}
details.srch-ans{margin-top:10px}
details.srch-ans summary{cursor:pointer; color:var(--accent); font-size:.88rem}
details.srch-ans .optline{margin-top:6px}

@media (max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{padding:16px}
  .chprog .row{grid-template-columns:1fr 70px 52px}
  details.qa .body{padding:0 14px 14px 18px}
  select{width:100%}
}
@media print{
  nav.tabs,.stats,.theme-btn,.toolbar{display:none !important}
  body{background:#fff}
  .card{box-shadow:none; border:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ERP 規劃師題庫</h1>
      <p>中華企業資源規劃學會《ERP 規劃師試題指南》2025.09 V06 官方題庫 441 題<br>＋《ERP 企業資源規劃導論》第三章課本習題 20 題與問答題 8 題</p>
    </div>
    <button class="theme-btn" id="themeBtn">切換深淺色</button>
  </header>

  <section class="stats">
    <div class="stat"><b id="stDone">0</b><span>已練習題數</span></div>
    <div class="stat"><b id="stRate">–</b><span>答對率</span></div>
    <div class="stat"><b id="stWrong">0</b><span>錯題本</span></div>
    <div class="stat"><b id="stBest">–</b><span>模擬測驗最高分</span></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="practice" class="active">練習模式</button>
    <button data-tab="search" title="快捷鍵：/">關鍵字搜尋</button>
    <button data-tab="quiz">模擬測驗</button>
    <button data-tab="wrong">錯題本<span class="badge" id="wrongBadge">0</span></button>
    <button data-tab="progress">章節進度</button>
    <button data-tab="essay">課本問答題</button>
    <button data-tab="all">題目總覽</button>
  </nav>

  <main id="view"></main>
</div>

<script>
const Q = [
{ id:1, stem:"下列何者<u>非</u>為導入銷售與配銷模組所能為企業帶來之利益？",
  opts:["改善即時交貨效率","增強滲透市場之能力","減少訂單處理時間與成本","減少人員之流動率"], ans:3,
  exp:`<p>導入銷售與配銷（SD）模組的效益集中在「銷售流程」本身：</p>
<ul><li><b>改善即時交貨效率</b>：可用量查核（ATP）、出貨排程讓交期更準確。</li>
<li><b>增強滲透市場能力</b>：整合顧客資料與銷售分析，掌握市場需求。</li>
<li><b>減少訂單處理時間與成本</b>：報價 → 訂單 → 交貨 → 請款文件自動轉置，減少重複輸入。</li></ul>
<p>「人員流動率」是人力資源管理的議題，不是 SD 模組的效益。</p>` },

{ id:2, stem:"「所生產的成品是少量多樣，除了能快速回應顧客的需求外，並且使供應商的成品存貨降至最低」，此為何種企業情境之特性？",
  opts:["訂單裝配 (Assemble to Order)","存貨生產 (Make to Stock)","訂單生產 (Make to Order)","訂單設計 (Engineer to Order)"], ans:0,
  exp:`<p>官方題庫（試題指南第 15、51 題）的答案是<b>訂單裝配 (ATO)</b>。</p>
<p>ATO 先把共用的零組件、半成品備好，接到訂單後再依顧客指定的組合快速組裝：</p>
<ul><li>用相同的模組組合出不同成品 → <b>少量多樣</b></li>
<li>零組件已經備妥，只差組裝 → <b>能快速回應顧客需求</b></li>
<li>接單後才組裝成成品 → <b>成品存貨降至最低</b></li></ul>
<table class="mini"><tr><th>策略</th><th>特性</th></tr>
<tr><td>存貨生產 MTS</td><td>依預測先生產，成品放庫存；大量少樣、標準品、交期最短。</td></tr>
<tr><td><b>訂單裝配 ATO</b></td><td>備妥零組件，接單後組裝；少量多樣、回應快、成品存貨最低。</td></tr>
<tr><td>訂單生產 MTO</td><td>接單後才從原料開始生產，交期比 ATO 長。</td></tr>
<tr><td>訂單設計 ETO</td><td>接單後才開始設計，客製化程度最高、生產批量最小、交期最長。</td></tr></table>
<div class="tip"><b>易錯：</b>很多人看到「成品存貨最低」就選 MTO，但這題的標準答案是<b>訂單裝配</b>，整句話直接背起來。</div>` },

{ id:3, stem:"銷售訂單中的付款條件與稅賦決定等資訊，是由下列何種主檔轉置而來？",
  opts:["從物料主檔","從產品—物料資訊主檔","從顧客主檔","從價格主檔"], ans:2,
  exp:`<p>建立銷售訂單時只要輸入<b>顧客編號</b>，系統就會從<b>顧客主檔</b>自動帶入付款條件、稅務分類、出貨條件、交貨地址等資料。</p>
<ul><li>物料主檔：帶入物料的描述、單位、重量、可用量查核設定等。</li>
<li>價格主檔（條件主檔）：提供定價、折扣條件。</li></ul>` },

{ id:4, stem:"下列何者為企業從事行銷活動時，最常用而且為最有效的方式？",
  opts:["研討會","銷售講座","銷售電話","直效郵遞 (Direct Mailing, DM)"], ans:3,
  exp:`<p>教材指出，<b>直效郵遞 (DM)</b> 是企業從事行銷活動時最常用、也最有效的方式：可以針對目標顧客名單寄送產品資訊，成本低，而且回應率可以追蹤衡量。</p>
<p>行銷活動（售前活動）的資料可以在 SD 模組中記錄，並作為後續詢價、報價的參考。</p>` },

{ id:5, stem:"當下列哪種文件產生時，系統便自動執行可用量查核 (Availability Check) 之功能？",
  opts:["顧客詢價單","銷售訂單","出貨文件","顧客報價單"], ans:1,
  exp:`<p><b>銷售訂單</b>建立時，系統會自動執行：</p>
<ul><li>可用量查核（ATP），確認能否在需求日期交貨</li><li>定價、信用查核</li><li>出貨排程、出貨點與路線決定</li><li>將需求傳遞給 MRP</li></ul>
<p>補充：官方題庫第 50 題的答案指出，<b>報價單、銷售訂單、交貨文件</b>產生時都會執行可用量查核，只有詢價單不會。本題是單選題，最典型、最核心的答案是<b>銷售訂單</b>。</p>` },

{ id:6, stem:"下列何者為在 ERP 系統中，啟動挑料功能之來源？",
  opts:["交貨文件","裝貨文件","運輸規劃文件","銷售訂單"], ans:0,
  exp:`<p>出貨流程中，<b>交貨文件 (Delivery)</b> 建立後才會啟動後續倉儲作業：</p>
<div class="flow"><span class="n">銷售訂單</span><span class="a">→</span><span class="n"><b>交貨文件</b></span><span class="a">→</span><span class="n">挑料</span><span class="a">→</span><span class="n">包裝</span><span class="a">→</span><span class="n">裝載／運輸</span><span class="a">→</span><span class="n">出貨扣帳</span></div>
<p>挑料單（Transfer Order／Picking List）是依據交貨文件產生的。</p>` },

{ id:7, stem:"物料可用期限與裝載期限之時間間距，即為",
  opts:["挑料／包裝時間","裝載時間","運送時間","運輸規劃前置時間"], ans:0,
  exp:`<p>出貨排程（由交貨日期往回推）的各段時間：</p>
<div class="flow"><span class="n">物料可用日</span><span class="a hl">— 挑料/包裝時間 →</span><span class="n">裝載日</span><span class="a">— 裝載時間 →</span><span class="n">出貨扣帳日</span><span class="a">— 運送時間 →</span><span class="n">交貨日</span></div>
<div class="flow"><span class="n">運輸規劃日</span><span class="a">— 運輸規劃前置時間 →</span><span class="n">裝載日</span></div>
<div class="tip"><b>記法：</b>物料要先「挑好、包好」才能「裝載」，所以兩者之間是挑料／包裝時間。</div>` },

{ id:8, stem:"下列何者<u>非</u>為請款價格 (Billing Price) 決定之來源？",
  opts:["手動輸入價格","直接參考相關請款資料","直接轉置顧客詢價單上的價格","直接轉置銷售訂單上的價格"], ans:2,
  exp:`<p>請款價格的來源有：</p>
<ul><li>手動輸入價格</li><li>參考相關請款資料</li><li>從銷售訂單轉置價格（也可以依請款日重新定價）</li></ul>
<p><b>顧客詢價單</b>屬於售前文件，價格還沒經雙方確認，不會直接拿來當請款價格。</p>` },

{ id:9, stem:"交貨文件產生的來源，可分為哪三種：",
  items:["(1) 從顧客契約轉置而來","(2) 從出貨協議轉置而來","(3) 從銷售訂單轉置而來","(4) 從顧客報價單轉置而來","(5) 手動產生交貨文件"],
  opts:["123","124","234","235"], ans:3,
  exp:`<p>交貨文件的三種來源：</p>
<ul><li>(2) 從<b>出貨協議（排程協議）</b>轉置</li><li>(3) 從<b>銷售訂單</b>轉置</li><li>(5) <b>手動</b>產生（不參考其他文件）</li></ul>
<p>(1) 顧客契約要先展開成銷售訂單（release order），(4) 報價單則是轉成銷售訂單，兩者都不會直接轉成交貨文件。</p>` },

{ id:10, stem:"當系統出貨扣帳完成後，下列哪些功能會被自動執行：",
  items:["(1) 會計科目中的存貨價值同時減少","(2) MRP 中的需求量根據出貨數量而減少","(3) 保留存貨 (reservations) 項目增加","(4) 成本會計文件同時產生","(5) 計劃訂單 (Planned Orders) 同時產生"],
  opts:["123","124","245","345"], ans:1,
  exp:`<p>出貨扣帳 (Goods Issue) 完成時，系統會自動：</p>
<ul><li>(1) 減少存貨數量與存貨價值，產生會計文件（借：銷貨成本／貸：存貨）</li>
<li>(2) 依出貨數量減少 MRP 中的需求量</li>
<li>(4) 產生成本會計文件</li>
<li>更新交貨文件、銷售訂單狀態，並列入請款到期清單</li></ul>
<p>錯誤選項：(3) 保留存貨會<b>減少／消除</b>，不是增加；(5) 計劃訂單是 MRP 執行時產生的，跟出貨扣帳無關。</p>` },

{ id:11, stem:"下列何者<u>不是</u> ERP 的銷售與配銷模組的主要功能？",
  opts:["允諾可用量 (ATP) 的自動查核","詢價、報價和訂單的處理與監控","出貨點和路線之安排","庫存盤點作業"], ans:3,
  exp:`<p>SD 模組的主要功能：售前活動、詢價、報價、訂單處理、ATP 查核、定價、信用管理、出貨點與路線決定、運輸、請款。</p>
<p><b>庫存盤點</b>屬於物料管理（MM）／庫存管理的功能，不屬於 SD。</p>` },

{ id:12, stem:"在銷售與配銷模組中，當產品的計價過低時，用以在請款時，成為建立借（或貸）方備忘錄之根據，此狀況下所產生的文件為：",
  opts:["貸項通知單請求","借項通知單請求","緊急訂單","售回訂單"], ans:1,
  exp:`<table class="mini"><tr><th>情況</th><th>文件</th><th>對應收帳款的影響</th></tr>
<tr><td><b>計價過低</b>（少收了錢）</td><td><b>借項通知單請求</b> (Debit Memo Request)</td><td>向顧客追加收款 → 應收帳款<b>增加</b></td></tr>
<tr><td>計價過高／瑕疵退貨</td><td>貸項通知單請求 (Credit Memo Request)</td><td>退還給顧客 → 應收帳款<b>減少</b></td></tr></table>
<div class="tip"><b>記法：</b>應收帳款是資產，記在借方；「借項」等於向顧客多收錢。</div>` },

{ id:13, stem:"在銷售與配銷模組與成本控制模組的關係中，當銷售訂單產生時系統即可將預期營收及相關成本資料傳送至成本控制模組，可以執行下列哪一選項？",
  opts:["銷售需求與物料需求規劃","工作分解結構與會計要素","保留存貨與系統自動扣帳","獲利能力分析與實際利潤評估"], ans:3,
  exp:`<p>銷售訂單建立時，預期營收與成本會傳送到成本控制（CO）的<b>獲利能力分析（CO-PA）</b>，可以先估算這張訂單的獲利；請款完成後再用實際營收與成本進行<b>實際利潤評估</b>。</p>
<p>A 屬於 SD 與生產規劃（PP／MRP）的關係，不是跟 CO 的關係。</p>` },

{ id:14, stem:"在銷售與配銷模組之顧客主檔資料中，對於財務與會計部門相當重要的財會資料會記錄在哪一資料結構中？",
  opts:["一般資料","銷售與配銷資料","公司代碼資料","以上皆非"], ans:2,
  exp:`<p>顧客主檔的三個層次：</p>
<table class="mini"><tr><th>層次</th><th>內容</th></tr>
<tr><td>一般資料</td><td>名稱、地址、電話、語言等，所有公司共用</td></tr>
<tr><td><b>公司代碼資料</b></td><td><b>統制科目、付款條件、催款程序、利息計算</b>等財會資料</td></tr>
<tr><td>銷售與配銷資料</td><td>定價、出貨條件、請款等銷售組織層級資料</td></tr></table>` },

{ id:15, stem:"在銷售與配銷模組中，交貨清單之建立是以何者為基準？",
  opts:["交貨文件","出貨通知單","顧客契約","排程協議"], ans:0,
  exp:`<p>官方題庫（試題指南第 22、23、36 題）：<b>交貨清單 (Delivery Notes)</b> 是以<b>交貨文件 (Delivery)</b> 為基準建立的，而且<b>每張交貨文件只會產生一張交貨清單</b>。</p>
<p>交貨清單隨貨附給顧客，內容包括：對應的銷售訂單與交貨日期、顧客名稱、地址與聯絡方式、品名、規格與交貨數量、負責交貨的組織與配送管道，以及出貨地點。</p>
<div class="tip"><b>易混淆：</b>排程協議（出貨協議）是「交貨文件」的來源之一，不是「交貨清單」的來源。流程是 銷售訂單／排程協議 → 交貨文件 → 交貨清單。</div>` },

{ id:16, stem:"根據運輸規劃的結果，系統會參考相關的資料，自動地決定最適合之裝載點。這些資料<u>不包括</u>：",
  opts:["出貨點之所在","出貨方式","挑料方式","裝載設備"], ans:2,
  exp:`<p>系統決定裝載點時參考的資料：</p>
<ul><li>出貨點之所在</li><li>出貨方式（出貨條件）</li><li>裝載設備（裝載群組，例如堆高機、吊車）</li></ul>
<p><b>挑料方式</b>屬於倉庫內部的作業方法，不影響裝載點的決定。</p>` },

{ id:17, stem:"銷售與配銷模組的最後一項交易流程為：",
  opts:["運輸規劃","交貨","扣帳","請款"], ans:3,
  exp:`<div class="flow"><span class="n">售前活動</span><span class="a">→</span><span class="n">銷售訂單</span><span class="a">→</span><span class="n">交貨／挑料</span><span class="a">→</span><span class="n">運輸</span><span class="a">→</span><span class="n">出貨扣帳</span><span class="a">→</span><span class="n"><b>請款</b></span></div>
<p>請款 (Billing) 是 SD 的最後一步。請款文件過帳後，資料會轉到財務會計模組，產生應收帳款；後續收款由財會模組處理。</p>` },

{ id:18, stem:"在銷售與配銷模組中，有關回扣 (Rebate) 的敘述，下列何者正確？",
  opts:["當顧客符合某一特定條件時，給予訂價上的折扣","當顧客在某一特定的時間內，購買超過特定數量或金額的產品時，退還某一部分的金額給顧客","當企業採購超過某一特定金額時，給予採購人員特殊的待遇","當供應商與企業合作超過某段時間之後，給予企業的優待"], ans:1,
  exp:`<p><b>回扣 (Rebate)</b> 是事後計算的特殊折扣：顧客在<b>特定期間內</b>累積購買量或金額達到門檻，企業再<b>退還一部分金額</b>給顧客（依回扣協議計算，並以貸項通知單結算）。</p>
<ul><li>A 是一般折扣，在訂價時就直接扣掉，不是事後退還。</li><li>C、D 描述的是採購端的情況，跟 SD 的回扣無關。</li></ul>` },

{ id:19, stem:"下列承（允）諾可用量 (ATP) 的公式計算，何者正確？",
  opts:["存貨 + 計劃收料 − 實際扣料","存貨 − 實際收料 + 實際扣料","存貨 + 計劃收料項目 − 計劃扣料項目","存貨 − 計劃進料數量 + 計劃出料數量"], ans:2,
  exp:`<p style="font-size:1.05rem"><b>ATP ＝ 現有存貨 ＋ 計劃收料項目 − 計劃扣料項目</b></p>
<ul><li>計劃收料：採購單、生產訂單、計劃訂單等（未來會進來的量）</li>
<li>計劃扣料：銷售訂單、交貨、保留存貨等（未來會用掉的量）</li></ul>
<div class="tip"><b>記法：</b>ATP 看的是「未來」，所以加減的都是「計劃」數量，進來用加、出去用減。</div>` },

{ id:20, stem:"銷售與配銷模組之企業情境可分為哪三類：(1) 需求反應策略 (2) 一般訂單處理 (3) 特殊訂單處理 (4) 一般物料處理 (5) 特殊物料處理",
  opts:["135","123","145","124"], ans:0,
  exp:`<p>官方題庫（試題指南第 61 題）的答案是 <b>135</b>，三類企業情境為：</p>
<ul><li>(1) <b>需求反應策略</b>：存貨生產、訂單裝配、訂單生產、訂單設計</li>
<li>(3) <b>特殊訂單處理</b>：例如緊急訂單、現金銷售、退貨、借項／貸項通知單請求</li>
<li>(5) <b>特殊物料處理</b>：需要特別處理的物料流程</li></ul>
<p>「一般訂單處理」是 SD 的標準流程，不另外列成一類「企業情境」。</p>
<div class="tip"><b>記法：</b>需求反應策略 ＋ 兩個「特殊」（特殊訂單、特殊物料）→ 135。這題容易直覺選 123，要特別注意。</div>` }
];

const OFF = [{"n": 1, "ch": "第一章 企業資源規劃簡介", "stem": "ERP 系統最新的主流趨勢是採用下列哪一種基本技術架構", "opts": ["集中式架構", "分散式架構", "同儕計算架構", "多層式(Multi-tier)主從架構"], "ans": 3, "exp": "ERP 的主流技術架構是<b>多層式 (Multi-tier) 主從架構</b>：分成展示層、應用層、資料庫層，方便擴充，也能支援網頁存取。集中式（大型主機）是早期的架構。"}, {"n": 2, "ch": "第一章 企業資源規劃簡介", "stem": "ERP 系統能即時整合各流程資料的原因為", "opts": ["各流程資料儲存於同一資料庫中", "快速的電腦運算", "電子商務的盛行", "政府鼓勵"], "ans": 0, "exp": "ERP 的核心是<b>單一整合資料庫</b>：各模組共用同一份資料，一個地方輸入、全公司即時更新，所以能即時整合。"}, {"n": 3, "ch": "第一章 企業資源規劃簡介", "stem": "對 ERP 系統而言，下列敘述何者為非", "opts": ["ERP 強調的是資料的整合，而即時性並不重要", "ERP 系統採主從式(Client-Server)架構", "ERP 系統為企業 e 化核心", "ERP 乃是一財務會計導向的資訊系統"], "ans": 0, "exp": "ERP 同時強調資料的<b>整合</b>與<b>即時性</b>，A 說「即時性不重要」是錯的。B、C、D 都是 ERP 的正確特性（ERP 源自財會導向的 MRP II 延伸）。"}, {"n": 4, "ch": "第一章 企業資源規劃簡介", "stem": "以下何種模組所負責的業務部份較不屬於 ERP 的範籌", "opts": ["倉儲管理", "財務模組", "製造現場控制(SFC)", "銷售/配送模組"], "ans": 2, "exp": "製造現場控制 (SFC) 一般屬於 MES（製造執行系統）的範疇，較不屬於 ERP。倉儲、財務、銷售配送都是 ERP 的核心模組。"}, {"n": 5, "ch": "第一章 企業資源規劃簡介", "stem": "一個能夠整合企業所有經營管理的資訊系統應該具備有", "opts": ["123", "234", "145", "134"], "ans": 0, "exp": "整合性資訊系統應該提供整合且即時的資訊、支援營運與決策、讓系統之間共享資訊 → 123。(4) 產品設計屬於 PDM／CAD，(5) 備份與金鑰檔案不是 ERP 的目的。", "items": ["(1) 提供整合且即時的資訊", "(2) 支援企業運作及決策制定", "(3) 系統之間能夠共享資訊", "(4) 提升產品設計效率與績效", "(5) 能夠累積眾多的備份資料與密碼金鑰檔案"]}, {"n": 6, "ch": "第二章 企業流程管理與 ERP", "stem": "隨著全球 e 化經濟以及資訊技術的不斷創新，有關企業流程的理論與應用逐漸成熟後，使得產業進展朝著新的方向前進，但新的方向中並不包含下列哪一選項", "opts": ["虛擬社群", "企業間協同運作(Collaboration)", "電子化市集(e-Marketplace)", "延伸式供應鏈(Extended Supply Chain)"], "ans": 0, "exp": "新的方向包括企業間協同運作、電子化市集、延伸式供應鏈；<b>虛擬社群</b>不屬於企業流程理論發展的新方向。"}, {"n": 7, "ch": "第二章 企業流程管理與 ERP", "stem": "何者是網路經濟中被定位為落實企業電子化的基礎系統，因為它是網路經濟中最關鍵的資訊技術之一", "opts": ["顧客關係管理系統", "物料規劃系統", "企業資源規劃系統", "供應鏈管理系統"], "ans": 2, "exp": "<b>ERP</b> 被定位為落實企業電子化的基礎（骨幹）系統。CRM、SCM 等延伸系統都建立在 ERP 的資料之上。"}, {"n": 8, "ch": "第二章 企業流程管理與 ERP", "stem": "隨著全球 e 化經濟及資訊技術不斷創新，下列何者不是企業環境的發展趨勢", "opts": ["企業間協同運作", "延伸式供應鏈", "虛擬企業群", "全面品質管理(TQM)"], "ans": 3, "exp": "e 化經濟下的趨勢有企業間協同運作、延伸式供應鏈、虛擬企業群等。<b>全面品質管理 (TQM)</b> 是傳統的品質管理哲學，不是 e 化帶來的新趨勢。"}, {"n": 9, "ch": "第二章 企業流程管理與 ERP", "stem": "何謂最佳實務範例(Best Practices)，下列敘述何者正確", "opts": ["企業所在產業第一名企業的作業流程", "ERP 軟體廠商所提供的標準流程", "理論上最好的作業流程", "最適合企業的作業流程"], "ans": 1, "exp": "最佳實務範例 (Best Practices) 是指 <b>ERP 軟體廠商</b>整理各產業成功經驗後，內建在系統中的<b>標準流程</b>，不一定是最適合某一家企業的流程。"}, {"n": 10, "ch": "第二章 企業流程管理與 ERP", "stem": "下列有關企業流程的定義，何者錯誤", "opts": ["為達成既定的企業目的，利用有限資源執行一組邏輯性相關的作業與分項任務", "因事件驅動，執行一連續的加值活動以滿足各種利益關係人", "規劃與執行有關採購、生產、銷售、服務等前台與內部的作業", "清楚定義特定流程的 5 個 W 與 3 個 H"], "ans": 2, "exp": "企業流程是跨部門、以事件驅動的加值活動，同時涵蓋前台與後台。C 只強調「前台與內部作業」，描述不完整，所以是錯的。A、B、D 都是正確的定義。"}, {"n": 11, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，下列何者為企業從事行銷作業(Marketing Activity)時，最常用而且為最有效的方式", "opts": ["直效郵遞 (Direct Mailing, DM)", "研討會", "銷售電話", "銷售講座"], "ans": 0, "exp": "<b>直效郵遞 (DM)</b> 是行銷作業中最常用、也最有效的方式：可以鎖定目標顧客，成本低，回應率也能衡量。"}, {"n": 12, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，下列何者意謂著我們以事先預測市場需求來安排生產，且當我們接受銷售訂單時直接以存貨來滿足銷售訂單的需求", "opts": ["Make to Order", "Make to Stock", "Configure to Order", "Assembly to Order"], "ans": 1, "exp": "先預測市場需求安排生產、接單後直接用存貨出貨 → <b>存貨生產 (Make to Stock, MTS)</b>。"}, {"n": 13, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，有關銷售訂單和交貨文件之間的關係，下列何者錯誤", "opts": ["一張銷售訂單可以對應多張交貨文件", "一張銷售訂單可以對應一張交貨文件", "多張銷售訂單可以對應一張交貨文件", "一張銷售訂單不可以對應多張交貨文件"], "ans": 3, "exp": "銷售訂單與交貨文件可以一對一、一對多（局部交貨）、多對一（合併交貨）。D 說「不可以一對多」是錯的。"}, {"n": 14, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，有關退款(Rebate)的敘述，下列何者正確", "opts": ["當顧客符合某一特定條件時，給予訂價上的折扣", "當顧客在某一特定的時間內，購買超過特定數量或金額的產品時，退還某一部分的金額給顧客的購物回饋", "當企業採購超過某一特定金額時，給予採購人員特殊的待遇", "當供應商與企業合作超過某段時間之後，給予企業的優待"], "ans": 1, "exp": "Rebate（退款／回扣）：顧客在<b>特定期間內</b>購買達到一定數量或金額時，<b>事後退還</b>部分金額。A 是一般折扣；C、D 跟採購有關，不是 SD 的回扣。"}, {"n": 15, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，「生產的成品是少量多樣，除了能快速回應顧客的需求外，並且使供應商的成品存貨降至最低」，具有此優點的需求反應策略是", "opts": ["存貨生產", "訂單生產", "訂單裝配", "訂單設計"], "ans": 2, "exp": "訂單裝配 (ATO)：先備好共用零組件，接單後依顧客需求組裝 → 少量多樣、回應快、<b>成品存貨最低</b>。這是官方標準答案，請直接記住。"}, {"n": 16, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組之顧客主檔資料中，對於財務與會計部門相當重要的財會資料會記錄在哪一資料結構中", "opts": ["一般資料", "銷售與配銷資料", "公司代碼資料(Company Code Data)", "以上皆非"], "ans": 2, "exp": "顧客主檔的<b>公司代碼資料</b>記錄統制科目、付款條件、催款等財會資料；一般資料是名稱與地址，銷售與配銷資料是定價與出貨條件。"}, {"n": 17, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，下列有關銷售之物料主檔資料的敘述，何者錯誤", "opts": ["產品與服務在 ERP 系統中皆以物料來概括", "一般而言，物料主檔資料是以功能部門來區分，提供系統在各類交易中所需的資料", "物料類型的選定會影響整個銷售的交易流程", "所有物料類型所產生的銷售訂單，其訂單處理方式皆相同"], "ans": 3, "exp": "物料類型會影響銷售流程（例如服務、成品、寄售品的處理方式不同），所以 D「處理方式皆相同」是錯的。"}, {"n": 18, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，有關顧客-產品資訊記錄、顧客資料主檔及物料資料主檔等三種資料的優先權狀況，下列敘述何者正確", "opts": ["三種資料中以顧客-產品資訊記錄的優先權最高", "三種資料中以顧客資料主檔的優先權最高", "三種資料中以物料資料主檔的優先權最高", "三者之優先權都一樣高"], "ans": 0, "exp": "資料愈具體，優先權愈高：<b>顧客-產品資訊記錄</b>（特定顧客對特定產品）> 顧客主檔／物料主檔。"}, {"n": 19, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，有關銷售支援的相關敘述，下列何者錯誤", "opts": ["銷售支援提供工具與功能讓行銷與銷售部門得以有效率地執行顧客關係服務與企業發展活動", "銷售支援可區分為促銷與銷售活動等兩類", "在銷售過程中，直效郵遞最為常用且有效的方式", "銷售支援(Sales Support)只對目前的顧客提供服務，開發新的潛在顧客並不包含在其中"], "ans": 3, "exp": "銷售支援也要<b>開發新的潛在顧客</b>，不只服務現有顧客，所以 D 是錯的。"}, {"n": 20, "ch": "第三章 銷售與配銷模組", "stem": "在 ERP 系統的銷售與配銷模組(SD)之出貨排程(Delivery Schedule)中，顧客所訂購的產品已經生產或購買完成，並準備開始執行挑料與包裝的期限，稱為", "opts": ["物料可用期限", "挑料/包裝期限", "裝載期限", "生產期限"], "ans": 0, "exp": "產品已生產或購入完成、準備開始挑料與包裝的時點 → <b>物料可用期限</b>。出貨排程依序為：物料可用 → 運輸規劃 → 裝載 → 系統扣帳（出貨）。"}, {"n": 21, "ch": "第三章 銷售與配銷模組", "stem": "在 ERP 系統的銷售與配銷模組(SD)之出貨排程(Delivery Schedule)中，裝載時間是指裝載期限與下列哪一期限之時間間距", "opts": ["物料可用期限", "運輸規劃期限", "生產期限", "系統扣帳之時間"], "ans": 3, "exp": "裝載時間 ＝ 裝載期限到<b>系統扣帳（出貨）</b>之間的時間。"}, {"n": 22, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，交貨清單(Delivery Notes)之建立是以何者為基準", "opts": ["交貨文件(Delivery)", "出貨通知單", "顧客契約", "出貨協議"], "ans": 0, "exp": "交貨清單 (Delivery Notes) 是以<b>交貨文件 (Delivery)</b> 為基準產生的，會隨貨附給顧客。"}, {"n": 23, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，交貨文件與交貨清單之間的對應關係下列何者正確", "opts": ["每張交貨文件只會產生一張交貨清單", "每張交貨文件可產生多張交貨清單", "多張交貨文件可匯整產生一張交貨清單", "交貨文件不會產生任何交貨清單，基本上兩文件之間是無任何對應關係"], "ans": 0, "exp": "<b>每張交貨文件只會產生一張交貨清單</b>，兩者是一對一的關係。"}, {"n": 24, "ch": "第三章 銷售與配銷模組", "stem": "銷售與配銷模組的最後一項交易流程為", "opts": ["運輸規劃", "交貨", "扣帳", "請款(Billing)"], "ans": 3, "exp": "SD 流程：售前活動 → 銷售訂單 → 交貨 → 出貨扣帳 → <b>請款 (Billing)</b>。請款是最後一步，之後交給財會模組處理收款。"}, {"n": 25, "ch": "第三章 銷售與配銷模組", "stem": "在銷售配銷模組的企業情境需求反應策略中，採取沒有特定的成品規格限定於顧客訂單中，而是根據顧客的功能需求描述加以量身訂做(Tailor Made)，亦即強調收到顧客需求後，再設計產品以滿足顧客要求，此種方式稱為", "opts": ["訂單裝配", "訂單設計(Engineer to Order, ETO)", "訂單生產", "存貨生產"], "ans": 1, "exp": "沒有既定成品規格，接單後才依顧客功能需求設計產品（量身訂做） → <b>訂單設計 (ETO)</b>。"}, {"n": 26, "ch": "第三章 銷售與配銷模組", "stem": "在 ERP 系統中通常會以允諾可用量(ATP)來當作可用量查核的基礎，以確定能夠準時地依照顧客要求的交貨日，將該產品運送至顧客手中，而通常 ATP 的計算公式為(存貨) + (計劃收料項目) - (計劃扣料項目)，假如 Ben 公司的產品 X 在某一規劃期間內的存貨為 64 件，計劃扣料項目有 53 件，且無任何計劃收料項目件數，則 ATP 為多少件數", "opts": ["7", "11", "0", "9"], "ans": 1, "exp": "ATP ＝ 存貨 ＋ 計劃收料 − 計劃扣料 ＝ 64 ＋ 0 − 53 ＝ <b>11</b>。"}, {"n": 27, "ch": "第三章 銷售與配銷模組", "stem": "根據 Leem(2002)之定義，所謂的企業情境是一種樣版(Template)，根據企業組織的需求，提供其在不同的企業事例之下，制定整企業流程之參考，也就是說，企業情境是制定企業流程根源之所在，而企業流程則能反應出企業組織在不同情境下之運作模式，在 ERP 系統的銷售與配銷模組中所定義的企業情境不包括下列哪一選項", "opts": ["特殊顧客處理", "需求反應策略", "特殊訂單處理", "特殊物料處理"], "ans": 0, "exp": "SD 的企業情境分為三類：需求反應策略、特殊訂單處理、特殊物料處理。沒有「特殊顧客處理」。"}, {"n": 28, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，出貨排程(Delivery Schedule)規劃了所有訂購產品被運送至顧客手中的相關作業活動的期限，其中物料可用期限與裝載期限之時間間距被稱為", "opts": ["運送時間", "裝載時間", "運輸規劃前置時間", "挑料/包裝時間"], "ans": 3, "exp": "物料可用期限到裝載期限的間距 → <b>挑料／包裝時間</b>（物料要先挑好、包好才能裝載）。"}, {"n": 29, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，出貨排程(Delivery Schedule)規劃了所有訂購產品被運送至顧客手中的相關作業活動的期限，其中挑料/包裝時間是在什麼期限之後", "opts": ["系統扣帳", "裝載", "運輸規劃", "物料可用"], "ans": 3, "exp": "挑料／包裝時間從<b>物料可用期限</b>之後開始計算。"}, {"n": 30, "ch": "第三章 銷售與配銷模組", "stem": "在 ERP 系統中，組織架構是區分各式主檔資料與文件類型的重要準則，並且可以據此執行嚴密的權限控制，因此系統上的組織架構必須詳細地分析與定義。在銷售與配銷模組中，下列何者不屬於主檔資料的銷售夥伴(Sales Partner)", "opts": ["銷售對象", "業務代表", "運輸代理商", "DaaS 業者"], "ans": 3, "exp": "銷售夥伴包括銷售對象（顧客）、業務代表、運輸代理商等。DaaS（資料即服務）業者是雲端服務的名詞，跟 SD 主檔無關。"}, {"n": 31, "ch": "第三章 銷售與配銷模組", "stem": "在銷售支援中，企業以各種型式的作業促銷產品，當促銷作業完成後，則有可能與顧客簽訂要項協議(Outline Agreement)，下列有關要項協議的敘述，何者正確", "opts": ["顧客會開出出貨排程來履行契約", "顧客會開出銷售訂單(Sales Orders)來履行契約", "顧客會以多張詢價單來履行契約", "顧客會根據企業的報價單來履行契約"], "ans": 1, "exp": "要項協議（顧客契約／出貨協議）簽訂後，顧客會在協議期間內<b>開出銷售訂單</b>（release order）來履行契約。"}, {"n": 32, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，為了因應不同的出貨對象或不同的交期，將一張訂單切分為數張不同的交貨文件，此為", "opts": ["局部交貨(Partial Delivery )", "完全交貨(Complete Delivery )", "訂單合併(Order Combination )", "訂單分割(Order Segment)"], "ans": 0, "exp": "因為出貨對象或交期不同，把一張訂單拆成數張交貨文件 → <b>局部交貨 (Partial Delivery)</b>。"}, {"n": 33, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，將一張交貨文件分割成多張顧客發票是下列哪一種 ERP 系統提供的請款方式(Billing Methods)", "opts": ["匯集的顧客發票", "分離的顧客發票(Split Billing Documents)", "個別的顧客發票", "區隔的顧客發票"], "ans": 1, "exp": "一張交貨文件拆成多張發票 → <b>分離的顧客發票 (Split Billing)</b>。"}, {"n": 34, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，以交貨文件為根據，每一張交貨文件產生一張顧客發票是下列哪一種ERP 系統提供的請款方式(Billing Methods)", "opts": ["個別的顧客發票(Individual Billing Documents)", "匯集的顧客發票", "分離的顧客發票", "區隔的顧客發票"], "ans": 0, "exp": "每張交貨文件各開一張發票 → <b>個別的顧客發票 (Individual Billing)</b>。"}, {"n": 35, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，不論訂單多寡只要符合先前定義之準則即產生一張顧客發票是下列哪一種 ERP 系統提供的請款方式(Billing Methods)", "opts": ["個別的顧客發票", "匯集的顧客發票(Collective Billing Documents)", "分離的顧客發票", "區隔的顧客發票"], "ans": 1, "exp": "不論訂單多寡，只要符合事先定義的準則就合併成一張發票 → <b>匯集的顧客發票 (Collective Billing)</b>。"}, {"n": 36, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，記載有對應的銷售訂單與交貨日期、顧客之名稱、地址與連絡方式、產品的品名、規格與交貨數量、負責交貨之組織與配送管道、出貨地點的文件是", "opts": ["交貨文件", "揀貨單", "出貨通知", "交貨清單(Delivery Notes)"], "ans": 3, "exp": "記載訂單與交貨日期、顧客資訊、品名規格數量、出貨組織與地點，並隨貨交給顧客的文件 → <b>交貨清單 (Delivery Notes)</b>。"}, {"n": 37, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，當產品的計價過低時，用以在請款時，成為建立借方憑證之根據，此狀況下所產生的文件為", "opts": ["貸項憑證請求", "借項憑證請求(Dedit Memo Request)", "緊急訂單", "售回訂單"], "ans": 1, "exp": "計價過低 → 要向顧客追加收款 → <b>借項憑證請求 (Debit Memo Request)</b>；計價過高則用貸項憑證請求。"}, {"n": 38, "ch": "第三章 銷售與配銷模組", "stem": "銷售之組織架構若以銷售區域之觀點而言，典型的批發商、零售商與直銷商等都被定義為", "opts": ["銷售群組", "配銷管道(Distribution Channel)", "部門", "銷售組織"], "ans": 1, "exp": "批發商、零售商、直銷商是產品到達顧客的不同通路 → <b>配銷管道 (Distribution Channel)</b>。"}, {"n": 39, "ch": "第三章 銷售與配銷模組", "stem": "銷售之組織架構若以銷售區域之觀點而言，在單一企業組織下，負責銷售各式不同產品線或是產品家族的組織單位為", "opts": ["銷售組織", "銷售群組", "部門(Division)", "配銷管道"], "ans": 2, "exp": "負責不同產品線或產品家族的組織單位 → <b>部門 (Division)</b>。"}, {"n": 40, "ch": "第三章 銷售與配銷模組", "stem": "下列何者不是 ERP 的銷售與配銷模組的主要功能", "opts": ["允諾可用量(ATP)的自動查核", "詢價、報價和訂單的處理與監控", "出貨點和路線之安排", "庫存盤點作業"], "ans": 3, "exp": "<b>庫存盤點</b>屬於庫存管理／物料管理模組，不是 SD 的功能。"}, {"n": 41, "ch": "第三章 銷售與配銷模組", "stem": "下列承(允)諾可用量(ATP)的公式計算，何者正確", "opts": ["存貨 + 計劃收料 - 實際扣料", "存貨 - 實際收料 + 實際扣料", "存貨 + 計劃收料項目(Planned Receipt Item) - 計劃扣料項目(Planned Issue Items)", "存貨 - 計劃進料數量 + 計劃出料數量"], "ans": 2, "exp": "ATP ＝ 存貨 ＋ <b>計劃收料項目</b> − <b>計劃扣料項目</b>。ATP 看的是未來，所以用「計劃」數量。"}, {"n": 42, "ch": "第三章 銷售與配銷模組", "stem": "當系統建立銷售訂單或交貨文件時，經由系統相關的設定，可以自動地驅動物料管理(MM)模組中的什麼功能，使其他的交易不得再使用該項存貨", "opts": ["生產排程", "保留存貨(Reservation)", "進貨檢驗", "庫存盤點"], "ans": 1, "exp": "建立訂單或交貨文件時，會驅動 MM 的<b>保留存貨 (Reservation)</b>，避免同一批存貨被其他交易使用。"}, {"n": 43, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組(SD)與成本控制模組(CO)的關係中，當顧客訂單產生時系統即可將預期營收及相關成本資料傳送至成本控制模組(CO)可以執行下列哪一選項", "opts": ["銷售需求與物料需求規劃", "工作分解結構與會計要素", "保留存貨與系統自動扣帳", "利潤能力分析(Profitability Analysis)與實際利潤評估"], "ans": 3, "exp": "訂單產生時，預期營收與成本會傳到 CO 做<b>獲利能力分析 (CO-PA)</b>，請款後再做實際利潤評估。"}, {"n": 44, "ch": "第三章 銷售與配銷模組", "stem": "企業面對不同的商業環境時會使用採取相對應的需求反應策略做為回應，請問事先預測市場上成品的需求，是屬於需求反應策略的哪一種", "opts": ["存貨生產(Make to Stock)", "訂單生產(Make to Order)", "訂單裝配(Assembly to Order)", "訂單設計(Engineer to Order)"], "ans": 0, "exp": "事先預測成品需求並先生產 → <b>存貨生產 (MTS)</b>。"}, {"n": 45, "ch": "第三章 銷售與配銷模組", "stem": "企業面對不同的商業環境時會使用採取相對應的需求反應策略做為回應，請問直接裝配零組件以符合顧客需求是屬於需求反應策略的哪一種", "opts": ["訂單設計(Engineer to Order)", "訂單生產(Make to Order)", "訂單裝配(Assembly to Order)", "存貨生產(Make to Stock)"], "ans": 2, "exp": "直接裝配零組件以符合顧客需求 → <b>訂單裝配 (ATO)</b>。"}, {"n": 46, "ch": "第三章 銷售與配銷模組", "stem": "企業面對不同的商業環境時會使用採取相對應的需求反應策略做為回應，請問根據顧客功能需求加以量身訂做(Tailor Made)是屬於需求反應策略的哪一種", "opts": ["存貨生產(Make to Stock)", "訂單裝配(Assembly to Order)", "訂單生產(Make to Order)", "訂單設計(Engineer to Order)"], "ans": 3, "exp": "依顧客功能需求量身訂做 → <b>訂單設計 (ETO)</b>。"}, {"n": 47, "ch": "第三章 銷售與配銷模組", "stem": "企業面對不同的商業環境時會使用採取相對應的需求反應策略做為回應，請問根據訂單規格加以生產是屬於需求反應策略的哪一種", "opts": ["存貨生產(Make to Stock)", "訂單生產(Make to Order)", "訂單設計(Engineer to Order)", "訂單裝配(Assembly to Order)"], "ans": 1, "exp": "依訂單規格生產 → <b>訂單生產 (MTO)</b>。"}, {"n": 48, "ch": "第三章 銷售與配銷模組", "stem": "在 ERP 系統建立顧客訂單時，除了會直接轉契約文件或報價單中直接轉置資料以外，尚會參考一些儲存於其他主檔中的資料，而下列何者是不需要納入參考的其他主檔資料", "opts": ["從顧客主檔轉置而來", "從物料主檔轉置而來", "從庫存主檔轉置而來", "從產品-物料資訊主檔轉置而來"], "ans": 2, "exp": "建立訂單時會參考顧客主檔、物料主檔、顧客-產品資訊主檔。沒有「庫存主檔」這種轉置來源。"}, {"n": 49, "ch": "第三章 銷售與配銷模組", "stem": "企業面對不同的商業環境時會使用採取相對應的需求反應策略做為回應，而下列哪一項需求反應策略，產品的生產批量最小", "opts": ["存貨生產(MTS)", "訂單生產(MTO)", "訂單裝配(ATO)", "訂單設計(ETO)"], "ans": 3, "exp": "訂單設計 (ETO) 完全客製化，通常一次只做一件，<b>生產批量最小</b>。"}, {"n": 50, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，當下列那些文件產生時，ERP 系統即自動地執行可用量之查核", "opts": ["234", "23", "34", "1234"], "ans": 0, "exp": "報價單、銷售訂單、交貨文件產生時都會執行可用量查核 → 234。詢價單只是詢問，不會查核。", "items": ["(1) 顧客詢價單", "(2) 顧客報價單(Quotation)", "(3) 銷售訂單(Sales Order)", "(4) 交貨文件(Delivery)"]}, {"n": 51, "ch": "第三章 銷售與配銷模組", "stem": "如果該企業所生產的成品是少量多樣，除了能快速回應顧客的需求外，並且使供應商的成品存貨降至最低，此為何種企業情境之特性", "opts": ["存貨生產", "訂單生產", "訂單裝配", "訂單設計"], "ans": 2, "exp": "同第 15 題：少量多樣、回應快、成品存貨最低 → <b>訂單裝配 (ATO)</b>。"}, {"n": 52, "ch": "第三章 銷售與配銷模組", "stem": "當系統出貨扣帳完成後，下列那些功能會被自動執行", "opts": ["123", "245", "345", "124"], "ans": 3, "exp": "出貨扣帳後：存貨價值減少 (1)、MRP 需求量減少 (2)、產生成本會計文件 (4) → 124。保留存貨是減少不是增加，計劃訂單也不會因此產生。", "items": ["(1) 會計科目中的存貨價值同時減少", "(2) MRP 中的需求量根據出貨數量而減少", "(3) 保留存貨(Reservations)項目增加", "(4) 成本會計文件同時產生", "(5) 計劃訂單(Planned Orders)同時產生"]}, {"n": 53, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，交貨文件的來源可分為哪三種", "opts": ["123", "235", "124", "234"], "ans": 1, "exp": "交貨文件的來源：出貨協議 (2)、銷售訂單 (3)、手動產生 (5) → 235。", "items": ["(1) 從顧客契約轉置而來", "(2) 從出貨協議轉置而來", "(3) 從銷售訂單轉置而來", "(4) 從顧客報價單轉置而來", "(5) 手動產生交貨文件"]}, {"n": 54, "ch": "第三章 銷售與配銷模組", "stem": "在銷售與配銷模組中，而當交貨文件建立時，系統會自動地執行以下那些功能", "opts": ["234", "245", "123", "134"], "ans": 3, "exp": "建立交貨文件時，系統會計算出貨工作量 (1)、查核並調整出貨排程 (3)、再次查核可用量 (4) → 134。", "items": ["(1) 計算出貨的工作量",
