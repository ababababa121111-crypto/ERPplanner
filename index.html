可能發生之產能不足的問題進行適當之產能控管", "極大化一公司各種有價值資源的利用"], "ans": 0, "exp": "把成本與活動連結到成本中心，是<b>成本控制</b>的目的。生產規劃的目的是調和供需、控管瓶頸產能、極大化資源利用。"}, {"n": 79, "ch": "第四章 生產規劃與控制", "stem": "在 MPS 與 MRP 規劃時，為避免規劃變動的困擾，對近日內工單的生產排程將其確定住，並且不讓系統自動的加以改變，此時間範圍稱為", "opts": ["零件時期(Part Period)", "再訂購點(Reorder Point)", "規劃時間圍籬", "生產前置時間(Production Lead Time)"], "ans": 2, "exp": "把近期工單鎖定、不讓系統自動改變的時間範圍 → <b>規劃時間圍籬 (Planning Time Fence)</b>。"}, {"n": 80, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，下列何者描寫了一個產品是由下層那些零組件所組成的", "opts": ["途程(Routing)", "工作中心(Work Center)", "物料清單", "物料主檔(Material Master)"], "ans": 2, "exp": "描述產品由哪些下層零組件組成 → <b>物料清單 (BOM)</b>。"}, {"n": 81, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，下列何者為一作業或一活動被執行的地方", "opts": ["工作中心", "途程(Routing)", "物料清單(BOM)", "物料主檔(Material Master)"], "ans": 0, "exp": "作業或活動實際被執行的地方 → <b>工作中心 (Work Center)</b>。"}, {"n": 82, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，有關計劃中工單的描述，下列何者錯誤", "opts": ["英文名稱為 Planned Order", "也可以說是外購或是生產的提案(Proposal)", "專指給衛星工廠的單據", "依開立期間(Opening Period)決定何時轉成生產工單"], "ans": 2, "exp": "計劃中工單 (Planned Order) 是 MRP 產生的外購或生產「提案」，<b>不是</b>專門給衛星工廠的單據。"}, {"n": 83, "ch": "第四章 生產規劃與控制", "stem": "有關物料清單中低階編碼(Low-Level Coding)的敘述，下列何者正確", "opts": ["為了節省資料儲存和維護的成本", "為了控制 MRP 的規劃順序", "為了讓產品結構表看起來簡潔", "為了配合途程的需要"], "ans": 1, "exp": "低階編碼標示物料在所有 BOM 中出現的最低階層，用來<b>控制 MRP 的規劃順序</b>，確保相同物料彙總到最低階後才一起計算。"}, {"n": 84, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，有關工作中心(Work Center)、作業(Operation)與途程(Routing)之間的關係，下列敘述何者錯誤", "opts": ["一個工作中心可以對應多個途程", "一個途程可以包含多個工作中心", "一個途程可以有多個作業", "一個作業可以包含多個途程"], "ans": 3, "exp": "途程包含多個作業，每個作業在某個工作中心執行。「一個作業包含多個途程」顛倒了兩者的關係，所以 D 是錯的。"}, {"n": 85, "ch": "第四章 生產規劃與控制", "stem": "有關銷售與作業規劃(Sales and Operations Planning)的敘述，下列何者正確", "opts": ["規劃零組件或原物料的銷售而已", "規劃特定產品的產能", "調和一個公司中長期所需要的銷售量與生產量之間的關係", "是在安排機器排程的計畫"], "ans": 2, "exp": "S&OP 用來調和公司<b>中長期</b>產品群的銷售量與生產量。"}, {"n": 86, "ch": "第四章 生產規劃與控制", "stem": "有關相依需求(Dependent Requirement)的敘述，下列何者正確", "opts": ["與物料需求規劃(MRP)相關", "與需求管理相關", "可以讓顧客根據其需求下訂單", "是在說明銷售與作業規劃"], "ans": 0, "exp": "相依需求是由上層產品的需求，經 BOM 展開推導出來的零組件需求，由 <b>MRP</b> 計算。"}, {"n": 87, "ch": "第四章 生產規劃與控制", "stem": "ERP 系統中對每一物料皆有一規劃時間圍籬(Planning Time Fence)，下列對規劃時間圍籬的作用，何者敘述正確", "opts": ["在規劃需求管理", "在規劃銷售與作業計畫內容", "規劃特定產品群的產能需求", "系統是否自動重排相關工單"], "ans": 3, "exp": "規劃時間圍籬決定<b>系統是否自動重新排定</b>圍籬內的工單。"}, {"n": 88, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，何謂發放期間(Release Period)", "opts": ["指 MRP 與 MPS 之間的配合時段", "指計劃中工單可以被轉換成生產工單", "指生產工單(Production Order)可被發放至現場", "指 MRP 與 MPS 自動排程的時間"], "ans": 2, "exp": "發放期間 (Release Period) 決定<b>生產工單何時可以發放到現場</b>；開立期間 (Opening Period) 則決定計劃中工單何時轉成生產工單。"}, {"n": 89, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，有關途程(Routing)的敘述，下列何者錯誤", "opts": ["途程描寫一物從它的初始狀況到它的最終狀況的程序", "途程的目標在於以最有效率與最有效用的方式生產一個產品", "途程中定義了作業，並依序描寫作業在生產或服務發生的先後步驟", "途程對組織結構中之工廠不具有唯一性"], "ans": 3, "exp": "途程是依工廠而定的（同一產品在不同工廠可能有不同途程），也就是途程對工廠<b>具有唯一性</b>，所以 D 錯。"}, {"n": 90, "ch": "第四章 生產規劃與控制", "stem": "生產工單流程中，有關生產單位數及報廢的比率等資料，會記錄在下列哪一類工單完工確認資料中", "opts": ["物料資料", "資源有關資料", "工單有關資料", "人工有關資料"], "ans": 2, "exp": "生產數量與報廢比率屬於<b>工單有關資料</b>。"}, {"n": 91, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，下列何者包含了用以完成某一品項之一連串作業活動", "opts": ["工作中心(Work Center)", "物料清單(BOM)", "途程(Routing)", "物料主檔(Material Master)"], "ans": 2, "exp": "完成某品項的一連串作業 → <b>途程 (Routing)</b>。"}, {"n": 92, "ch": "第四章 生產規劃與控制", "stem": "在現代接單生產(尤其是 Configuration To Order 方式)環境中常使用的方式，將類似物料歸為一品類表示於物料清單，我們稱為", "opts": ["Configurable 物料清單", "ItemClass 物料清單", "SameType 物料清單", "Structure 物料清單"], "ans": 0, "exp": "接單組態生產 (CTO) 會把類似物料歸成一個品類，表示在<b>可組態 (Configurable) 物料清單</b>中。"}, {"n": 93, "ch": "第四章 生產規劃與控制", "stem": "生產工單流程中的哪一步驟執行前會將生產工單的狀態由開立(Created)轉為發放(Released)", "opts": ["生產工單產生", "執行生產工單", "完工確認與收貨", "生產工單發放"], "ans": 3, "exp": "在「生產工單發放」這一步，工單狀態會由開立 (Created) 轉為發放 (Released)。"}, {"n": 94, "ch": "第四章 生產規劃與控制", "stem": "一般 BOM 的展開會涉及非常龐大的資料量，為降低展開的困難，將此工作分為二階段進行，第一階段的展開對象為重要件(Critical Parts)，此品項被稱為", "opts": ["MRP 品項", "MTO 品項", "MTS 品項", "MPS 品項"], "ans": 3, "exp": "兩階段展開的第一階段處理重要件 → <b>MPS 品項</b>；第二階段才由 MRP 展開其餘物料。"}, {"n": 95, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制模組中，若以規劃時間幅度區分，下列何者屬於短期之生產規劃", "opts": ["主規劃", "需求管理(Demand Management)", "物料需求規劃(Material Requirement Planning, MRP)", "銷售與作業規劃(Sales and Operation Planning)"], "ans": 2, "exp": "以時間幅度區分：S&OP（長期）→ 需求管理／主規劃（中期）→ <b>MRP（短期）</b>。"}, {"n": 96, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制管理中，銷售與作業規劃的目的在於確定產品的生產型態與數量，調和公司所需要的銷售量與生產量之間的關係，而採用於銷售與作業規劃的資料可能來源不包括下列哪一選項", "opts": ["人工輸入相關銷售數量", "根據過去的歷史資料所預測的結果", "從獲利能力分析(Profitability Analysis)結果轉換過來", "允諾可用量(ATP)"], "ans": 3, "exp": "S&OP 的資料來源有人工輸入、歷史預測、獲利能力分析。<b>ATP</b> 是接單時查核可用量用的，不是 S&OP 的資料來源。"}, {"n": 97, "ch": "第四章 生產規劃與控制", "stem": "一般而言，MPS 與 MRP 的重新規劃與推算會對系統造成相當大的負擔，因此會盡量避免進行重新規劃與推算，而下列何者發生時不會使得 MPS 與 MRP 自動進行重新規劃與推算", "opts": ["發貨改變", "顧客訂單改變", "BOM 改變", "生產工單狀態(Status)從開立轉變為發放時"], "ans": 3, "exp": "工單狀態由開立轉為發放，並沒有改變供需數量，所以<b>不會</b>觸發 MPS／MRP 重新規劃。"}, {"n": 98, "ch": "第四章 生產規劃與控制", "stem": "在物料需求規劃中，相依需求被保留(Reservation)的時機為", "opts": ["銷售訂單輸入", "計劃中工單產生", "計劃中工單轉成生產工單", "主日程生產計劃輸入"], "ans": 2, "exp": "<b>計劃中工單轉成生產工單</b>時，零組件的相依需求才會被保留 (Reservation)。"}, {"n": 99, "ch": "第四章 生產規劃與控制", "stem": "下列何者為正確的生產工單部分流程順序", "opts": ["物料可獲得性確認-->生產工單的產生-->生產工單的發放", "完工確認與收貨-->差異計算-->工單結算", "物料可獲得性確認-->發料-->生產工單的發放", "發料-->收貨-->生產工單的完工確認"], "ans": 1, "exp": "正確順序是 完工確認與收貨 → 差異計算 → 工單結算。A、C、D 的順序都不對（應該先產生工單、再查核可用量、發放、發料）。"}, {"n": 100, "ch": "第四章 生產規劃與控制", "stem": "無論是否有任何供需的改變，所有物料皆重新規劃與推算的物料需求規劃方式屬於", "opts": ["淨變規劃(Net Change Planning)", "重規劃(Regenerative Planning)", "規劃時間幅度內的淨變規劃(Net Change Planning in Planning Horizon)", "系統神經質(System Nervousness)"], "ans": 1, "exp": "不論是否有變動，所有物料都重新計算 → <b>重規劃 (Regenerative Planning)</b>。只計算有變動的物料則是淨變規劃。"}, {"n": 101, "ch": "第四章 生產規劃與控制", "stem": "請問生產工單可由下列何者而來", "opts": ["34", "13", "12", "24"], "ans": 1, "exp": "生產工單可以由計劃中工單轉換 (1)，或由手工輸入產生 (3) → 13。", "items": ["(1) 可由轉換計劃中工單產生", "(2) 採購單", "(3) 可直接由手工輸入相關資料產生", "(4) 廠商轉來"]}, {"n": 102, "ch": "第四章 生產規劃與控制", "stem": "生產工單流程中從「生產工單產生」至「發料」中間的步驟，有", "opts": ["4321", "1234", "4312", "3412"], "ans": 1, "exp": "工單產生後的順序：物料可用量查核 → 預留機器產能 → 工單發放 → 列印工單 → 發料，所以是 1234。", "items": ["(1) 物料可用量查核", "(2) 預留機器產能", "(3) 生產工單發放", "(4) 列印生產工單，其正確順序為"]}, {"n": 103, "ch": "第四章 生產規劃與控制", "stem": "在 MRP 的規劃過程中，某一零組件 Y 於某當期之相關資料如右，期初庫存量 40 單位，當期供應量 13 單位，當期需求量 58 單位，則下列敘述何者正確", "opts": ["當期零組件 Y 的淨需求(Net Requirement)為 5 單位", "當期零組件 Y 的淨需求(Net Requirement)為 85 單位", "當期零組件 Y 的淨需求(Net Requirement)為 31 單位", "當期零組件 Y 的淨需求(Net Requirement)為 58 單位"], "ans": 0, "exp": "淨需求 ＝ 需求 − 期初庫存 − 供應量 ＝ 58 − 40 − 13 ＝ <b>5</b>。"}, {"n": 104, "ch": "第四章 生產規劃與控制", "stem": "下列何者為一公司內部各部門參與有關活動資料的重要連結，其依相關功能性部門加以分類，以利有關不同部門人員進行資料維護，這在資料的安全性與系統使用者權限之管制上，將因而更為便利", "opts": ["物料資料主檔(Material Master Data)", "途程", "工作中心", "物料清單"], "ans": 0, "exp": "依功能部門分類、各部門分別維護，並作為部門間資料連結的 → <b>物料主檔</b>。"}, {"n": 105, "ch": "第四章 生產規劃與控制", "stem": "下列何者將決定哪些生產工單為確定工單(Firmed orders)，於此次執行 MPS 或 MRP 後，將不再自動針對物料進行重新規劃與推算", "opts": ["生產工單預計完工日期", "生產工單的確定交貨量", "規劃時間圍籬(Planning Time Fence)", "規劃檔"], "ans": 2, "exp": "規劃時間圍籬內的工單成為確定工單 (Firmed)，不會被自動重排。"}, {"n": 106, "ch": "第四章 生產規劃與控制", "stem": "生產工單流程中結算(Settlement)的最重要目的在於", "opts": ["將工單的差異告知主管單位", "將工單的確認情形計算出來", "將工單的發料與生產的差異量登錄", "將工單的成本轉至適當的會計帳"], "ans": 3, "exp": "結算 (Settlement) 的目的是把工單累積的<b>成本轉到適當的會計帳</b>（例如存貨、差異科目）。"}, {"n": 107, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制管理過程中，下列何者與 BOM 中品項進行 MRP 的規劃順序有關", "opts": ["低階編碼(Low-level coding)", "計劃中工單日期", "生產工單日期", "訂單交貨日期"], "ans": 0, "exp": "MRP 的規劃順序由<b>低階編碼</b>決定。"}, {"n": 108, "ch": "第四章 生產規劃與控制", "stem": "根據市場分析或過去的歷史資料，確定一個公司中長期所需要的各產品群銷售量與所需要的生產量之間的關係，屬於下列那一種類的規劃", "opts": ["物料需求規劃", "主生產規劃", "需求管理", "銷售與作業規劃(S&OP)"], "ans": 3, "exp": "中長期、以產品群為單位調和銷售量與生產量 → <b>S&OP</b>。"}, {"n": 109, "ch": "第四章 生產規劃與控制", "stem": "下列那一種生產規劃的方式能夠用以連結市場導向銷售計劃與生產導向的需求管理與主生產排程", "opts": ["物料需求規劃", "銷售與作業規劃(S&OP)", "途程", "看板系統"], "ans": 1, "exp": "<b>S&OP</b> 承上啟下：連結市場導向的銷售計劃，以及生產導向的需求管理與 MPS。"}, {"n": 110, "ch": "第四章 生產規劃與控制", "stem": "接單生產(Make To Order)、存貨生產(Make To Stock)、大量生產/重複性生產(Repetitive Manufacturing)、流程製造(Process Manufacturing)等等屬於", "opts": ["不同形態的生產方式", "不同觀念的規劃方式", "不同規劃時間幅度", "相對應之資料整合程度"], "ans": 0, "exp": "MTO、MTS、重複性生產、流程製造都是<b>不同形態的生產方式</b>。"}, {"n": 111, "ch": "第四章 生產規劃與控制", "stem": "在需求管理中，物料清單(Bill of Material) 有所謂的分割線，是將存貨層級降至次裝配品的層級，完成品的最後幾個作業步驟是等到接獲訂單後才開始進行。此分割線是基於什麼樣的考量而設置", "opts": ["Configurable BOM", "配方", "規劃策略(Planning Strategy)", "途程"], "ans": 2, "exp": "BOM 分割線把存貨層級放在次裝配品，最後的作業等接單後才做，這是依<b>規劃策略 (Planning Strategy)</b> 設定的。"}, {"n": 112, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制管理模組中，有些 ERP 系統會有開立期間(Opening Period)與發放期間(Release Period)，請問開立期間決定了下列何者", "opts": ["顧客帳開帳時間", "計劃中工單產生時間", "生產工單產生時間", "成本帳過帳時間"], "ans": 2, "exp": "開立期間決定<b>生產工單的產生時間</b>（計劃中工單何時轉成生產工單）。"}, {"n": 113, "ch": "第四章 生產規劃與控制", "stem": "物料資料主檔為生產過程中，一個非常重要的資料，下列有關物料資料主檔的描述何者錯誤", "opts": ["為企業內部各部門重要活動的資料連結", "描寫了一個產品由下層哪些零組件所組成的", "英文名稱為 Material Master Data", "根據一物一料號的原則，每一物皆有唯一的號碼"], "ans": 1, "exp": "「描述產品由哪些零組件組成」是 <b>BOM</b>，不是物料主檔，所以 B 錯。"}, {"n": 114, "ch": "第四章 生產規劃與控制", "stem": "要使企業資源規劃(ERP)系統中生產規劃與控制的功能得以順利進行，須先建立相關資料主檔，而以下何者非生產規劃所需的基本資料", "opts": ["物料清單(BOM)、途程(Routing)", "物料資料主檔(Material Master Data)、生產相關文件", "物料扣帳、總帳會計文件", "生產所需的資源與器具、工作中心(Work Center)"], "ans": 2, "exp": "物料扣帳、總帳會計文件是財會資料，不是生產規劃的基本資料。"}, {"n": 115, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制管理的流程中，企業會因自身的需求與能力來決定零組件是用外購或生產的方式來取得，而下列何者是外購或生產之提案(Proposal)", "opts": ["生產工單", "計劃中工單", "物料清單", "確認單(Confirmation Slip)"], "ans": 1, "exp": "外購或生產的提案 → <b>計劃中工單 (Planned Order)</b>。"}, {"n": 116, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制模組中，執行 MRP 的目的在於決定下列何者", "opts": ["獨立需求", "相依需求", "BOM 頂端的品項", "MRO 品項"], "ans": 1, "exp": "MRP 的目的是計算<b>相依需求</b>（零組件與原料的需求）；獨立需求來自需求管理或 MPS。"}, {"n": 117, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，有關需求管理(Demand Management)的敘述，下列何者正確", "opts": ["只規劃產品的銷售而已", "其需求管理的結果為一產品的需求計劃(Demand Program)", "規劃中長期銷售量與生產量之間的關係", "其目的為產生計劃中工單"], "ans": 1, "exp": "需求管理的結果是產品的<b>需求計劃 (Demand Program)</b>。C 描述的是 S&OP，D 是 MRP 的結果。"}, {"n": 118, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制管理過程中，下列何者為工作中心的主要角色", "opts": ["12", "14", "23", "34"], "ans": 1, "exp": "工作中心的角色是提供產能資訊 (1)，以及維護人資部門決定的員工技能水準 (4) → 14。(2) 是 BOM，(3) 是途程。", "items": ["(1) 提供產能相關資訊", "(2)描述產品之相依需求結構", "(3) 描述一物品從它的初始狀況到它的最終狀況的程序", "(4) 維護人力資源部門所決定何種員工技能水準"]}, {"n": 119, "ch": "第四章 生產規劃與控制", "stem": "在 ERP 系統生產規劃與控制模組(PP)中，下列哪一組合為正確的規劃順序", "opts": ["1423", "1234", "4123", "3214"], "ans": 3, "exp": "規劃順序：S&OP (3) → 需求管理 (2) → MPS (1) → MRP (4) → 3214。", "items": ["(1) 主生產規劃", "(2)需求管理", "(3) 銷售與作業規劃", "(4) 物料需求規劃"]}, {"n": 120, "ch": "第四章 生產規劃與控制", "stem": "下列何者屬於生產規劃所需要的基本資料", "opts": ["124", "123", "134", "234"], "ans": 1, "exp": "生產規劃的基本資料（主檔）有物料主檔、途程、工作中心 → 123。可用產能是規劃時計算出來的結果。", "items": ["(1) 物料資料主檔(Material Master Data)", "(2) 途程(Routing)", "(3) 工作中心(Work Center)", "(4) 可用產能(Available Capacity)"]}, {"n": 121, "ch": "第四章 生產規劃與控制", "stem": "針對各分析或規劃所計劃的對象中，下列哪一組合為正確", "opts": ["1", "123", "23", "3"], "ans": 1, "exp": "三項都正確：S&OP 對產品群、主規劃對各產品、MRP 對次裝配品與物料 → 123。", "items": ["(1) 銷售與作業管理對各產品群", "(2)主規劃對各產品群下各產品", "(3) 物料需求規劃各產品下之各次裝配品或物料"]}, {"n": 122, "ch": "第四章 生產規劃與控制", "stem": "生產工單(Production Order)在實際被發放到現場執行前，可有下列哪兩個狀態", "opts": ["12", "23", "34", "14"], "ans": 1, "exp": "生產工單發放到現場執行前，會經過 Created（開立）與 Released（發放）兩個狀態 → 23。", "items": ["(1) Open", "(2) Released", "(3) Created", "(4) Fence"]}, {"n": 123, "ch": "第四章 生產規劃與控制", "stem": "當生產工單完成之後，完工確認的資料包括", "opts": ["1235", "234", "124", "1245"], "ans": 3, "exp": "完工確認資料包括資源、人工、工單、物料 → 1245。顧客訂單不屬於完工確認。", "items": ["(1) 資源", "(2) 人工", "(3) 顧客訂單", "(4) 工單", "(5) 物料"]}, {"n": 124, "ch": "第四章 生產規劃與控制", "stem": "在生產規劃與控制中，有關需求管理的敘述，下列何者正確", "opts": ["1234", "14", "23", "124"], "ans": 1, "exp": "(1) 與 (4) 正確。(2) 錯：需求管理的對象是各產品，S&OP 才是產品群。(3) 錯：計劃中的獨立需求是預測，不等於顧客的實際需求。", "items": ["(1) 需求管理的功能在於決定完成品與重要次裝配品的需求量與運交日期(Delivery Date)", "(2) 需求管理與銷售與作業管理所規劃的對象皆為產品群", "(3) 計劃中的獨立需求即等同於顧客獨立需求", "(4) 需求管理的結果為需求計畫(Demand Program)"]}, {"n": 125, "ch": "第四章 生產規劃與控制", "stem": "有關計劃中工單及生產工單(Production Order)的敘述，以下何者正確", "opts": ["12", "34", "1234", "23"], "ans": 0, "exp": "(1)(2) 正確。(3)(4) 把兩個期間弄反了：開立期間 (Opening) 決定計劃中工單何時轉成生產工單，發放期間 (Release) 決定生產工單何時發放到現場。", "items": ["(1) 計劃中工單為一外購或生產之提案(Proposal)", "(2) 生產工單(Production Order)用以決定哪一產品或物料須進一步被處理", "(3) Release Period 界定何時一計劃中工單可被轉換為生產工單", "(4) Openning Period 界定何時生產工單可被發放至現場"]}, {"n": 126, "ch": "第四章 生產規劃與控制", "stem": "進行 MPS 與 MRP 規劃時，會對那些即將使用到物料進行規劃，而規劃可以有下列三種方式", "opts": ["1>2>3", "2>1>3", "3>1>2", "3>2>1"], "ans": 0, "exp": "電腦負荷由大到小：重規劃（全部重算）> 淨變規劃（只算有變動的）> 規劃時間幅度內的淨變規劃（範圍再縮小）。", "items": ["(1)重規劃", "(2) 淨變規劃", "(3) 規劃時間幅度內的淨變規劃，請依照使用這三種方式對電腦造成的負荷，由大至小排列"]}, {"n": 127, "ch": "第四章 生產規劃與控制", "stem": "下列哪一選項的順序為正確的 MPS 與 MRP 規劃步驟", "opts": ["12345", "15432", "54132", "14523"], "ans": 1, "exp": "MPS／MRP 步驟：淨需求計算 → 批量大小計算 → 內製或外購決定 → 排程 → BOM 展開，即 15432。", "items": ["(1) 淨需求計算(Net Requirement Calculation)", "(2) 物料清單的展開(BOM Explosion)", "(3) 排程(Scheduling)", "(4) 內製或外購的決定(Procurement Type)", "(5) 批量大小的計算(Lot Size Calculation)"]}, {"n": 128, "ch": "第四章 生產規劃與控制", "stem": "下列哪兩個項目為 ERP 系統生產有關的物料可獲得性確認(Availability Check)的二個可能時點", "opts": ["12", "14", "24", "13"], "ans": 3, "exp": "生產物料可獲得性確認的兩個時點：<b>工單產生時</b>與<b>工單發放時</b> → 13。", "items": ["(1) 當工單產生時", "(2) 規劃需求時", "(3) 當工單發放時", "(4) 盤點時"]}, {"n": 129, "ch": "第四章 生產規劃與控制", "stem": "生產規劃中的主規劃是指下列那哪兩個選項", "opts": ["12", "23", "34", "24"], "ans": 3, "exp": "主規劃 ＝ <b>需求管理 ＋ 主生產規劃 (MPS)</b> → 24。", "items": ["(1) 銷售與作業規劃", "(2) 需求管理(Demand Management)", "(3) 物料需求規劃", "(4) 主生產規劃(MPS)"]}, {"n": 130, "ch": "第四章 生產規劃與控制", "stem": "在 ERP 系統生產規劃與控制模組(PP)中，關於生產規劃企業流程之描述，下列選項何者是錯誤", "opts": ["在進行銷售與作業規劃(S&OP)前須先完成資料主檔(Master Data)的建立", "物料需求規劃工作執行完成後會進行銷售與作業規劃的工作", "需求管理(Demand Management)工作完成後會進行主生產規劃(Master Production Planning)工作", "銷售與作業規劃(S&OP)完成後會進行需求管理(Demand Management)工作"], "ans": 1, "exp": "S&OP 在 MRP 之前，B 說「MRP 完成後才做 S&OP」順序顛倒了。"}, {"n": 131, "ch": "第四章 生產規劃與控制", "stem": "當 ERP 系統導入時，下列有關生產規劃與控制模組(PP)之敘述何者錯誤", "opts": ["物料需求規劃(MRP)工作執行完成後會直接進行銷售與作業規劃(S&OP)的工作", "當執行銷售與作業規劃(S&OP)工作後，ERP 系統流程會連結串到需求管理與主生產規劃兩項工作", "當主生產規劃執行後，ERP 系統就會連結串到物料需求規劃(MRP)工作", "首先需要先建立 PP 模組相關資料主檔(Master Data)"], "ans": 0, "exp": "同上題：MRP 是最後的步驟，不會在 MRP 之後才做 S&OP，所以 A 錯。"}, {"n": 132, "ch": "第五章 企業之採購管理", "stem": "何種企業採購部門的主要活動，需要採購部門與行銷部門密切合作，以確保跨國買賣能獲得最大效益", "opts": ["抵銷貿易(Countertrade)合約之管理", "內製/外購之決策分析", "庫存追蹤與控管", "採購研究/物料需求預測"], "ans": 0, "exp": "抵銷貿易 (Countertrade) 是以貨易貨的跨國交易，需要採購與<b>行銷</b>部門密切合作。"}, {"n": 133, "ch": "第五章 企業之採購管理", "stem": "下列何者不是影響企業採購發展趨勢的因素", "opts": ["地區性", "全球化", "產品生命週期短", "利用網路"], "ans": 0, "exp": "採購的發展趨勢是全球化、產品生命週期縮短、利用網路。「地區性」與全球化的趨勢相反。"}, {"n": 134, "ch": "第五章 企業之採購管理", "stem": "企業的採購系統通常屬於物料管理模組的一個子系統，其範圍可包含三個部分，下列選項何者正確", "opts": ["456", "234", "256", "126"], "ans": 3, "exp": "MM 中的採購系統範圍：採購 (1)、庫存管理 (2)、發票驗證 (6) → 126。", "items": ["(1) 採購", "(2) 庫存管理", "(3) 盤點", "(4) 裝載", "(5) 出貨", "(6) 發票驗證"]}, {"n": 135, "ch": "第五章 企業之採購管理", "stem": "採購部門在企業的組織層級約可分為三類：低階功能部門、中階功能部門、高階功能部門。在這三種分類之中，能夠直接向 CEO 報告的，是屬於那一層部門", "opts": ["低階功能部門", "中階功能部門", "高階功能部門", "只要有需要，任何一層級的部門都能直接向總經理報告"], "ans": 2, "exp": "<b>高階功能部門</b>的採購單位可以直接向 CEO 報告。"}, {"n": 136, "ch": "第五章 企業之採購管理", "stem": "企業之採購活動，其發生是始於原料需求之產生，下列關於原料之描述，何者錯誤", "opts": ["原料是原物料的其中一項，是直接用於生產的物件，例如礦砂、塑膠粒", "物料是原物料的其中一項，是指不直接用於生產的物件，機械之機油", "除了原料與物料之外，其他的採購品都不能算是原物料", "原物料還包括了零件、半成品或成品、有毒廢棄物處理、儀器設備等"], "ans": 2, "exp": "原物料除了原料、物料以外，還包括零件、半成品、設備等（見 D），所以 C 說「其他都不算原物料」是錯的。"}, {"n": 137, "ch": "第五章 企業之採購管理", "stem": "傳統採購部門的主要任務為進行並完成採購活動，但是不包括了下列那一項內部活動", "opts": ["內製/外購之決策分析", "訂貨追蹤與庫存控管", "採購研究/原料需求預測", "報價活動"], "ans": 3, "exp": "報價活動屬於<b>銷售</b>部門的工作，不是採購部門的內部活動。"}, {"n": 138, "ch": "第五章 企業之採購管理", "stem": "有關採購流程之主要活動之敘述何者為誤", "opts": ["原物料需求辨認是最早的活動", "與企業內部其他部門之聯繫中，以與會計、財務部門之聯繫最為關鍵", "採購單下達與收貨可利用網路或電子資料方式進行，降低所需時間並提高效率", "這是一個循環的活動，週而復始"], "ans": 1, "exp": "採購最關鍵的內部聯繫對象是需求單位（生產、品保等），不是會計財務部門，所以 B 錯。"}, {"n": 139, "ch": "第五章 企業之採購管理", "stem": "下列何者不是企業評估產品「內製(或稱自製)」或「外購」決策分析的考慮因素", "opts": ["成本", "產品定位", "整體經營策略", "是否已經建置資料倉儲(Data Warehouse)"], "ans": 3, "exp": "內製或外購要考慮成本、產品定位、經營策略等。有沒有建置資料倉儲跟這個決策無關。"}, {"n": 140, "ch": "第五章 企業之採購管理", "stem": "那一張單據的內容包含以下的項目，請購品之簡短描述、料號、數量、單價、請購單位、聯絡人、交貨地點與注意事項、建議供應商以及該請購品可否有替代品", "opts": ["請購單(Purchase Requisition)", "生產工單", "材料清單", "計劃性工單"], "ans": 0, "exp": "記載請購品描述、料號、數量、請購單位、建議供應商等資料的單據 → <b>請購單 (Purchase Requisition)</b>。"}, {"n": 141, "ch": "第五章 企業之採購管理", "stem": "採購部門傳統上扮演「支援」角色，企業內部各部門須靠著緊密聯繫以協力完成企業營運之終極目標，其中為確保外包之品質能如預期，採購部門必須與那個部門保持密切的關係", "opts": ["財務會計部門", "市場行銷部門", "品保部門", "資訊部門"], "ans": 2, "exp": "確保外包品質要跟<b>品保部門</b>密切合作。"}, {"n": 142, "ch": "第五章 企業之採購管理", "stem": "採購活動中會因為不同的需求而產生不同的採購相關文件，下列那個文件不是企業採購時的相關文件", "opts": ["詢價單", "採購單", "生產工單(Production Order)", "裝箱單"], "ans": 2, "exp": "生產工單是生產規劃的文件，不是採購文件。採購文件有詢價單、採購單、裝箱單等。"}, {"n": 143, "ch": "第五章 企業之採購管理", "stem": "企業的採購門在日益競爭的全球環境下，益加顯得重要，如何有效計劃並管理控制採購數量與採購次數，以降低企業製造與營運成本，成為企業經營管理上日趨重要的議題，因此企業內採購部門的功能與目標，可自短期、中期及長期來看，其中下列何者是企業採購的短期目標", "opts": ["有效管理採購部門", "協助組織達成其營運目標", "選擇、發展並維持與供應商之關係", "支援企業最基本的作業需求"], "ans": 3, "exp": "短期目標是<b>支援企業最基本的作業需求</b>（及時、足量地供應物料）。A、C 是中長期目標，B 是綜觀目標。"}, {"n": 144, "ch": "第五章 企業之採購管理", "stem": "傳統採購文件之準備與處理，耗用許多人力及時間，近幾年來許多企業藉由電腦協助，已大大簡化採購文件準備的過程，替企業帶來許多益處，而以下何者不是採購文件電子化後的益處", "opts": ["大幅增加文件處理的數量", "大幅降低採購文件傳送及接收所需時間", "降低買賣雙方錯誤率", "降低採購所需的行政費用"], "ans": 0, "exp": "採購文件電子化的效益是省時間、降低錯誤率、降低行政費用。「增加文件數量」不是效益。"}, {"n": 145, "ch": "第五章 企業之採購管理", "stem": "企業的採購活動次數頻繁且種類繁多，涵括多種不同類型之採購，在企業採購類型中，下列有關「為企業維修與作業所需之採購(MRO)」的敘述，何者有誤", "opts": ["採購次數頻繁且採購量低", "與供應商組成策略聯盟(Strategic Alliances)", "透過集中採購來改善", "與供應商簽訂定期採購契約"], "ans": 1, "exp": "MRO 採購次數多、金額小，通常用集中採購或定期契約。<b>策略聯盟</b>適用於重要的半成品或零組件。"}, {"n": 146, "ch": "第五章 企業之採購管理", "stem": "採購活動中會因為不同的需求而產生不同的採購相關文件，在採購相關文件中，由供應商準備，隨實際運送交貨的採購相關文件是", "opts": ["到貨清單", "報價單", "採購單", "裝箱單(Material Packing Slip)"], "ans": 3, "exp": "由供應商準備、隨貨交付的文件 → <b>裝箱單 (Packing Slip)</b>。"}, {"n": 147, "ch": "第五章 企業之採購管理", "stem": "企業的採購活動次數頻繁且種類繁多，涵括多種不同類型之採購，在企業採購類型中，下列何者不屬於資本設備的採購", "opts": ["生產設備", "發電機", "辦公傢俱設備", "機器的備用零件"], "ans": 3, "exp": "機器的備用零件屬於 <b>MRO</b> 採購，不屬於資本設備。"}, {"n": 148, "ch": "第五章 企業之採購管理", "stem": "企業的採購部門在日益競爭的全球環境下，益加顯得重要，如何有效計劃並管理控制採購數量與採購次數，以降低企業製造與營運成本，成為企業經營管理上日趨重要的議題，因此發展企業整合性之採購策略以協助企業整體營運策略及目標之實現是屬於企業採購部門的", "opts": ["中期目標", "微觀目標", "綜觀目標", "暫時目標"], "ans": 2, "exp": "發展整合性採購策略來協助達成企業整體目標 → <b>綜觀目標</b>。"}, {"n": 149, "ch": "第五章 企業之採購管理", "stem": "企業的採購部門在日益競爭的全球環境下，益加顯得重要，如何有效計劃並管理控制採購數量與採購次數，以降低企業製造與營運成本，成為企業經營管理上日趨重要的議題，而下列何者不是企業有效採購在量方面的效益", "opts": ["降低採購週期所需時間", "提高產品品質", "降低成本", "提升顧客滿意度"], "ans": 3, "exp": "官方答案：有效採購在「量」方面的效益是降低週期時間、提高品質、降低成本；<b>提升顧客滿意度</b>不列在其中。"}, {"n": 150, "ch": "第五章 企業之採購管理", "stem": "在採購系統中，個別部門請購某項原料或服務，必須先建立採購單，而下列有關請購單產生來源的敘述，何者錯誤", "opts": ["來自 MPS 的結果", "來自 MRP 的結果", "人工鍵入", "外部銷售訂單"], "ans": 0, "exp": "請購單的來源有 MRP 結果、人工鍵入、外部銷售訂單等。MPS 只規劃到最終產品，不直接產生請購單。"}, {"n": 151, "ch": "第五章 企業之採購管理", "stem": "企業的採購門在日益競爭的全球環境下，益加顯得重要，如何有效計劃並管理控制採購數量與採購次數，以降低企業製造與營運成本，成為企業經營管理上日趨重要的議題，而有效採購對企業之效益，下列何者錯誤", "opts": ["降低成本", "縮短採購週期", "提高企業營運成效", "降低產品品質"], "ans": 3, "exp": "有效採購應該<b>提高</b>產品品質，D「降低產品品質」是錯的。"}, {"n": 152, "ch": "第五章 企業之採購管理", "stem": "針對某項請購案，採購部門須評估企業是否應自製或外購，在下列敘述中，何者不是外購決策的缺點", "opts": ["容易喪失對採購品之控制性", "選擇供應商時有風險", "需較長之前置時間", "適合獨佔性採購品"], "ans": 3, "exp": "外購的缺點是喪失控制、供應商風險、前置時間較長。「適合獨佔性採購品」不是缺點。"}, {"n": 153, "ch": "第五章 企業之採購管理", "stem": "當採購方式是根據預先設定的相關參數，如安全庫存量、需求預測、以及交貨時間，系統會自動計算並定出補貨點及補貨數量，一旦庫存數量低於補貨點，系統自動發出採購需求到採購部門，此方式稱為", "opts": ["快速回應系統", "倉庫盤點系統", "部門請購系統", "再訂購點系統(Reorder Point System)"], "ans": 3, "exp": "根據安全庫存、預測、交期自動算出補貨點，庫存低於補貨點就發出請購 → <b>再訂購點系統</b>。"}, {"n": 154, "ch": "第五章 企業之採購管理", "stem": "在企業採購類型中，辦公文具、清潔用品、機器之備用零件屬於何種類型之採購", "opts": ["原物料", "為支持生產所需之採購", "為企業維修與作業(MRO)所需之採購", "服務之採購"], "ans": 2, "exp": "辦公文具、清潔用品、備用零件 → <b>MRO（維修與作業）</b>採購。"}, {"n": 155, "ch": "第五章 企業之採購管理", "stem": "下列何者類型的採購，通常是庫存主要項目，而且也佔去庫存的大量空間", "opts": ["服務之採購", "為企業維修與作業所需之採購", "為支持生產所需之採購(Production Support Items)", "原物料"], "ans": 2, "exp": "支持生產所需的採購（例如包材、紙箱）通常是主要庫存項目，也最佔空間。"}, {"n": 156, "ch": "第五章 企業之採購管理", "stem": "企業採購在評估原物料可能供應來源時，下列敘述何者正確", "opts": ["為了確保供應來源無虞，應增加供應商數目", "宜針對評估準則及權重以選擇適合供應商(Supplier)", "為提高交貨時效，應以地區供應商為主要考量", "為了確保供應來源無虞，供應商最好尋求已開發中國家的企業"], "ans": 1, "exp": "選擇供應商應該依<b>評估準則與權重</b>來決定，不是單純增加供應商數量或只看地區。"}, {"n": 157, "ch": "第五章 企業之採購管理", "stem": "下列何者不是企業作為採購原物料的需求來源", "opts": ["再訂購點系統", "供應商(Supplier)績效評估結果", "倉庫盤點", "部門請購"], "ans": 1, "exp": "請購需求來源有再訂購點、倉庫盤點、部門請購。供應商績效評估是用來選供應商的，不是需求來源。"}, {"n": 158, "ch": "第五章 企業之採購管理", "stem": "有關採購部門在決定產品「內製(或稱自製)」或「外購」的決策分析時，下列敘述何者錯誤", "opts": ["內製(或稱自製)擁有較低的投資成本", "內製需要較高的投資成本", "外購需有較長之前置時間取得採購品", "當外購時，選擇供應商之風險較高"], "ans": 0, "exp": "內製需要投資廠房設備，成本<b>較高</b>，所以 A「投資成本較低」是錯的。"}, {"n": 159, "ch": "第五章 企業之採購管理", "stem": "下列哪項不屬於採購流程產生之相關文件", "opts": ["詢價單(RFQ)", "採購單(PO)", "維修單", "裝箱單(Material Packing Slip)"], "ans": 2, "exp": "維修單不是採購流程的文件。"}, {"n": 160, "ch": "第五章 企業之採購管理", "stem": "在企業採購類型中，下列敘述何者為誤", "opts": ["為支持生產製造所需的採購例如產品製造完成後裝箱包裝的紙箱、捆帶、儲藏盒等", "資本設備(Capital Equipment)之採購項目為流動性資產", "維修與作業所需的採購其成本與成效較不受到重視", "資本設備之採購金額通常很龐大"], "ans": 1, "exp": "資本設備（機器、廠房）屬於<b>固定資產</b>，不是流動資產，所以 B 錯。"}, {"n": 161, "ch": "第五章 企業之採購管理", "stem": "在企業採購活動中，採購企業為確保品質可靠而與供應商組成策略聯盟，多屬於哪一種採購類型", "opts": ["原料類採購", "服務採購", "資本設備之採購", "半成品採購(Semi-Finished Products and Components)"], "ans": 3, "exp": "為了確保品質而與供應商組成策略聯盟，多見於<b>半成品／零組件</b>採購。"}, {"n": 162, "ch": "第五章 企業之採購管理", "stem": "採購部門以小組研究方式進行價值分析以提升採購物件價值( = 物件所具備的功能 / 該物件的成本 )時，下列何者正確", "opts": ["採購物件 K 的功能 3 單位，成本 5 單位，採購物件 M 的功能 3 單位，成本 3 單位，則 M 物件價值高", "某一舊採購物件 K 的功能 5 單位，成本 5 單位，功能相似的新詢價的採購物件 M 之功能 5 單位，成本 6 單位，則 M 物件價值高", "某一舊採購物件 K 的功能 5 單位，成本 5 單位，功能相似的新詢價的採購物件 M 之功能 8 單位，成本 11 單位，則 M 物件價值高", "某一舊採購物件 K 的功能 5 單位，成本 5 單位，功能相似的新詢價的採購物件 M 之功能 5 單位，成本 4 單位，則舊物件價值高"], "ans": 0, "exp": "價值 ＝ 功能 ÷ 成本。A：K ＝ 3/5 ＝ 0.6，M ＝ 3/3 ＝ 1，M 價值較高，正確。B：M ＝ 5/6 < 1，錯。C：M ＝ 8/11 < 1，錯。D：M ＝ 5/4 > 1，應該是新物件價值較高，錯。"}, {"n": 163, "ch": "第五章 企業之採購管理", "stem": "採購部門在評估供應商的方法時經常先計算出供應商績效指標 SPI 值作為評估的依據，而 SPI= (採購總成本 + 非績效成本) / (採購總成本)，有關此指標之敘述下列何者錯誤", "opts": ["如果與此供應商為第一次交易往來，則此供應商的 SPI 值為 1", "供應商的 SPI 值越大表示此供應商績效越差", "如果與此供應商為第一次交易往來，則此供應商的非績效成本與供應商的採購總成本之比值(即非績效成本 / 採購總成本)為 1", "任一供應商的 SPI 值不可能小於 1"], "ans": 2, "exp": "第一次交易沒有非績效成本，所以 SPI ＝ 1，非績效成本／採購總成本 ＝ <b>0</b>，不是 1，C 錯。"}, {"n": 164, "ch": "第五章 企業之採購管理", "stem": "在 SAP 系統中，有關採購流程之描述何者為正確", "opts": ["請購單建立後，須先經核准，才能釋出轉成採購單", "包含請購、採購、發貨單確認以及庫存管理等四部份", "供應商主檔資料管理與維護中，以每筆採購單號設為代碼作為供應商之辨認依據", "屬於 SD 模組"], "ans": 0, "exp": "SAP 中請購單建立後要先經過<b>核准</b>，才能釋出轉成採購單。採購屬於 MM 模組。"}, {"n": 165, "ch": "第五章 企業之採購管理", "stem": "在企業採購流程中，下列何者不屬於採購相關文件", "opts": ["物料清單(BOM)", "裝箱單", "採購單", "詢價單"], "ans": 0, "exp": "物料清單 (BOM) 是生產規劃的資料，不是採購文件。"}, {"n": 166, "ch": "第五章 企業之採購管理", "stem": "在企業採購管理中，有關「外購」的敘述，何者為非", "opts": ["其所佔之重要性有增加趨勢", "外購所需的前置時間較「內製」為短", "易喪失對採購品的控制性", "適合於當「內製」之固定成本偏高時採用"], "ans": 1, "exp": "外購的前置時間比內製<b>長</b>，所以 B 錯。"}, {"n": 167, "ch": "第五章 企業之採購管理", "stem": "在企業採購管理中，影響內製決策之成本因素為何", "opts": ["123", "234", "1234", "12345"], "ans": 1, "exp": "內製的成本因素：作業成本、工廠營運成本、整體作業成本 → 234。購買成本屬於外購的考量。", "items": ["(1) 購買成本", "(2) 作業成本(Operating Expense)", "(3) 工廠營運成本(Total Factory Costs)", "(4) 整體作業成本(Total Operating Costs", "(5) 庫存成本"]}, {"n": 168, "ch": "第五章 企業之採購管理", "stem": "在供應商管理中，那些重要評估項目可用以評估供應商", "opts": ["1234", "123", "12345", "1235"], "ans": 3, "exp": "評估供應商：交貨數量、交貨日期、交貨品質、供應商製造成本 → 1235。交貨地點不列入評估。", "items": ["(1) 交貨數量", "(2) 交貨日期", "(3) 交貨品質", "(4) 交貨地點", "(5) 供應商製造成本"]}, {"n": 169, "ch": "第五章 企業之採購管理", "stem": "評估並決定某些請購案應內製(或稱自製)或外購時，應該考慮那些因素", "opts": ["1234", "234", "123", "12345"], "ans": 0, "exp": "內製或外購的考量：經營策略、未來經營目標、成本、產品定位 → 1234。", "items": ["(1) 經營策略", "(2) 未來經營目標", "(3) 成本", "(4) 產品之定位", "(5) 供應商配合度"]}, {"n": 170, "ch": "第五章 企業之採購管理", "stem": "下列哪一選項為影響企業採購發展趨勢的因素", "opts": ["12345", "1234", "13", "134"], "ans": 2, "exp": "影響採購趨勢的是全球競爭 (1) 與運用網路 (3) → 13。(2) 錯：產品週期是縮短、不確定性升高。", "items": ["(1) 全球市場導致全球競爭", "(2) 產品週期長且確定性增高", "(3) 採購方式改變，運用全球資訊網路", "(4) 運籌管理", "(5) 策略聯盟"]}, {"n": 171, "ch": "第五章 企業之採購管理", "stem": "在企業採購管理中，有關採購內容之敘述何者為非", "opts": ["MRO 項目之採購金額逐漸增高，已成為主要採購項目之一", "交通或服務亦是企業採購項目之一", "電腦屬於資本設備之採購", "半成品(Semi-Finished Products and Components)之採購則逐漸減少"], "ans": 3, "exp": "半成品與零組件的採購是<b>逐漸增加</b>的（外包趨勢），所以 D 錯。"}, {"n": 172, "ch": "第五章 企業之採購管理", "stem": "根據 Monczka 所提出之採購週期模型，企業採購流程共有五個主要活動，請將下列選項依照正確的流程順序進行排序", "opts": ["12345", "12534", "31245", "52341"], "ans": 0, "exp": "Monczka 採購週期：需求辨認 → 評估來源 → 選擇來源 → 採購單下達與收貨 → 績效評估 → 12345。", "items": ["(1) 原料需求辨認與預估", "(2) 評估可能供應來源", "(3)選擇所需物料之供應來源", "(4) 採購單下達與收貨", "(5) 供應商績效評估與連續供應管理"]}, {"n": 173, "ch": "第五章 企業之採購管理", "stem": "價值分析中，下列那種做法並沒有提昇物品的價值", "opts": ["3", "1", "2", "124"], "ans": 0, "exp": "價值 ＝ 功能 ÷ 成本。(3) 成本不變、功能降低，價值會下降。其他三項都會提升價值。", "items": ["(1) 不降低物件品質前提下，降低物件成本", "(2) 不降低物件成本前提下，提升物件功能", "(3) 不降低物件成本前提下，降低物件功能", "(4) 相對於所增加之成本，大幅增進物件之功能"]}, {"n": 174, "ch": "第五章 企業之採購管理", "stem": "在供應商的選擇方式中，下列何者為競標採購之適用情形", "opts": ["1234", "123", "124", "234"], "ans": 2, "exp": "競標適用於數量龐大、供應商夠多、規格明確的情況 → 124。競標通常是以價格為主要考量，所以 (3) 錯。", "items": ["(1) 採購數量龐大", "(2) 市場上有足夠的供應商", "(3) 價格不是最重要的採購參考要件", "(4) 採購的原物料規格及樣式均清楚明確"]}, {"n": 175, "ch": "第五章 企業之採購管理", "stem": "企業的採購通常都屬於物料管理模組(Material Management, MM)，其範圍包含", "opts": ["123", "234", "134", "124"], "ans": 1, "exp": "MM 採購範圍：採購、庫存管理、發票驗證 → 234。", "items": ["(1) 訂單", "(2)採購", "(3) 庫存管理", "(4) 發票驗證"]}, {"n": 176, "ch": "第五章 企業之採購管理", "stem": "在企業採購類型中，下面對於企業維修與作業所需之採購的描述，那些是正確的", "opts": ["134", "234", "345", "124"], "ans": 3, "exp": "MRO：維修與作業 (1)、次數多量少 (2)、分散使用難盤點 (4) → 124。(3) 是生產支援採購，(5) 是銷售考量。", "items": ["(1) 英文意思為 Maintenance, Repair and Operating, 簡稱 MRO", "(2) 採購次數頻繁，但採購量低", "(3) 支援生產製造所需的採購", "(4) 分散各處使用，很難盤點", "(5) 必須注意外觀設計，以吸引消費者興趣"]}, {"n": 177, "ch": "第五章 企業之採購管理", "stem": "採購流程包含下面五個主要活動，請依照正確的執行順序進行排序", "opts": ["15342", "35142", "23451", "31542"], "ans": 1, "exp": "順序：原料需求辨認 (3) → 評估可能來源 (5) → 選擇來源 (1) → 採購單與收貨 (4) → 績效評估 (2) → 35142。", "items": ["(1) 選擇原物料供應來源", "(2) 供應商績效評估與連續供應管理", "(3) 原料需求辨認", "(4) 採購單下達與收貨", "(5) 評估原物料可能供應來源"]}, {"n": 178, "ch": "第五章 企業之採購管理", "stem": "在 ERP 系統中企業採購系統與庫存管理系統通常是歸屬於物料管理(Material Management, MM)模組，而關於採購系統中的請購作業之描述，下列選項何者錯誤", "opts": ["物料需求規劃(MRP)執行後可以啟動建立請購單(Purchase Requisition)功能", "如果個案公司有需要也可以透過人工直接鍵入系統的方式建立請購單(Purchase Requisition)", "建立請購單(Purchase Requisition)時會根據 ERP 系統的供應商主檔之歷史採購紀錄與交貨情形啟動檢查是否需要重新找尋供應商來源功能，等決定供應商之處理作業完成後可以啟動釋出請購單功能", "請購單屬於企業外部文件，可以向外流傳"], "ans": 3, "exp": "請購單是<b>企業內部文件</b>，採購單才會送給外部供應商，所以 D 錯。"}, {"n": 179, "ch": "第五章 企業之採購管理", "stem": "在 ERP 系統中企業採購系統與庫存管理系統通常是歸屬於物料管理(Material Management, MM)模組，而關於採購系統中的採購品到貨作業之描述，下列選項何者錯誤", "opts": ["到貨作業時，萬一發現品質檢驗不符標準，到貨品如果屬於外購，則必須通知製造部門決定處理方式", "當採購品及相關文件收訖處理作業完成後，接著會啟動決定到貨之儲存位置及轉移類型功能", "當決定到貨之儲存位置及轉移類型功能完成後，接著會準備確認移轉類型及倉儲位置指定作業", "當採購品及相關文件收訖處理作業完成後，接著會啟動檢查貨品及隨附之文件功能"], "ans": 0, "exp": "外購品的品質檢驗不合格時，要通知<b>採購部門</b>處理（退貨或與供應商協商），不是通知製造部門。"}, {"n": 180, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問何種分析法是根據各類存貨所帶來的經濟效益及所消耗的經濟資源之相對關係作為實施重點管理的基礎", "opts": ["SWOT 分析", "庫存分析", "決策分析", "ABC 分析"], "ans": 3, "exp": "依各類存貨帶來的經濟效益與消耗的資源做重點管理 → <b>ABC 分析</b>（重要的少數、次要的多數）。"}, {"n": 181, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問下列何者為每次從事生產前的預備成本，如機器設備的整理", "opts": ["生產成本", "存貨持有成本", "生產設置成本(Setup Cost)", "購買成本"], "ans": 2, "exp": "每次生產前的準備成本（例如整理、調整機器設備） → <b>生產設置成本 (Setup Cost)</b>。"}, {"n": 182, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問系統設定在每週三發出訂單補貨的為何種訂購時機決定之模式", "opts": ["時間基準法則(Time-based)", "再訂購點模式", "成本基準法則", "產品基準法則"], "ans": 0, "exp": "固定在每週三發出補貨訂單（固定週期） → <b>時間基準法則</b>。"}, {"n": 183, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問何者是為了因應前置時間的不確定性所產生的總需求變異", "opts": ["存貨週轉", "安全庫存(Safety Stock)", "平均庫存量", "安全需求量"], "ans": 1, "exp": "為了因應前置時間與需求的不確定性而多準備的存貨 → <b>安全庫存 (Safety Stock)</b>。"}, {"n": 184, "ch": "第六章 庫存管理系統", "stem": "庫存數字的記錄方式，因管理需求不同可分為存貨價值之記錄與存貨數量之記錄，其中前者的求算公式為", "opts": ["存貨數量 * 單位成本", "現有存貨量 + 已訂未交量 - 已指定用途量", "(收料數量 - 發料數量) * 單價", "(存貨數量 + 計畫使用量) * 單價"], "ans": 0, "exp": "存貨價值 ＝ <b>存貨數量 × 單位成本</b>。B 是有效庫存量的公式。"}, {"n": 185, "ch": "第六章 庫存管理系統", "stem": "在 ABC 分析法中，發現許多公司之 10~30%存貨項目其價值佔全部庫存價值的 70~80%，此類存貨通稱", "opts": ["B 類", "C 類", "A 類", "D 類"], "ans": 2, "exp": "10–30% 的品項佔 70–80% 的價值 → <b>A 類</b>，要重點管理。"}, {"n": 186, "ch": "第六章 庫存管理系統", "stem": "發料作業為庫存管理系統的主要工作之一，以下何者是其最可能的發料原因", "opts": ["因應顧客抱怨的需求", "因應生產線生產的需求", "因應工廠佈置變更的需求", "因應設計變更的需求"], "ans": 1, "exp": "發料最主要的原因是<b>因應生產線的生產需求</b>。"}, {"n": 187, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，訂購時機的決定與經濟訂購批量的基本原則類似，皆為使總存貨成本最低，其計算與下列何者無關", "opts": ["前置時間的期望值", "安全庫存", "需求率的期望值", "存貨周轉率(Turnover)"], "ans": 3, "exp": "訂購時機（再訂購點）＝ 前置時間 × 需求率 ＋ 安全庫存。存貨周轉率不在計算之中。"}, {"n": 188, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，有效庫存量的計算不需考慮哪一因素", "opts": ["市場預測需求數量", "現有庫存數量", "已訂未交數量", "已指定用途數量"], "ans": 0, "exp": "有效庫存量 ＝ 現有庫存 ＋ 已訂未交 − 已指定用途，不考慮市場預測。"}, {"n": 189, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統的倉儲作業中，呆料品項(Slowing-moving Item)主要的認定基準是", "opts": ["品項價值", "品項存貨周轉率(Turnover Rate)", "品項銷售量", "品項庫存量"], "ans": 1, "exp": "呆料依<b>存貨周轉率</b>認定：周轉率低、很久沒動的物料就是呆料。"}, {"n": 190, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，訂購時機的決定與經濟訂購批量的基本原則類似：皆在使總存貨成本最小化；但須多考慮哪一因素", "opts": ["市場需求數量", "訂單處理成本", "存貨持有成本", "服務水準 (Service Level)"], "ans": 3, "exp": "決定訂購時機時，除了成本，還要多考慮<b>服務水準</b>（決定安全庫存要放多少）。"}, {"n": 191, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，有關於影響安全存量大小的描述，下列何者錯誤", "opts": ["需求率變異越大，則安全存量越大", "服務水準越高，安全庫存量越高", "前置時間變異越大，安全庫存量越大", "服務水準越低，安全庫存量越高"], "ans": 3, "exp": "服務水準愈高，安全庫存要愈多；D「服務水準愈低、安全庫存愈高」是反的。"}, {"n": 192, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統之倉儲作業中，有關週期盤點制(Cycle Counting)的觀念，下列何者正確", "opts": ["盤點時不關閉倉庫", "盤點時不凍結庫存", "每個月可以盤點一次以上", "選定一特定日期關閉倉庫，動員所有人力，以最短的時間清點所有物料"], "ans": 0, "exp": "週期（循環）盤點是逐區、逐類輪流盤點，<b>不關閉倉庫</b>。D 描述的是定期盤點。"}, {"n": 193, "ch": "第六章 庫存管理系統", "stem": "請問庫存管理系統中，顧客需求或顧客訂單能由庫存品直接供貨的比率稱為", "opts": ["存貨週轉率", "服務水準(Service Level)", "前置時間", "庫存比率"], "ans": 1, "exp": "顧客需求能由庫存直接供貨的比率 → <b>服務水準</b>。"}, {"n": 194, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問下列何者不為經濟生產批量(EPQ)之總成本的組成項目", "opts": ["生產成本", "生產設置成本", "存貨持有成本", "呆料數量"], "ans": 3, "exp": "EPQ 總成本 ＝ 生產成本 ＋ 生產設置成本 ＋ 存貨持有成本。呆料數量不是成本項目。"}, {"n": 195, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問何者非決定安全存量所需考慮的因素", "opts": ["服務水準", "前置時間", "需求率", "損益兩平"], "ans": 3, "exp": "安全存量取決於服務水準、前置時間、需求率（及其變異）。損益兩平與安全存量無關。"}, {"n": 196, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統之倉儲作業中，請問盤點時不關閉倉庫，而是逐區或逐類輪流進行清點現有庫存所有物料品項的稱為何種盤點制度", "opts": ["混合盤點制", "循環盤點制", "定期盤點制", "ABC 盤點制"], "ans": 1, "exp": "不關閉倉庫、逐區或逐類輪流清點 → <b>循環盤點制</b>。"}, {"n": 197, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，下列何者非服務水準(Service Level)的正確定義", "opts": ["顧客需求能由庫存品直接供貨的比率", "顧客訂單能由庫存品直接供貨的比率", "可視為供貨率或訂單滿足率", "全部訂單數量 / 缺貨數量"], "ans": 3, "exp": "服務水準 ＝ 由庫存直接滿足的訂單 ÷ 全部訂單。D「全部訂單 ÷ 缺貨數」算式錯誤。"}, {"n": 198, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，ABC 分析法是利用柏拉圖 80-20 法則所發展出來的存貨分類與管制方法，而使用 ABC 分析的主要目的為能管理何種商品", "opts": ["高流通低單價", "低流通低單價", "高流通、高單價", "低流通高單價"], "ans": 2, "exp": "ABC 分析主要管理<b>高流通、高單價</b>（年使用金額高）的 A 類商品。"}, {"n": 199, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，ABC 分析是利用柏拉圖 80-20 法則所發展出來的存貨分類與管制方法，以下有關 ABC 分析法的觀念何者有誤", "opts": ["A 類存貨表最重要品項類別，B 類表次重要品項，C 類表較不重要品項", "根據各類存貨所帶來的經濟效益及所消耗的費用資源之相對關係作為實施重點管理的基礎", "A 類佔全部庫存價值的 70-80%，C 類佔全部庫存價值的 5-15%，其餘則歸類為 B 類", "A 類存貨品項約 10-30%，C 類存貨品項約 40-60%，其餘則歸類為 B 類"], "ans": 1, "exp": "官方答案為 B。ABC 分析的基準是「經濟效益」與「消耗的<b>經濟資源</b>」（見第 180 題），B 改成「費用資源」是錯的。"}, {"n": 200, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，下列何項工作不屬於倉儲作業的功能", "opts": ["收料作業", "因購買物料產生的應付帳款(Accounts Payable)管理", "呆廢料處理", "盤點作業"], "ans": 1, "exp": "應付帳款管理屬於<b>財會模組</b>，不是倉儲作業。倉儲作業包括收料、發料、呆廢料處理、盤點。"}, {"n": 201, "ch": "第六章 庫存管理系統", "stem": "決定訂購量最簡單的決策模型是 1915 年提出的經濟訂購量模型(EOQ)，在 EOQ 相關之基本假設中，不含以下何項", "opts": ["考慮數量折扣", "每批次的購買數量，不受儲存空間或資金的限制", "市場需求為確定值", "前置時間為零"], "ans": 0, "exp": "EOQ 的基本假設：需求確定、前置時間為零（或固定）、不受空間與資金限制、<b>不考慮數量折扣</b>。"}, {"n": 202, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，ABC 分析法是利用柏拉圖 80-20 法則所發展出來的存貨分類與管制方法，其分類的方式通常係根據何種原則來進行", "opts": ["物料用途", "物料年度使用金額", "物料單位價值", "物料代號"], "ans": 1, "exp": "ABC 分類依<b>年度使用金額</b>（年用量 × 單價）來分類。"}, {"n": 203, "ch": "第六章 庫存管理系統", "stem": "在庫存管理的領域中有些相當重要的專有名詞，這些專有名詞在學術討論及實務上被使用，因此暸解這些專有名詞所代表的意義是必要的，在下列選項中與「服務水準(Service Level)」無關的是", "opts": ["供貨率(Fill Rate)", "訂單滿足率(Fulfill Rate)", "顧客需求或顧客訂單能由庫存品直接存貨供應的比率", "業務人員組織層級"], "ans": 3, "exp": "服務水準又稱供貨率、訂單滿足率；業務人員的組織層級跟它無關。"}, {"n": 204, "ch": "第六章 庫存管理系統", "stem": "在庫存管理的領域中有些相當重要的專有名詞，這些專有名詞在學術討論及實務上被使用，因此暸解這些專有名詞所代表的意義是必要的，在下列選項中與「前置時間(Lead Time)」有關的是", "opts": ["從顧客發出詢價(Inquire)單到顧客訂單(Customer Order)正式下達的時間", "從採購訂單發出(Issue)到收到貨品(Receive)的時間", "從貨品到達倉庫到品檢完畢可以使用貨品的時間", "生產時的寬放時間"], "ans": 1, "exp": "前置時間 ＝ <b>從採購訂單發出到收到貨品</b>的時間。"}, {"n": 205, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，訂購時機中的時間基準法則是指", "opts": ["固定訂購週期模式", "最低成本的訂購時間", "最低購買成本的訂購時間", "最高成本的訂購時間"], "ans": 0, "exp": "時間基準法則 ＝ <b>固定訂購週期模式</b>（定期訂購）。"}, {"n": 206, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，物料分類可依用途、材質與成本結構分類，其中的用途又可以細分為", "opts": ["直接材料、間接材料", "原物料、在製品、製成品、維修與作業品項", "耗材、人事、設備、機器", "製造用途、銷售用途、研發用途、人事用途"], "ans": 1, "exp": "依用途可以分為：原物料、在製品、製成品、維修與作業 (MRO) 品項。"}, {"n": 207, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，通常物料主檔的內容，需綜合所有使用者的需求來決定，一般應包含下列何種形態之資料", "opts": ["庫存資訊(儲存場所、庫存量、入出庫累計、安全存量等)", "生產排程", "預測需求", "市場需求量"], "ans": 0, "exp": "物料主檔包含<b>庫存資訊</b>（儲存場所、庫存量、安全存量等），生產排程與需求預測不屬於主檔。"}, {"n": 208, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，有效庫存量計算公式為何", "opts": ["現有庫存量", "現有庫存量＋已訂未交量－已指定用途量", "現有庫存量＋已訂未交量", "已訂未交量－已指定用途量"], "ans": 1, "exp": "有效庫存量 ＝ 現有庫存量 ＋ 已訂未交量 − 已指定用途量。"}, {"n": 209, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統的倉儲作業中，選定一特定日，關閉倉庫，動員所有人力，以最短的時間清點現存所有物料的盤點方式稱為", "opts": ["ABC 盤點制", "定期盤點制(Periodic Counting)", "循環盤點制", "複合盤點制"], "ans": 1, "exp": "選定特定日關閉倉庫、動員所有人力一次盤完 → <b>定期盤點制</b>。"}, {"n": 210, "ch": "第六章 庫存管理系統", "stem": "在 D 品牌的 ERP 系統中，成本計價、調整、月結等作業是屬於庫存管理系統中的哪一功能", "opts": ["借出/借入管理", "存貨結轉作業", "批號管理作業", "定期維護作業"], "ans": 1, "exp": "成本計價、調整、月結 → <b>存貨結轉作業</b>。"}, {"n": 211, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，物料主檔為物料管理系統中最基礎之標準資料檔，建立物料主檔的主要目的為", "opts": ["計算存貨需求量", "建立正確的物料基本資料管理與維護，作為其他相關模組之索引或進行資料維護之用", "從事 ABC 分析", "方便計算損益兩平點"], "ans": 1, "exp": "物料主檔的目的是建立正確的物料基本資料，作為其他模組的索引與資料來源。"}, {"n": 212, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，有關存貨周轉率的敘述，下列何者錯誤", "opts": ["存貨在倉儲系統中的流動次數", "通常以一年為計算單位", "存貨周轉率(Turnover)越低越好", "等於一年的銷貨量/年度平均庫存量"], "ans": 2, "exp": "存貨周轉率愈<b>高</b>，代表存貨流動愈快、經濟效益愈好，所以 C「愈低愈好」是錯的。"}, {"n": 213, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問下列名詞解釋何者錯誤", "opts": ["前置時間指的是從採購訂單發出到收到貨品的時間", "品項(Item)指的是物料用途區分", "存貨周轉率指的是存貨在倉儲系統或零售系統中的流動次數", "存貨管制系統為一用以監控與存量管制相關決策制定之參數"], "ans": 1, "exp": "品項 (Item) 是指一個特定的物料（一物一料號），不是用途分類，所以 B 錯。"}, {"n": 214, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，如果 100 位顧客需求中，有 87 位顧客能由貨架或成品倉庫中直接供貨，則意謂著其服務水準(Service Level)為", "opts": ["13%", "87%", "8%", "9%"], "ans": 1, "exp": "服務水準 ＝ 87 ÷ 100 ＝ <b>87%</b>。"}, {"n": 215, "ch": "第六章 庫存管理系統", "stem": "在 ERP 系統中訂購時機或再訂購點(ROP)可以解決需求不確定(Uncertainty)的庫存管理問題，ROP 的計算公式為 LT * D + SS，假如 Tim 公司的產品 Z 的 ROP 為 400 件，期望前置時間 LT 為 3天，每一天的期望需求量 D 是 120 件，則 Z 產品的安全庫存量 SS 應該為多少件", "opts": ["30", "35", "40", "45"], "ans": 2, "exp": "ROP ＝ LT × D ＋ SS → 400 ＝ 3 × 120 ＋ SS → SS ＝ <b>40</b>。"}, {"n": 216, "ch": "第六章 庫存管理系統", "stem": "在 ERP 系統中的庫存管理機制中，假設 Super 公司採用經濟生產批量(EPQ)模型進行決策，則其最高存量與經濟生產批量 Q*是不同的，已知該公司一年的銷貨量為 45000 單位，最高存量為 1800單位，經濟生產批量 Q*為每批次 2400 單位，通常 EPQ 模式的平均存貨量計算公式為(最高存量) / 2，而存貨周轉率的公式可以等於(一年的銷貨量) / (年度平均存貨量)，試求出存貨周轉率為多少", "opts": ["65", "60", "50", "55"], "ans": 2, "exp": "平均存貨 ＝ 最高存量 ÷ 2 ＝ 1800 ÷ 2 ＝ 900；周轉率 ＝ 45000 ÷ 900 ＝ <b>50</b>。"}, {"n": 217, "ch": "第六章 庫存管理系統", "stem": "在 Beny 公司的庫存管理制度中採用 EOQ 模型進行決策，表示存貨消耗率為某一常數(d)以及前置時間(LT)為某一常數值，如果品項 Y 的供應商 RAIN 的供應前置時間需要 X 天，且品項 Y 的存貨消耗率為每天消耗 9 件，供應商 RAIN 使命必達的經驗讓 Beny 公司不需要制定安全存貨量 SS，則訂購時機或再訂購點(ROP)的計算公式為(d) * (LT)，已知 Beny 公司的 ROP 為 18 件，試求 X 為多少", "opts": ["0", "1", "2", "3"], "ans": 2, "exp": "ROP ＝ d × LT → 18 ＝ 9 × X → X ＝ <b>2</b>。"}, {"n": 218, "ch": "第六章 庫存管理系統", "stem": "由柏拉圖(Pareto)80-20 法則所發展出的 ABC 分析法是一種存貨分類與管制方法，ABC 分析表的製作可由出貨資料與物料主檔資料彙整，製作過程中須求算每一品項每年耗用金額，其計算公式為(年使用量) * (單價)，假設 BIS 公司的產品 R4 的年使用量為 400 個，已知產品 R4 的每年耗用金額為 8000 元，則產品 R4 的單價為多少元", "opts": ["20", "25", "30", "35"], "ans": 0, "exp": "單價 ＝ 年耗用金額 ÷ 年使用量 ＝ 8000 ÷ 400 ＝ <b>20</b>。"}, {"n": 219, "ch": "第六章 庫存管理系統", "stem": "應用於支援生產或與生產相關的活動，以及為滿足顧客需求的原物料、零組件、備用零件、半成品、成品等物件皆被稱為存貨，為了管理存貨的活動被稱為倉儲作業，而倉儲作業與下列的那個模組的互動性最低", "opts": ["採購管理模組", "製令管理系統", "人事管理模組", "生產計畫系統"], "ans": 2, "exp": "倉儲作業與採購、製令、生產計畫都密切相關，與<b>人事管理</b>的互動最低。"}, {"n": 220, "ch": "第六章 庫存管理系統", "stem": "請問在庫存管理系統中，若有一情境為「可能有 10%的缺貨率」，意謂著這個情境之下企業所能夠提供的服務水準為", "opts": ["0%", "10%", "90%", "80%"], "ans": 2, "exp": "服務水準 ＝ 1 − 缺貨率 ＝ 1 − 10% ＝ <b>90%</b>。"}, {"n": 221, "ch": "第六章 庫存管理系統", "stem": "收料單位執行收料作業時，在數量與品質驗收作業完成後，應依照數量與品質驗收的結果決定後續處理作業，依照不同的驗收結果與其後續處理作業的敘述，何者的後續處理方式錯誤", "opts": ["品質、數量皆符合：此時將由收料單位接收入庫或送交現場領用", "品質核可、數量超出：若該品項屬於常用料件，則超出的部份不論數量多寡皆可全數點收入庫，再通知採購單位將超出的部份進行採購補單作業", "品質核可、數量短少：企業得要求供應商補交，如決定不補交者，則可自總價中扣除相等部份之價格", "品質不符：無法使用之材料應辦理退貨並請供應商補交新材料"], "ans": 1, "exp": "數量超出時，應依規定的允收範圍處理（退回或經採購核准），不能「不論多寡全數點收」，所以 B 錯。"}, {"n": 222, "ch": "第六章 庫存管理系統", "stem": "出料作業因出貨原因不同會有不同的出貨對象與執行方式，下列針對不同的出貨原因執行的出料作業方式的描述，何者有誤", "opts": ["送交客戶之出貨：為確保實際送貨品項之品質與數量與出貨文件所記錄之內容一致，當初或資料正式登錄系統時，即不再允許人為更改出貨資訊。若有必要進行變動時，應依照企業之標準作業流程執行，並由系統自動更新相關的數據以確保系統之一致性", "製造部門提領生產用料：發料作業涉及材枓用量控制問題，應根據銷售資料與 BOM 表求算訂單所需數量，以編製用料計畫表，進行材料發放作業", "退回供應商之退貨：當出庫品項為由供應商訂購取得之商品時，應參考相關訂購及收料相關資料，查核其數量與品項。確認無誤時，則更新庫存數字並登錄退貨交易，登錄完成後列印相關文件", "報廢料處理：庫存管理單位對料件有不堪使用疑慮時，為確保產品的品質應逕行報廢該料件後登錄報廢交易"], "ans": 3, "exp": "報廢料要經過<b>鑑定與核准程序</b>才能報廢，不能由庫存單位逕行報廢，所以 D 錯。"}, {"n": 223, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，有關經濟生產批量模型(EPQ)的相關數據如下，年度需求量 80 單位，年度生產量 90 單位，每件商品單位生產成本 12 元，每批次的生產設置成本 10 元，每件商品的每年持有成本 4 元，則下列何者正確", "opts": ["經濟生產批量 30 單位", "經濟生產批量 60 單位", "經濟生產批量 50 單位", "經濟生產批量 40 單位"], "ans": 1, "exp": "EPQ ＝ √[2DS ÷ (H × (1 − d/p))] ＝ √[2 × 80 × 10 ÷ (4 × (1 − 80/90))] ＝ √(1600 ÷ 0.444) ＝ √3600 ＝ <b>60</b>。"}, {"n": 224, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，如果 20 位顧客需求中，有 13 位顧客能由貨架或成品倉庫中直接供貨，則意謂著其缺貨率為", "opts": ["13%", "65%", "50%", "35%"], "ans": 3, "exp": "缺貨率 ＝ (20 − 13) ÷ 20 ＝ <b>35%</b>。"}, {"n": 225, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，有關存貨周轉率(Inventory Turnover Rate)的敘述，下列何者正確", "opts": ["假如其他因素不變，當年度平均庫存量愈大，則存貨周轉率越大", "假如其他因素不變，當一年的銷貨總成本越小，則存貨周轉率越大", "存貨周轉率(Inventory Turnover Rate)越大經濟效益愈好", "呆料(Slowing-moving Item)是指存貨周轉率越大"], "ans": 2, "exp": "存貨周轉率愈大，經濟效益愈好。A、B 的方向都相反；呆料是周轉率很<b>低</b>的物料，所以 D 錯。"}, {"n": 226, "ch": "第六章 庫存管理系統", "stem": "在 ERP 系統中訂購時機或再訂購點(ROP)可以解決需求不確定(Uncertainty)的庫存管理問題，ROP 的計算公式為 LT * D + SS，假如 Keny 公司的產品 A 的期望前置時間 LT 為 5 天，每一天的期望需求量 D 是 100 件，公司規定產品 A 的安全庫存量 SS 為 15 件，則 ROP 為多少件", "opts": ["520", "515", "510", "505"], "ans": 1, "exp": "ROP ＝ 5 × 100 ＋ 15 ＝ <b>515</b>。"}, {"n": 227, "ch": "第六章 庫存管理系統", "stem": "U2 公司所建置的 ERP 系統中，有關庫存管理的機制採取經濟訂購量(EOQ)模型，其中年度存貨總成本 TC 的計算公式為(購買成本) + (訂購設置成本) + (持有成本)，已知在經濟訂購批量 Q*決策下的各成本分別為年度購買成本 320 元，年度訂購設置成本 8 元，年度持有成本 8 元，則在經濟訂購批量 Q*決策下的年度存貨總成本 TC*為多少元", "opts": ["330", "480", "412", "336"], "ans": 3, "exp": "TC* ＝ 320 ＋ 8 ＋ 8 ＝ <b>336</b>。"}, {"n": 228, "ch": "第六章 庫存管理系統", "stem": "U7 公司所建置的 ERP 系統中，有關庫存管理的機制採取經濟訂購量(EOQ)模型，在經濟訂購批量 Q*決策下的訂購次數為 K*次，已知 K*的計算公式為 D / (Q*)，且年度總需求量 D 為 64(件/年)，經濟訂購批量 Q*為每批次 8 件，則 K*為幾次", "opts": ["10", "9", "8", "7"], "ans": 2, "exp": "K* ＝ D ÷ Q* ＝ 64 ÷ 8 ＝ <b>8</b> 次。"}, {"n": 229, "ch": "第六章 庫存管理系統", "stem": "U9 公司所建置的 ERP 系統中，有關庫存管理的機制採取經濟訂購量(EOQ)模型，在經濟訂購批量 Q*決策下的訂購週期為 Z*天，已知 Z*的計算公式為 T * (Q*) / D，且年度總需求量 D 為 64(件/年)，經濟訂購批量 Q*為每批次 8 件，U9 公司一年營運天數 T 為 240 天，則訂購週期 Z*為多少天", "opts": ["8", "10", "20", "30"], "ans": 3, "exp": "Z* ＝ T × Q* ÷ D ＝ 240 × 8 ÷ 64 ＝ <b>30</b> 天。"}, {"n": 230, "ch": "第六章 庫存管理系統", "stem": "G2 公司所建置的 ERP 系統中，有關庫存管理的機制採取經濟生產批量(EPQ)模型，其中年度存貨總成本 TC 的計算公式為(生產成本) + (生產設置成本) + (存貨持有成本)，已知在經濟生產批量Q*決策下的各成本分別為年度生產成本 320 元，年度生產設置成本 8 元，年度存貨持有成本 8 元，則在經濟生產批量 Q*決策下的年度存貨總成本 TC*為多少元", "opts": ["330", "336", "342", "348"], "ans": 1, "exp": "TC* ＝ 320 ＋ 8 ＋ 8 ＝ <b>336</b>。"}, {"n": 231, "ch": "第六章 庫存管理系統", "stem": "在 ERP 系統中通常會透過存貨價值之記錄來瞭解整個公司財務活動之規劃與短期營運資金之掌控，而存貨價值之計價方式可以用下列公式求得，存貨價值 = (存貨數量) * (單位成本)，已知 Nix公司在某一時段中的存貨數量為 320 單位，單位成本為每個 3 元，則存貨價值為多少元", "opts": ["945", "950", "960", "965"], "ans": 2, "exp": "存貨價值 ＝ 320 × 3 ＝ <b>960</b>。"}, {"n": 232, "ch": "第六章 庫存管理系統", "stem": "在 ERP 系統中庫存數字的記錄方式因為管理需求之不同，基本上可以分為存貨價值之記錄與存貨數量之記錄兩種方式，錯誤的庫存記錄將導致許多重大的營運問題，而庫存數量的計算方式可以為下列的計算公式，有效庫存量 = (現有庫存量) + (已訂未交量) - (已指定用途量)，已知 Page 公司 X7 產品的現有庫存量有 45 件，已訂未交量有 15 件，已指定用途量有 45 件，則有效庫存量為幾件", "opts": ["15", "19", "21", "23"], "ans": 0, "exp": "有效庫存 ＝ 45 ＋ 15 − 45 ＝ <b>15</b>。"}, {"n": 233, "ch": "第六章 庫存管理系統", "stem": "在 Tony 公司的 ERP 系統中是採用 EOQ 模型進行決策，表示存貨消耗率為某一常數(d)以及前置時間(LT)為某一常數值，如果品項 X 的供應商 PAP 的供應前置時間需要 1 天，即 LT=1，且品項X 的存貨消耗率為每天消耗 19 件，根據過去經驗供應商 PAP 通常會使命必達讓 Tony 公司不需要制定安全存貨量 SS，則訂購時機或再訂購點(ROP)的計算公式為(LT) * (d)，試求 Tony 公司的 ROP 為多少件", "opts": ["17", "19", "20", "21"], "ans": 1, "exp": "ROP ＝ LT × d ＝ 1 × 19 ＝ <b>19</b>。"}, {"n": 234, "ch": "第六章 庫存管理系統", "stem": "一般而言，企業導入 ERP 系統模組時，例如訂單輸入、採購、製造或供應鏈管理模組，大都須要同時導入庫存管理模組，因此在整個銷售流程中可以將庫存管理模組視為一個什麼樣的角色存在", "opts": ["完全獨立運作模組的角色", "成本中心的角色", "支援其他模組的角色", "利潤中心的角色"], "ans": 2, "exp": "庫存管理模組是<b>支援其他模組</b>的角色（訂單、採購、製造都需要庫存資料）。"}, {"n": 235, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，安全存量的訂定可以用統計方法求平均值及標準差的方式來計算，下列哪一選項不是影響安全存量大小的因素", "opts": ["平均前置時間與平均需求率", "前置時間與需求率之變異", "勞工人口數量", "期望服務水準"], "ans": 2, "exp": "安全存量受前置時間與需求率（平均與變異）、服務水準影響；勞工人口數量無關。"}, {"n": 236, "ch": "第六章 庫存管理系統", "stem": "庫存管理系統是屬於後勤支援模組，因此在庫存管理系統設計需要考量到許多與庫存有關的事，而系統中的存貨管制功能需求不會隨著下列何項變數之複雜度高低而有所變化", "opts": ["組織業務性質(零售業、製造業)", "福委會的活動次數以及活動規模大小", "組織架構(全球化、區域化)", "會計制度(成本/利潤中心制)"], "ans": 1, "exp": "存貨管制功能的複雜度受業務性質、組織架構、會計制度影響；福委會活動無關。"}, {"n": 237, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，下列有關倉庫中庫存物料的敘述何者為非", "opts": ["庫存物料是否為「呆料」可以庫存周轉率之高低決定之", "庫存物料是否為「廢料」可以庫存周轉率之高低決定之", "所謂「呆料」乃指物料的庫存周轉率低、使用機會小，然而卻並未曾喪失物料原有的特性功能者", "「廢料」之產生是因為物料已喪失或部份喪失物料原有之功能特性，不再具有使用價值"], "ans": 1, "exp": "「呆料」依周轉率判定；「廢料」是依<b>是否喪失功能</b>判定，不是看周轉率，所以 B 錯。"}, {"n": 238, "ch": "第六章 庫存管理系統", "stem": "在倉儲作業中，下列何者不是進行事物料盤點作業的目的", "opts": ["確定各物料品項現存數量，調整財務帳，使料帳合一", "衡量存貨精準度，檢討物料管理績效", "檢討配銷與採購政策", "追蹤盤損、盤盈、帳料誤差的原因，藉以改善庫存管理制度與作業流程品項價值"], "ans": 2, "exp": "盤點的目的是料帳合一、衡量存貨精準度、追蹤差異原因。檢討配銷與採購政策不是盤點的目的。"}, {"n": 239, "ch": "第六章 庫存管理系統", "stem": "下列何者非使用 ERP 庫存管理模組能達成的目標與效益", "opts": ["使生產需求平順", "最佳品項(Items)規劃或產品組合", "預防或降低缺貨發生機率", "滿足預期需求"], "ans": 1, "exp": "庫存模組可以平順生產需求、降低缺貨、滿足預期需求；「最佳產品組合規劃」不是庫存模組的功能。"}, {"n": 240, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，存貨周轉率之計算與下列何者無關", "opts": ["年度平均庫存量", "年度平均使用量", "一年的銷貨量", "一年的銷貨總成本"], "ans": 1, "exp": "存貨周轉率 ＝ 年銷貨量（或銷貨成本）÷ 年度平均庫存量，與「年度平均使用量」無關。"}, {"n": 241, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，物料主檔為物料管理系統中最基礎的標準資料檔，一般會包含下列數種型態的資料", "opts": ["客戶、庫存、訂購、定價、軟體", "技術、庫存、成本、軟體、硬體", "採購、庫存、訂購、廠商、軟體", "技術、庫存、訂購、成本、軟體(例如最低階碼 LLC)"], "ans": 3, "exp": "物料主檔包含技術、庫存、訂購、成本、軟體（例如最低階碼 LLC）資料。"}, {"n": 242, "ch": "第六章 庫存管理系統", "stem": "下列選項中對於庫存管理系統之倉儲作業的描述何者不正確", "opts": ["為接收、儲存、保管、發放物品的管理作業", "歷經發料、實體撿貨(Picking)、入庫、決算等階段", "管理範圍包括原物料、零組件、備用零件、半成品、成品", "四項作業內容有收料、發料、呆料與廢料處理、盤點等作業"], "ans": 1, "exp": "倉儲作業的四項內容：收料、發料、呆廢料處理、盤點。B 列的階段不正確。"}, {"n": 243, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，物料主檔不包括下列哪種型態之資料", "opts": ["途程(Routing)資訊", "技術資訊", "訂購資訊", "成本資訊"], "ans": 0, "exp": "途程 (Routing) 是生產規劃的獨立主檔，不包含在物料主檔中。"}, {"n": 244, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，EOQ 方法中的經濟訂購量係指使總成本最低的訂購量，其計算與下列何者無關", "opts": ["購買成本", "存貨持有成本", "採購或設置成本", "需求量"], "ans": 0, "exp": "EOQ ＝ √(2DS ÷ H)，只與需求量、訂購（設置）成本、持有成本有關，與購買成本（單價）無關。"}, {"n": 245, "ch": "第六章 庫存管理系統", "stem": "ERP 系統對庫存管理期望所能達成的效益有", "opts": ["1245", "1345", "1234", "2345"], "ans": 2, "exp": "ERP 庫存管理的效益：帳務效率、即時庫存資訊、掌握異動與呆滯、提高盤點效率 → 1234。", "items": ["(1) 提高帳務處理的效率與正確性", "(2) 掌握正確及時的庫存資訊", "(3) 掌握存貨異動、週轉、以及呆滯狀況", "(4) 提高盤點作業的效率", "(5) 降低存貨的循環週期"]}, {"n": 246, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，下列何者是決定安全存量考慮的因素", "opts": ["123", "234", "124", "1234"], "ans": 0, "exp": "安全存量的考量：服務水準、需求率變異、前置時間變異 → 123。獲利率無關。", "items": ["(1) 服務水準的高低", "(2) 需求率變異程度", "(3) 前置時間變異程度", "(4) 獲利率的高低"]}, {"n": 247, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統之倉儲作業中，請問下列描述何者錯誤", "opts": ["收料作業可視為成本控制模組的後續作業", "發料作業為庫存管理系統主要的工作之一", "呆廢料會佔用寶貴的儲存空間", "進行盤點作業有助於及早修正庫存紀錄之錯誤"], "ans": 0, "exp": "收料作業是<b>採購</b>系統的後續作業，不是成本控制模組的後續，所以 A 錯。"}, {"n": 248, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問物料主檔的內容應包含何種資訊", "opts": ["1234", "123", "234", "134"], "ans": 0, "exp": "物料主檔包含庫存量、製造費用（成本）、最低階編碼、前置時間 → 1234 全部。", "items": ["(1) 庫存量", "(2) 製造費用", "(3) 最低階編碼", "(4) 前置時間"]}, {"n": 249, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，請問何者為物料的分類原則", "opts": ["1234", "123", "234", "134"], "ans": 3, "exp": "物料的分類原則：用途、材質、成本結構 → 134。", "items": ["(1) 用途", "(2) 品質", "(3) 材質", "(4) 成本結構"]}, {"n": 250, "ch": "第六章 庫存管理系統", "stem": "ERP 庫存管理模組的目的在於達成存貨有效管理，因此該模組功能應具備", "opts": ["124", "123", "134", "234"], "ans": 0, "exp": "庫存模組功能：即時處理存貨帳務、異動統計與呆滯分析、盤點管理 → 124。(3) 推算衍生需求屬於 MRP。", "items": ["(1) 即時處理存貨帳務", "(2) 庫存異動統計及呆滯料分析管理", "(3) 推算各衍生需求進行物料的領用與控制", "(4) 盤點作業管理"]}, {"n": 251, "ch": "第六章 庫存管理系統", "stem": "在 ERP 系統中通常會以存貨周轉率(Inventory Turnover Rate)來掌控存貨在倉儲系統中的流動性，甚至作為檢視是否為呆料(Slowing-moving Item)的基準，過程中首先必須計算出物料的標準儲存日數，其公式為物料標準儲存日數 = (公司的一年營運時間) / (平均存貨週轉率)，接著必須與物料平均標準儲存日數比較，大於物料平均標準儲存日數者可被認定為呆料，假設物料平均標準儲存日數為 25 天，而該公司的一年營運時間為 250 天，則下列哪一個物料會被視為呆料處理", "opts": ["S1 物料的存貨周轉率為 12", "S2 物料的存貨周轉率為 8", "S3 物料的存貨周轉率為 14", "S4 物料的存貨周轉率為 19"], "ans": 1, "exp": "標準儲存日數 ＝ 250 ÷ 周轉率，大於 25 天就是呆料，也就是周轉率 < 10。S2 為 250 ÷ 8 ＝ 31.25 天 → <b>呆料</b>。"}, {"n": 252, "ch": "第六章 庫存管理系統", "stem": "在庫存管理系統中，經濟訂購批量模型(Economic Order Quantity, EOQ)中的總成本包含", "opts": ["1234", "123", "134", "234"], "ans": 2, "exp": "EOQ 總成本 ＝ 訂購準備成本 ＋ 購買成本 ＋ 持有成本 → 134（倉儲成本已包含在持有成本中）。", "items": ["(1)訂購準備成本", "(2) 倉儲成本", "(3) 購買成本", "(4) 持有成本"]}, {"n": 253, "ch": "第六章 庫存管理系統", "stem": "收料作業可視為採購系統之後續作業，亦可視為倉儲管理的前置作業，也是庫存管理系統的一部分，在 ERP 系統中是歸屬於物料管理(Material Management, MM)模組，而關於訂購補貨收料作業流程之描述，下列選項何者是錯誤", "opts": ["收料作業為採購系統的前置作業，亦可視為倉儲管理的後續作業", "當進料與相關單據檢閱功能啟動後發現資料有不一致時，ERP 系統會進入退貨作業", "當進料與相關單據檢閱功能啟動後發現資料無誤時，ERP 系統會進入訂購商品確認", "當訂購商品進貨計畫與訂貨商品到貨通知同時確認成立時，進料與相關單據檢閱功能被啟動"], "ans": 0, "exp": "收料是<b>採購的後續</b>、<b>倉儲的前置</b>作業；A 把順序講反了。"}, {"n": 254, "ch": "第六章 庫存管理系統", "stem": "收料作業可視為採購系統之後續作業，亦可視為倉儲管理的前置作業，也是庫存管理系統的一部分，在 ERP 系統中是歸屬於物料管理(Material Management, MM)模組，而關於訂購補貨收料作業流程之描述，下列選項何者錯誤", "opts": ["當進料與相關單據檢閱功能啟動後發現資料無誤時，ERP 系統會進入訂購商品確認", "當 ERP 系統會進入訂購商品確認後，會進入更新庫存資料狀態，等更新庫存資料後，會通知採購部門並接著列印進貨單據", "當 ERP 系統會進入訂購商品確認後，會進入進貨商品儲存計畫狀態，接著會通知倉儲部門執行進貨商品入庫事件", "倉儲管理為收料作業的前置作業，亦可視為採購系統的後續作業"], "ans": 3, "exp": "同上，D 把順序講反了：倉儲管理是收料作業的<b>後續</b>作業。"}, {"n": 255, "ch": "第六章 庫存管理系統", "stem": "收料作業可視為採購系統之後續作業，亦可視為倉儲管理的前置作業，也是庫存管理系統的一部分，在 ERP 系統中是歸屬於物料管理(Material Management, MM)模組，而關於收料入庫者為製造單位生產完成的在製品或製成品時，下列選項何者是錯誤", "opts": ["當入庫收料計畫與生產品項完成通知同時確認成立時，入庫資料檢閱功能被啟動", "當入庫資料檢閱功能完成後，如有待驗品項狀態則會後續啟動品質系統功能進行品質檢驗", "當入庫資料檢閱功能完成後，如無誤則會通知製造部門執行進貨商品入庫活動", "當入庫資料檢閱功能完成後，如無誤則會進入更新庫存數量與價格資料狀態"], "ans": 2, "exp": "生產完成品入庫時，資料檢閱無誤後應通知<b>倉儲部門</b>執行入庫，而且不是「進貨商品」，所以 C 錯。"}, {"n": 256, "ch": "第七章 財會作業流程", "stem": "會計時間終了時，將預付保險費帳戶會依時間流逝而自然轉成保險費用，會計循環中此舉動稱為", "opts": ["試算", "調整", "結帳", "過帳"], "ans": 1, "exp": "期末把預付保險費依時間轉成費用 → <b>調整</b>。"}, {"n": 257, "ch": "第七章 財會作業流程", "stem": "在 ERP 系統財會作業流程中，有關結帳作業，下列何者描述錯誤", "opts": ["將各項收入及費用會計科目結清", "將各項資產及負債會計科目結清", "常常在會計期間終了時進行", "結帳目的是為了釐清各期績效權責"], "ans": 1, "exp": "結帳只結清<b>收入與費用（虛帳戶）</b>；資產與負債（實帳戶）的餘額要結轉到下期，所以 B 錯。"}, {"n": 258, "ch": "第七章 財會作業流程", "stem": "一般企業的財會作業流程是一連串企業對其所營運的經濟事件或交易，加以確認，分類，記錄，與彙總之全部過程，流程中有七個階段須執行，而確認階段工作的主要目的為", "opts": ["應收 / 應付款項確認", "確認會計帳中依期間內發生之事實狀況調整金額數字", "確認是否為財會所處理的經濟事實", "檢查分錄或過帳是否正確無誤"], "ans": 2, "exp": "確認階段：判斷這個事件<b>是不是需要由財會處理的經濟事實</b>。"}, {"n": 259, "ch": "第七章 財會作業流程", "stem": "在國際財務報導準則(International Financial Reporting Standards, IFRS)的規範下，企業若使用第三層的輸入層衡量標的物的公允價值(Fair Value)時，報表應揭露衡量", "opts": ["對當期損益或其他綜合損益之影響", "對當期資產負債或其他綜合損益之影響", "對當期權益變動或其他綜合損益之影響", "對當期現金流量或其他綜合損益之影響"], "ans": 0, "exp": "IFRS 下使用第三層輸入值衡量公允價值時，要揭露它<b>對當期損益或其他綜合損益的影響</b>。"}, {"n": 260, "ch": "第七章 財會作業流程", "stem": "ERP 系統中，有關供應商明細帳的會計科目，通常是由哪一部門人員建立廠商基本資料時即一併建立", "opts": ["會計部門人員", "採購部門人員", "生產部門人員", "出納部門人員"], "ans": 1, "exp": "供應商明細帳科目由<b>採購人員</b>在建立廠商基本資料時一併建立。"}, {"n": 261, "ch": "第七章 財會作業流程", "stem": "在 ERP 系統財會作業流程中，試算階段工作的主要目的在於可檢查出下列何種錯誤的發生", "opts": ["可查出過帳時所發生之一切錯誤", "可查出借貸失衡之錯誤(即可檢查出借方金額與貸方金額是否相等)", "可查出財報編表失真之錯誤", "只要合計相等，即證明一切過帳無錯誤"], "ans": 1, "exp": "試算只能查出<b>借貸不平衡</b>的錯誤；借貸相等並不代表完全沒有錯。"}, {"n": 262, "ch": "第七章 財會作業流程", "stem": "應付帳款管理及應收帳款管理是財會業務非常重視的工作項目，而下列何者有關應付帳款的描述有誤", "opts": ["它的管理績效影響組織財務流通能力", "它常常是由組織進貨活動所啟動", "執行付款時須記錄會計分錄", "它是組織的一項長期負債"], "ans": 3, "exp": "應付帳款是<b>流動（短期）負債</b>，不是長期負債。"}, {"n": 263, "ch": "第七章 財會作業流程", "stem": "在財會作業模組中，下列敘述何者有誤", "opts": ["銷售模組的交貨事件會自動啟動更新應收帳款會計分類帳戶", "人力資源模組發放員工薪資會自動啟動更新應付薪資會計分類帳戶及更新薪資費用", "存貨管理模組因交貨事件會自動啟動更新成品存貨價值", "物料管理模組(MM)的訂購原物料驗收完成時會自動啟動更新應收帳款會計分類帳戶"], "ans": 3, "exp": "MM 的原物料驗收完成時，更新的是<b>應付</b>帳款，不是應收帳款，所以 D 錯。"}, {"n": 264, "ch": "第七章 財會作業流程", "stem": "在 ERP 系統財會作業流程中，結帳階段工作的主要目的", "opts": ["調整會計科目", "編製報表", "釐清各會計期間的績效權責", "顯示個別會計科目的變化情形"], "ans": 2, "exp": "結帳的目的：<b>釐清各會計期間的績效權責</b>。"}, {"n": 265, "ch": "第七章 財會作業流程", "stem": "在財會作業模組中，對於財務報告循環流程的觀念何者有誤", "opts": ["財務報告循環僅能提供政府、股東、及投資大眾等參考", "遵循一定的會計制度來記錄、蒐集與組織相關的經濟交易事件", "為會計資訊的定期彙整循環", "可依實際需求隨時要求最即時、最正確的財務資訊報導"], "ans": 0, "exp": "財務報告除了提供外部使用者（政府、股東、投資人），也提供<b>內部管理者</b>使用，所以 A 說「僅能提供」是錯的。"}, {"n": 266, "ch": "第七章 財會作業流程", "stem": "ERP 系統主要是為了幫助企業經營管理者，以企業整體資源為規劃主體，進行各項業務活動之規劃及執行成效管理，而建置的一套資訊系統，因此，在理想的 ERP 系統運作環境中，組織財會處理作業模組與 ERP 系統中的其他模組有著什麼樣的關係存在", "opts": ["僅有資訊整合的關係存在", "僅有流程整合的關係存在", "資訊整合與流程整合的關係存在", "生產計畫整合的關係存在"], "ans": 2, "exp": "財會模組與其他模組同時有<b>資訊整合與流程整合</b>的關係。"}, {"n": 267, "ch": "第七章 財會作業流程", "stem": "從財會作業的角度來看，關於組織與客戶之間的關係敘述，下列何者錯誤", "opts": ["組織須要建立即時而正確的客戶資料", "組織存在的目的便是要提供客戶所需要的產品或服務，以求永續經營", "行銷部門人員依照客戶資料進行促銷活動、爭取訂單，組織將貨品或服務由業務部門人員或行銷部門依照客戶訂單上指定的規格與數量提供給客戶後，ERP 系統便會自動將該客戶記錄為該筆交易款項的債權人", "財會作業須依照交易紀錄進行後續應收帳款催討、收款與管理"], "ans": 2, "exp": "客戶取得商品後是欠款的一方，應記錄為<b>債務人</b>（企業有應收帳款），不是債權人，所以 C 錯。"}, {"n": 268, "ch": "第七章 財會作業流程", "stem": "在財會作業模組中，下列何者有關組織應收帳款的描述有誤", "opts": ["應收帳款是組織的一項固定資產", "組織應收帳款管理績效影響組織財務流通能力極大", "應收帳款管理管理不當時，可能會出現帳款無法催討成功的呆帳", "財會作業必須非常重視應收帳款的催繳規劃與執行"], "ans": 0, "exp": "應收帳款是<b>流動資產</b>，不是固定資產。"}, {"n": 269, "ch": "第七章 財會作業流程", "stem": "在國際財務報導準則(International Financial Reporting Standards, IFRS)的規範下，企業價值資訊揭露重心將從", "opts": ["綜合資產負債表移轉至財務狀況表", "損益表移轉至資產負債表", "綜合權益變動表移轉至財務狀況表", "綜合現金流量表移轉至財務狀況表"], "ans": 1, "exp": "IFRS 讓揭露重心<b>從損益表移轉到資產負債表</b>（重視企業價值與公允價值）。"}, {"n": 270, "ch": "第七章 財會作業流程", "stem": "ERP 系統中財會作業流程階段裡的過帳階段，主要目的是", "opts": ["將日記簿的分錄轉記到總帳以及分類帳去", "將傳票的內容成立分錄", "將不符合現實狀況的資產結構調整", "將臨時科目結清"], "ans": 0, "exp": "過帳 ＝ 把日記簿的分錄轉記到總帳與分類帳。"}, {"n": 271, "ch": "第七章 財會作業流程", "stem": "在財會作業模組中，有關企業營運活動下基本資料建立與維護的敘述，下列何者正確", "opts": ["供應廠商的資料由業務建立", "客戶資料由採購人員建立", "供 態", "當人力資源模組(HR)已完成發放員工薪資時，除了會進入會計總帳處理狀態之外，系統也會進入應收帳款處理狀態"], "ans": 1, "exp": "SD 完成交貨 → 進入總帳處理與<b>應收帳款</b>處理。HR 發薪則對應應付薪資，不是應收帳款，也不是途程或 BOM。"}, {"n": 296, "ch": "第七章 財會作業流程", "stem": "下列敘述何者錯誤", "opts": ["企業分階段導入 ERP 系統時，財務會計模組必是第一階段名單內的模組", "ERP 財務會計模組提供即時性(Real time)工程研發技術與生產排程資訊，幫助企業經理人即時掌握關鍵資訊", "「8 十營運模式」與「8 十獲利模式」，垂直線與資源規劃有關，水平線與資源轉化有關", "財務會計模組能提供診斷企業營運模式健全性的關鍵指標"], "ans": 1, "exp": "財會模組提供的是即時<b>財務</b>資訊，不提供工程研發或生產排程資訊，所以 B 錯。"}, {"n": 297, "ch": "第八章 成本控制模組", "stem": "ERP 系統中，以組織內部管理會計觀點來提供財務資訊的是", "opts": ["財務會計模組", "存貨管理模組", "成本控制(Controlling, CO)模組", "生產規劃模組"], "ans": 2, "exp": "以內部管理會計觀點提供財務資訊 → <b>成本控制 (CO) 模組</b>；財務會計 (FI) 則服務外部使用者。"}, {"n": 298, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，以科學方法預計在良好工作效率下生產所應有之成本的方法稱為", "opts": ["分批成本制", "責任會計制", "逆溯成本制", "標準成本制(Standard Cost)"], "ans": 3, "exp": "預計在良好效率下應有的成本 → <b>標準成本制</b>。"}, {"n": 299, "ch": "第八章 成本控制模組", "stem": "成本控制 (CO) 模組是以內部管理會計的觀點來提供財務資訊，下列何者對管理會計之描述是不正確的", "opts": ["管理會計通常是針對組織整體來進行分析", "管理會計不須遵守一般公認會計原則", "管理會計是對組織內部管理者提供管理決策攸關之會計資訊", "管理會計提供貨幣與非貨幣性資料"], "ans": 0, "exp": "管理會計可以針對部門、產品、專案等<b>局部</b>分析，不只看組織整體，所以 A 錯。財務會計才著重組織整體。"}, {"n": 300, "ch": "第八章 成本控制模組", "stem": "在成本控制 (CO) 模組中，請問下列有關作業成本制(Activity-Based Costing, ABC)之敘述，何者是不正確的", "opts": ["ABC 僅適用於製造業", "ABC 原係用於改善傳統以直接人工分攤製造費用之缺點", "成本分派構面係以兩階段步驟來計算成本標的之精確成本", "流程構面係用以進行作業/流程改善"], "ans": 0, "exp": "作業成本制 (ABC) 也適用於服務業等各種產業，不只適用製造業，所以 A 錯。"}, {"n": 301, "ch": "第八章 成本控制模組", "stem": "下列有關 ERP 的 CO 模組之副模組的敘述，何者是不正確的", "opts": ["成本中心會計(Cost Center Accounting)副模組以成本中心為成本標的", "內部訂單會計 (Internal Orders Accounting) 副模組以事件或專案為成本標的", "獲利能力分析(Profitability Analysis)副模組以部門（departments）為成本標的", "作業成本制 (Activity-Based Costing) 副模組以流程 (processes) 為成本標的"], "ans": 2, "exp": "獲利能力分析的成本標的是<b>市場區隔</b>（產品、顧客、地區等），不是部門，所以 C 錯。"}, {"n": 302, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，下列何者不是平衡計分卡(Balanced Scorecard)的績效衡量構面", "opts": ["成本(Cost)", "財務(Financial)", "顧客(Customer)", "企業內部流程(Internal Business Process)"], "ans": 0, "exp": "平衡計分卡的四個構面：財務、顧客、內部流程、學習與成長。「成本」不是構面。"}, {"n": 303, "ch": "第八章 成本控制模組", "stem": "在管理會計之績效衡量技術中，企業實際衡量之績效指標值若與做得最好的企業作比較，以判別其績效之優劣，此管理會計技術稱為", "opts": ["平衡計分卡(Balanced Scorecard)", "標竿制度(Benchmarking)", "經濟附加價值法(Economic-Value-Added Method)", "非財務績效衡量法(Nonfinancial Performance Measurement)"], "ans": 1, "exp": "拿自己的績效跟做得最好的企業比較 → <b>標竿制度 (Benchmarking)</b>。"}, {"n": 304, "ch": "第八章 成本控制模組", "stem": "就管理會計的品質成本衡量技術而言，下列何者不是一般衡量品質成本的分類項目", "opts": ["預防成本(Prevention Costs)", "可控制成本(Controllable Costs)", "評鑑成本(Appraisal Costs)", "內部失敗成本(Internal Failure Costs)"], "ans": 1, "exp": "品質成本分成預防、評鑑、內部失敗、外部失敗四類。可控制成本是責任會計的概念。"}, {"n": 305, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，ABC 作業成本制的流程構面，係先將企業營運的流程劃分出來，再依照何種成本計算方式來計算流程之成本", "opts": ["部門", "流程", "作業", "工作中心"], "ans": 2, "exp": "ABC 的流程構面先劃分流程，再依<b>作業</b>計算流程的成本。"}, {"n": 306, "ch": "第八章 成本控制模組", "stem": "在成本控制(CO)模組中，下列對成本中心會計(Cost Center Accounting, CCA)副模組的敘述，何者正確", "opts": ["計算機器或是人工佔產品成本的比例", "依組織觀點來劃分費用", "可以依全廠費用分攤率或是部門別的費用分攤率來分攤", "計算每個工作中心的作業成本"], "ans": 1, "exp": "成本中心會計 (CCA) 依<b>組織（部門）觀點</b>劃分與報導費用。"}, {"n": 307, "ch": "第八章 成本控制模組", "stem": "在成本控制(CO)模組中，有關產品成本控制(Product Cost Controlling, PCC)的描述，下列何者正確", "opts": ["用以估計產品標準成本", "根據流程的觀點來報導該組織之費用支出", "對於專案的相關費用進行規劃、偵測、資料收集與分攤", "PCC 方法適用在易腐性產品"], "ans": 0, "exp": "產品成本控制 (PCC) 用來<b>估計產品標準成本</b>並計算實際成本與差異。B 是 ABC，C 是內部訂單會計。"}, {"n": 308, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，請問於作業成本制中，哪個構面是採兩階段成本追溯程序，先依各項作業所耗之資源多寡，將資源成本追溯於各項作業，再依各成本標的耗用之作業量多寡，而將作業成本追溯於各項成本標的的稱為", "opts": ["成本分派構面", "資源分派構面", "程序構面", "作業構面"], "ans": 0, "exp": "兩階段追溯（資源 → 作業 → 成本標的） → <b>成本分派構面</b>。"}, {"n": 309, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，何者是依據財務、顧客、企業內部流程、學習與成長四個構面發展出績效指標，同時強調財務性與非財務性之績效衡量指標", "opts": ["平衡計分卡(BSC)", "企業價值報告", "程序價值分析", "柏拉圖分析"], "ans": 0, "exp": "財務、顧客、內部流程、學習與成長四個構面 → <b>平衡計分卡 (BSC)</b>。"}, {"n": 310, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，請問何者指的是較大金額的投資，所牽涉時間較長，其決策錯誤對企業影響極深。而進行此類分析時，最好要考慮貨幣的時間價值，並著重現金流量以及現金流入流出的時間", "opts": ["短期決策分析", "資本支出決策(Captial Budgeting)", "內部轉移計價", "產品訂價"], "ans": 1, "exp": "金額大、時間長、要考慮貨幣時間價值與現金流量 → <b>資本支出決策 (Capital Budgeting)</b>。"}, {"n": 311, "ch": "第八章 成本控制模組", "stem": "有關生產成本的計算上，在不同的生產方式下會有不同的成本制度，其中分批成本制較適合下列何種生產方式", "opts": ["連續式生產", "流程式生產", "訂單式生產", "及時供補(JIT)式生產"], "ans": 2, "exp": "分批成本制適合<b>訂單式生產</b>（每批或每張訂單不同）；連續或流程式生產適合分步成本制。"}, {"n": 312, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中成本分攤的意義是在進行製造費用的分攤，一般而言，下列哪一種計算產品生產成本的方法較能忠實反應成本分攤情況", "opts": ["分批成本制", "分步成本制", "作業成本制(ABC)", "逆溯成本制"], "ans": 2, "exp": "<b>作業成本制 (ABC)</b> 依作業動因分攤製造費用，最能忠實反映成本。"}, {"n": 313, "ch": "第八章 成本控制模組", "stem": "有關生產成本的計算上，在不同的生產方式下會有不同的成本制度，其中以分步成本制計算時，下列何者為生產成本累積之標的", "opts": ["生產訂單", "生產部門或製程", "公司整體", "專案訂單"], "ans": 1, "exp": "分步成本制以<b>生產部門或製程</b>為成本累積的標的。"}, {"n": 314, "ch": "第八章 成本控制模組", "stem": "下列那一個成本控制(CO)模組的副模組係為了提供責任會計所需資訊而自部門之觀點來報導一組織的費用支出", "opts": ["作業成本制(Activity-Based Costing)", "成本中心會計(Cost Center Accounting)", "內部訂單會計 (Internal Orders Accounting)", "產品成本控制(Product Cost Controlling)"], "ans": 1, "exp": "為責任會計、從部門觀點報導費用 → <b>成本中心會計 (CCA)</b>。"}, {"n": 315, "ch": "第八章 成本控制模組", "stem": "對成本控制(CO)模組描述下列何者不正確", "opts": ["CO 模組屬一種觀念性設計", "CO 模組強調企業交易程序的自動化", "CO 模組強調與其他模組整合", "CO 模組以分析資訊為主要目的"], "ans": 1, "exp": "CO 模組以<b>分析資訊</b>為主；強調交易程序自動化的是 FI、SD、MM 等作業性模組，所以 B 錯。"}, {"n": 316, "ch": "第八章 成本控制模組", "stem": "管理會計係提供管理一家公司所需之會計資訊，而下列何類資訊不是管理會計可提供的", "opts": ["產品(或服務)成本之資訊", "短期例行性作業之規劃與控制之資訊", "長短期非例行性決策之資訊", "產品市場佔有率之資訊"], "ans": 3, "exp": "產品市場佔有率是行銷資訊，不是管理會計提供的資訊。"}, {"n": 317, "ch": "第八章 成本控制模組", "stem": "有關生產成本的計算上，在不同的生產方式下會有不同的成本制度，其中以生產訂單或生產批次為成本標的，而以分批成本單來彙集某生產訂單之所有相關成本的方法稱為", "opts": ["成本數量利潤分析", "標準成本制", "作業成本制", "分批成本制"], "ans": 3, "exp": "以生產訂單或批次為成本標的、用分批成本單彙集成本 → <b>分批成本制</b>。"}, {"n": 318, "ch": "第八章 成本控制模組", "stem": "為了正確計算在各產量下之產品總成本，應使用下列哪種管理會計技術，以便將半變動成本中之固定成本與變動成本分離出來", "opts": ["變動成本法", "作業成本制", "成本習性分析", "成本數量利潤分析"], "ans": 2, "exp": "把半變動成本拆成固定與變動兩部分 → <b>成本習性分析</b>。"}, {"n": 319, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，可用於分析變動成本、固定成本、售價及銷售組合之變動，對於利潤之影響的分析方法為", "opts": ["成本效益分析(Cost-Benefit Analysis)", "成本習性分析(Cost Behavior Analysis)", "邊際貢獻分析(Contribution Margin Analysis)", "成本數量利潤分析(Cost-Volume-Profit Analysis)"], "ans": 3, "exp": "分析成本、售價、銷量對利潤的影響 → <b>成本數量利潤分析 (CVP)</b>。"}, {"n": 320, "ch": "第八章 成本控制模組", "stem": "下列那一成本控制(CO)的副模組係以流程(Process)觀點來報導該組織之費用支出，並可用以尋找企業流程再造之機會所在", "opts": ["成本中心會計(Cost Center Accounting)", "作業成本制(Activity-Based Costing)", "內部訂單會計 (Internal Orders Accounting)", "產品成本控制(Product Cost Controlling)"], "ans": 1, "exp": "以流程觀點報導費用、找出流程再造機會 → <b>作業成本制 (ABC)</b>。"}, {"n": 321, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，下列哪一種計算成本方式，可編製邊際貢獻式損益表，以提供短期決策分析", "opts": ["歸納成本法", "完全成本法", "固定成本法", "變動成本法(Variable Costing)"], "ans": 3, "exp": "<b>變動成本法</b>可以編製邊際貢獻式損益表，用於短期決策。"}, {"n": 322, "ch": "第八章 成本控制模組", "stem": "在成本控制 (CO) 模組中，下列哪一副模組與物料管理(MM)模組緊密結合，以產生新標準成本估計值，並與生產模組(PP)整合以計算實際生產成本與差異", "opts": ["產品成本控制(PCC)", "成本中心會計(CCA)", "作業成本制(ABC)", "獲利能力分析(PA)"], "ans": 0, "exp": "與 MM 結合產生標準成本、與 PP 結合計算實際成本與差異 → <b>產品成本控制 (PCC)</b>。"}, {"n": 323, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，請問 ABC(作業成本制)以何者來衡量各成本標的作業耗用量", "opts": ["作業動因(Activity Drivers)", "成本動因", "資源動因", "程序動因"], "ans": 0, "exp": "ABC 以<b>作業動因 (Activity Drivers)</b> 衡量成本標的耗用的作業量；資源動因則用來把資源分到作業。"}, {"n": 324, "ch": "第八章 成本控制模組", "stem": "製成品檢驗是屬於下列何種品質成本控制模組類別", "opts": ["評鑑成本", "預防成本", "內部失敗成本", "外部失敗成本"], "ans": 0, "exp": "製成品檢驗屬於<b>評鑑成本</b>（檢查是否符合標準）。"}, {"n": 325, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，可以求出損益兩平點(Break-Even Point)的成本分析方法是", "opts": ["成本數量利潤分析", "獲利能力分析", "責任會計分析", "標準成本分析"], "ans": 0, "exp": "損益兩平點用<b>成本數量利潤分析 (CVP)</b> 求得。"}, {"n": 326, "ch": "第八章 成本控制模組", "stem": "在管理會計技術之變動成本法下，下列何者不屬於產品成本", "opts": ["變動製造費用", "固定製造費用", "直接人工", "直接材料"], "ans": 1, "exp": "變動成本法只把變動生產成本計入產品成本；<b>固定製造費用</b>當作期間費用。"}, {"n": 327, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，有關產品成本之計算，下列何者為實際發生之製造費用時應計入的帳戶", "opts": ["直接費用", "製造費用統制帳", "在製品", "已分攤製造費用"], "ans": 1, "exp": "實際發生的製造費用記入<b>製造費用統制帳</b>；依預計分攤率分攤的部分記入已分攤製造費用。"}, {"n": 328, "ch": "第八章 成本控制模組", "stem": "對於作業成本制(Activity Based Costing, ABC)產生原因以及相關觀念，下列敘述何者錯誤", "opts": ["製造費用佔製造成本的比例大幅上升", "傳統成本會計的費用分攤方式容易造成成本計算的極大扭曲", "直接人工佔製造成本的比例大幅下降", "作業成本制(ABC)與存貨 ABC 分析法是採用相同理論"], "ans": 3, "exp": "作業成本制 (ABC) 與存貨的 ABC 分析只是名稱相同，<b>理論完全不同</b>，所以 D 錯。"}, {"n": 329, "ch": "第八章 成本控制模組", "stem": "請問有關管理會計技術中，有關規劃與控制資訊的描述，何者錯誤", "opts": ["標準成本制可用以求算損益兩平點", "變動成本法可編製邊際貢獻式損益表", "市場區隔報表以各種區隔變數來劃分市場", "經由品質成本的衡量，可將據以決定品質改善的方向與優先順序"], "ans": 0, "exp": "求損益兩平點要用 <b>CVP 分析</b>，不是標準成本制，所以 A 錯。"}, {"n": 330, "ch": "第八章 成本控制模組", "stem": "成本控制模組(CO)是以內部管理會計的觀點來提供財務資訊，由於 ERP 系統具有「即時」與「整合」的兩大特性，因此可以提供內部各階層管理者所需要的管理會計資訊，不包括下列何者", "opts": ["對外發佈財務報表的資訊", "規劃與控制的資訊", "產品成本計算的資訊", "決策的資訊"], "ans": 0, "exp": "對外發佈財務報表是<b>財務會計 (FI)</b> 的功能，不屬於 CO。"}, {"n": 331, "ch": "第八章 成本控制模組", "stem": "現代製造環境下，由 Cooper 與 Kaplan(1980)兩位學者發展出以什麼基礎來分攤製造費用，以避免扭曲產品成本計算的制度", "opts": ["直接人工", "直接材料", "部門", "作業"], "ans": 3, "exp": "Cooper 與 Kaplan 提出以<b>作業</b>為基礎分攤製造費用（ABC）。"}, {"n": 332, "ch": "第八章 成本控制模組", "stem": "有關製造費用成本之處理，期末須將已分攤製造費用帳戶之餘額結轉至製造費用統制帳之貸方，此時若該統制帳為借餘，代表製造費用少分攤，應將少分攤之製造費用分配給", "opts": ["123", "234", "124", "1234"], "ans": 2, "exp": "少分攤的製造費用要分配給在製品、製成品、銷貨成本 → 124。", "items": ["(1) 在製品", "(2) 製成品", "(3) 直接材料", "(4) 銷貨成本"]}, {"n": 333, "ch": "第八章 成本控制模組", "stem": "有關產品成本之計算，下列敘述何者有誤", "opts": ["若實際製造費用大於已分攤製造費用稱為多分攤製造費用", "在製品帳戶以預計分攤率計算出的已分攤製造費用為主", "實際發生之製造費用記錄於製造費用統制帳科目", "多分攤製造費用可自在製品、製成品與銷貨成本扣除"], "ans": 0, "exp": "實際製造費用大於已分攤數，是「<b>少</b>分攤」，所以 A 說「多分攤」是錯的。"}, {"n": 334, "ch": "第八章 成本控制模組", "stem": "針對 ABC(Activity Based Costing)模式，下列敘述何者有誤", "opts": ["ABC 模式包含三個構面", "依作業成本制 (ABC) 所衍生管理方法稱為作業成本管理", "用柏拉圖分析找出作業改善的優先順序", "用流程價值分析 (Process Value Analysis) 區分有附加價值或無附加價值作業"], "ans": 0, "exp": "ABC 模式只有<b>兩個構面</b>（成本分派構面與流程構面），所以 A「三個構面」錯。"}, {"n": 335, "ch": "第八章 成本控制模組", "stem": "下列有關製造業產品成本計算之敘述，何者是不正確的", "opts": ["製造費用統制帳戶記載的是以預計製造費用分攤率分攤給產品的製造費用", "間接材料成本屬於製造費用的一部份", "在製品存貨帳戶記載的是未完工之在製品的應計成本", "製成品售出時，應將其生產成本由製成品帳戶移轉至銷貨成本帳戶"], "ans": 0, "exp": "製造費用統制帳記錄的是<b>實際發生</b>的製造費用；依預計分攤率分攤的部分記在「已分攤製造費用」，所以 A 錯。"}, {"n": 336, "ch": "第八章 成本控制模組", "stem": "下列有關成本控制工具之敘述中，何者是不正確的", "opts": ["在標準成本制之下，對於任何成本差異項目，無論金額大小，均應進行差異分析", "預算可用標準成本來編製，以縮短預算編製時間", "責任會計雖可顯示主管之成本責任所在，但其最終目的仍在於成本控制", "經由品質成本的衡量，將可據以決定品質改善的方向與優先順序"], "ans": 0, "exp": "標準成本制採<b>例外管理</b>，只針對重大差異做分析，不是每一項都要分析，所以 A 錯。"}, {"n": 337, "ch": "第八章 成本控制模組", "stem": "成本控制 (CO) 模組是以內部管理會計的觀點來提供財務資訊，在管理會計技術中，下列何者不是成本規劃與控制的直接工具", "opts": ["品質成本控制", "責任會計", "成本習性分析(Cost Behavior Analysis)", "標準成本制"], "ans": 2, "exp": "成本習性分析是用來<b>分析</b>成本的性質，不是規劃與控制的直接工具。"}, {"n": 338, "ch": "第八章 成本控制模組", "stem": "下列有關成本制度之敘述，何者是不正確的", "opts": ["不同的生產型態，應使用不同的成本制度", "分批成本制係以生產功能部門為成本累計的標的", "分批成本制適用於訂單式生產型態", "分步成本制適用於連續性生產型態"], "ans": 1, "exp": "分批成本制以<b>批次或訂單</b>為成本標的；以生產部門為標的的是分步成本制，所以 B 錯。"}, {"n": 339, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，企業使用資本支出決策分析中通常有考慮貨幣時間價值的經濟評估方法有", "opts": ["12", "34", "24", "14"], "ans": 1, "exp": "考慮貨幣時間價值的方法：<b>內部報酬率法、淨現值法</b> → 34。會計報酬率法與還本期間法不考慮。", "items": ["(1) 會計報酬率法", "(2) 還本期間法", "(3) 內部報酬率法", "(4) 淨現值法"]}, {"n": 340, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，作業成本制的模式中包含哪兩個構面", "opts": ["12", "23", "24", "13"], "ans": 3, "exp": "ABC 的兩個構面：成本分派構面、流程構面 → 13。", "items": ["(1) 成本分派構面", "(2) 通路構面", "(3) 流程構面", "(4) 費用構面"]}, {"n": 341, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，請問品質成本通常以何者來衡量", "opts": ["123", "134", "124", "1234"], "ans": 3, "exp": "品質成本 ＝ 預防成本 ＋ 評鑑成本 ＋ 內部失敗成本 ＋ 外部失敗成本 → 1234。", "items": ["(1) 預防成本", "(2) 評鑑成本", "(3) 內部失敗成本", "(4) 外部失敗成本"]}, {"n": 342, "ch": "第八章 成本控制模組", "stem": "成本控制(CO)模組是以內部管理會計的觀點來提供財務資訊，請問下列哪一個選項是在管理會計技術中屬於可以提供例行性作業之規劃與控制資訊的方法", "opts": ["123", "134", "124", "1234"], "ans": 0, "exp": "例行性作業的規劃與控制：績效衡量、責任會計、標準成本制 → 123。分批成本制屬於產品成本計算。", "items": ["(1) 績效衡量", "(2) 責任會計", "(3) 標準成本制", "(4) 分批成本制"]}, {"n": 343, "ch": "第八章 成本控制模組", "stem": "在管理會計技術中，下列何者不符合對內部訂單(Internal Orders)會計的描述", "opts": ["內部訂單是用以代表組織中的事件、專案或工作", "內部訂單通常比成本中心有著較短的壽命", "內部訂單可作為與成本中心無關之事件的分析", "內部訂單會計就是成本中心會計"], "ans": 3, "exp": "內部訂單會計（以事件或專案為標的）與成本中心會計（以部門為標的）是<b>不同的副模組</b>，所以 D 錯。"}, {"n": 344, "ch": "第八章 成本控制模組", "stem": "下列有關管理會計技術之敘述，何者是不正確的", "opts": ["變動成本法(Variable Costing)僅將變動生產成本視為產品成本", "作業成本制(Activity-Based Costing)可用於計算作業成本與各種成本標的之成本，但對作業改善並無助益", "平衡計分卡(Balanced Scorecard)同時強調財務性及非財務性之績效衡量指標", "資本支出決策(Capital Budgeting)通常牽涉的時間較長，故應考慮貨幣的時間價值"], "ans": 1, "exp": "ABC 除了計算成本，也能透過流程構面<b>協助作業改善</b>，所以 B 說「無助益」是錯的。"}, {"n": 345, "ch": "第八章 成本控制模組", "stem": "當領料或發料執行時，就會計帳處理而言，投入生產的直接材料可直接追溯於所生產之產品，而計入在製品帳戶，做成分錄入帳，借記：在製品，貸記：材料，下列敘述何者正確", "opts": ["借記：在製品，此為成本帳戶，貸記：材料，此為普通帳戶", "借記：在製品，此為成本帳戶，貸記：材料，此為成本帳戶", "借記：在製品，此為普通帳戶，貸記：材料，此為普通帳戶", "借記：在製品，此為普通帳戶，貸記：材料，此為成本帳戶"], "ans": 1, "exp": "在製品與材料<b>都是成本帳戶</b>。"}, {"n": 346, "ch": "第九章 人力資源模組", "stem": "ERP 系統強調模組之間的關聯性，以模組間的密切結合來提高效率，但下列那一個 ERP 模組，在實務上比較不可能與人力資源模組產生資料上的互動 (Data Transaction)", "opts": ["財會模組", "生產管理", "物料管理", "專案管理"], "ans": 2, "exp": "物料管理與 HR 模組的資料互動最少；財會（薪資）、生產（人力與工時）、專案（人員）都與 HR 有互動。"}, {"n": 347, "ch": "第九章 人力資源模組", "stem": "人力資源再造/改善的結果將會對組織內的部門經理人及員工產生哪幾項好處", "opts": ["1234", "2345", "1235", "12345"], "ans": 1, "exp": "HR 再造的好處：回應時間縮短、更符合個人需求、更人性化、服務品質有保證 → 2345。(1) 應該是「不受」地域限制。", "items": ["(1) 將受地域的限制", "(2) 回應的時間縮短", "(3) 更符合個人化的需求", "(4) 更將人性化", "(5) 人力資源服務的品質將獲得保證"]}, {"n": 348, "ch": "第九章 人力資源模組", "stem": "人力資源流程再造對傳統訓練作業流程轉化成訓練資訊系統，以下哪些系統為該訓練系統所應具之功能", "opts": ["123", "234", "134", "1234"], "ans": 3, "exp": "訓練資訊系統應該具備需求評估、訓練管理、績效考核與技能強化、電子佈告與溝通 → 1234。", "items": ["(1) 需求評估", "(2) 訓練管理", "(3) 績效考核技能強化", "(4) 電子佈告與溝通"]}, {"n": 349, "ch": "第九章 人力資源模組", "stem": "流程取向的人力資源再造，傾向將人力資源作業朝向", "opts": ["分層稽控", "軟體複雜化的設計", "單一業務窗口", "集權式管理"], "ans": 2, "exp": "流程取向的 HR 再造傾向<b>單一業務窗口</b>。分層稽控與集權管理是功能取向。"}, {"n": 350, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，請問何者是企業為因應內外在環境變化所進行的各種監測與調控的過程", "opts": ["組織發展", "組織及職務設計", "績效管理", "招募與甄選"], "ans": 0, "exp": "因應內外環境變化而進行監測與調控的過程 → <b>組織發展</b>。"}, {"n": 351, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，大部分企業會採取何種角度進行小規模或小幅度人力資源制度面或作業流程的修改", "opts": ["企業功能改善", "企業功能整合", "企業流程改善", "企業流程整合"], "ans": 2, "exp": "小規模、小幅度修改制度或流程 → <b>企業流程改善</b>。"}, {"n": 352, "ch": "第九章 人力資源模組", "stem": "請問完全自客戶服務的角度來思考人力資源管理作業流程，盡量簡化作業的內容，以達到客戶服務的最佳績效的是何種取向的人力資源再造", "opts": ["流程取向", "功能取向", "個人化取向", "客製化取向"], "ans": 0, "exp": "完全從客戶服務的角度出發、簡化流程 → <b>流程取向</b>。"}, {"n": 353, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，請問減少毫無或低附加價值的產品或服務為何種流程再造之效益", "opts": ["成本降低效益", "生產力提升的效益", "人力資源系統使用效益", "其他節餘效益"], "ans": 1, "exp": "減少沒有或低附加價值的產出 → <b>生產力提升效益</b>。"}, {"n": 354, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，請問減少由於資料輸入錯誤或延遲而導致生產力降低及重做的可能性為何種流程再造之效益", "opts": ["人力資源系統使用效益", "生產力提升的效益", "成本降低效益", "其他節餘效益"], "ans": 0, "exp": "減少資料輸入錯誤或延遲 → <b>人力資源系統使用效益</b>。"}, {"n": 355, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，請問何者是透過較正規化的教育、工作經驗與師徒關係，來幫助員工對未來進行生涯規劃的制度", "opts": ["訓練發展", "員工發展", "員工諮商", "員工健康"], "ans": 1, "exp": "透過教育、工作經驗、師徒關係協助員工做生涯規劃 → <b>員工發展</b>。"}, {"n": 356, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，企業依據員工個人之技能、知識、能力、興趣、人格等特質，適才適所的配置在適當職位上，稱之為", "opts": ["考勤管理", "績效管理", "任用管理", "員工發展管理"], "ans": 2, "exp": "依員工特質適才適所地配置職位 → <b>任用管理</b>。"}, {"n": 357, "ch": "第九章 人力資源模組", "stem": "在 HR 作業流程再造及 e 化管理特別重視員工自助服務，下列那一項不是員工自助服務的目的", "opts": ["流程改善", "確保資料品質", "降低成本(Cost)", "員工賦能"], "ans": 2, "exp": "官方答案：員工自助服務的目的是流程改善、確保資料品質、員工賦能；<b>降低成本</b>不被列為主要目的。"}, {"n": 358, "ch": "第九章 人力資源模組", "stem": "下列有關流程取向以及功能取向的人力資源再造/改善之敘述何者錯誤", "opts": ["流程取向不注重員工賦能與單一業務窗口", "功能取向注重集權管理與分層稽控", "功能取向無法促成組織 HR 管理之績效", "流程取向可提昇組織 HR 管理之績效"], "ans": 0, "exp": "流程取向<b>重視</b>員工賦能與單一業務窗口，所以 A 錯。"}, {"n": 359, "ch": "第九章 人力資源模組", "stem": "對於員工自助服務在管理上意義之相關觀念，下列那一選項有誤", "opts": ["就是員工賦能(Employee Empowerment)", "讓員工擁自主權及享有掌控感(Sense of Control)", "可以讓組織分權(Decentralized)概念落實", "以上觀念皆錯"], "ans": 3, "exp": "A、B、C 都是員工自助服務的正確意義，所以 D「以上觀念皆錯」是錯的。"}, {"n": 360, "ch": "第九章 人力資源模組", "stem": "下列有關人力資源再造的意義何者正確", "opts": ["人力資源服務完全由人力資源管理部門一肩扛", "人力資源服務由部門主管及員工以自助服務方式來完成", "分權式的服務模式轉換成以集中方式進行", "自動化與外包的結果將造成人力資源人事的增加"], "ans": 1, "exp": "HR 再造後，服務改由部門主管與員工以<b>自助服務</b>完成，不再全部由 HR 部門負責。"}, {"n": 361, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，人力資源再造/改善是下列何種取向", "opts": ["功能取向", "流程取向", "組織取向", "性質取向"], "ans": 1, "exp": "人力資源再造／改善是<b>流程取向</b>。"}, {"n": 362, "ch": "第九章 人力資源模組", "stem": "請問何者是屬於人力資源管理各項功能的先遣功能，此功能會與後續相關人力資源管理功能有高度關聯性", "opts": ["組織發展", "組織及職務設計", "績效管理", "招募與甄選"], "ans": 3, "exp": "<b>招募與甄選</b>是 HR 各項功能的先遣功能，後續的任用、訓練、績效都從這裡開始。"}, {"n": 363, "ch": "第九章 人力資源模組", "stem": "下列那一項不是人力資源模組中經理人端自助服務(Manager Self-Service)的功能", "opts": ["薪資決策", "福利服務", "考勤管理", "績效管理"], "ans": 1, "exp": "福利服務屬於<b>員工端</b>自助服務 (ESS)；經理人端 (MSS) 負責薪資決策、考勤、績效等管理功能。"}, {"n": 364, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，員工協助所能提供的功能不包含下列哪一選項", "opts": ["職涯發展", "壓力管理", "員工諮商", "員工健康"], "ans": 0, "exp": "員工協助方案 (EAP) 包括壓力管理、員工諮商、員工健康；職涯發展屬於員工發展。"}, {"n": 365, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，請問那一個作業非任用管理的功能", "opts": ["績效調薪", "招募人才", "僱用安置", "離職管理"], "ans": 0, "exp": "任用管理包括招募、僱用安置、離職管理；績效調薪屬於薪酬或績效管理。"}, {"n": 366, "ch": "第九章 人力資源模組", "stem": "有關人力資源再造/改善的 12 步驟中，通常會以腦力激盪法搭配何種技術計算來檢視流程中每一工作事件，並尋找替代方案", "opts": ["ABC 分析法", "工作中心(Work Center)技術", "低階編碼法(LLC)", "價值分析"], "ans": 3, "exp": "HR 再造 12 步驟中，用腦力激盪搭配<b>價值分析</b>檢視每個工作事件。"}, {"n": 367, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，會對員工進行員工訓練，讓員工學習與工作相關的知識、技能與必要的行為，而對員工進行訓練的目的最不可能是那一項", "opts": ["將學習的成果運用到日常的工作上", "增加員工目前的工作技能以擴增其工作職責", "增加升遷、橫向調動與轉任的機會", "以訓練的成果不良做為裁員或減薪的理由"], "ans": 3, "exp": "訓練的目的是提升能力與發展機會，不會拿訓練結果作為裁員或減薪的理由。"}, {"n": 368, "ch": "第九章 人力資源模組", "stem": "請問流程取向的人力資源再造是傾向將人力資源朝向何種業務處理方向來設計", "opts": ["增加業務窗口", "員工賦能", "工作簡單化", "集權管理"], "ans": 1, "exp": "流程取向朝向<b>員工賦能</b>的業務處理方向設計。"}, {"n": 369, "ch": "第九章 人力資源模組", "stem": "請問以下有關人力資源再造中，功能再造與流程再造的描述何者正確", "opts": ["234", "12", "1234", "134"], "ans": 0, "exp": "官方答案 234：功能取向導向工作簡單化 (2)，流程取向能減少 HR 部門業務量 (3) 並提升績效 (4)。(1) 錯：功能取向分工細，反而會增加協調成本。", "items": ["(1) 功能取向的人力資源再造可以減少企業內部業務協調的成本", "(2) 功能取向的人力資源再造會導致人力資源業務以工作簡單化的方式來處理", "(3) 流程取向的人力資源再造可以節省企業人力資源部門的業務量", "(4) 流程取向的人力資源再造可以提升組織人力資源管理之績效"]}, {"n": 370, "ch": "第九章 人力資源模組", "stem": "下列有關人力資源管理基本功能的敘述何者正確", "opts": ["123", "13", "134", "1234"], "ans": 2, "exp": "(1)(3)(4) 正確。(2) 錯：依員工優劣勢做安置與移動是<b>任用管理</b>的目的，不是招募與甄選。", "items": ["(1) 組織及職務設計的目的是協助企業訂定合理的組織架構與人力需求，以強化企業的競爭優勢", "(2) 招募與甄選的目的在於使企業能依員工的優劣勢，使人力資源有效的安置與移動", "(3) 職能管理的目的在於針對員工個人所需知識、技術與態度等，進行規劃、設計、評鑑與回饋，以改善員工與組織之績效", "(4) 目標管理的目的在於針對組織、部門與個人工作績效進行目標追蹤與檢核"]}, {"n": 371, "ch": "第九章 人力資源模組", "stem": "下列有關人力資源再造的定義何者為非", "opts": ["123", "24", "234", "23"], "ans": 3, "exp": "(2)(3) 把定義對調了：<b>巨觀</b>再造是檢視工作要維持、重新設計或外包；<b>微觀</b>再造才是結合人與資訊科技重新設計流程。", "items": ["(1) 一般來說，再造可分為巨觀再造與微觀再造", "(2)微觀再造指的是檢視工作是否必須維持、重新設計或以外包方式完成", "(3) 巨觀再造指的是結合工作者之能力與資訊科技，來重新設計工作流程", "(4) 根據 Michael Hammer，再造的定義為運用資訊科技之技術，徹底對現存的企業流程重新思考及再設計，以求對目前的績效產生巨幅改進"]}, {"n": 372, "ch": "第九章 人力資源模組", "stem": "對於從事人力資源專業工作者而言，人力資源再造有著何種意涵", "opts": ["12356", "123456", "1256", "23456"], "ans": 0, "exp": "HR 再造的意涵：自動化、外包、整合、人事縮減、重新定義專業角色 → 12356。再造是走向分權，不是集權。", "items": ["(1) 自動化", "(2) 外包", "(3) 整合", "(4) 集權", "(5) 人事縮減", "(6) 重新定義專業角色及職能"]}, {"n": 373, "ch": "第九章 人力資源模組", "stem": "ERP 系統中人力資源管理(HRM)模組通常會涵蓋", "opts": ["123", "234", "134", "124"], "ans": 0, "exp": "ERP HRM 模組涵蓋組織職務設計、招募甄選、任用、考勤、績效、訓練發展 → 123。", "items": ["(1) 組織及職務設計、招募與甄選", "(2) 任用管理、考勤管理", "(3) 績效管理、訓練與發展", "(4) 職位晉升規劃、能力與職涯分析"]}, {"n": 374, "ch": "第九章 人力資源模組", "stem": "在人力資源管理中，流程再造通常可經由降低成本與提高生產力以增加組織的效益，以下何者為正面效益", "opts": ["124", "123", "234", "134"], "ans": 0, "exp": "正面效益：生產力提升、外包降低成本、HR 系統使用效益 → 124。", "items": ["(1) 生產力提升", "(2) 外包所產生的成本降低效益", "(3) 提高資金流動效益", "(4) 人力資源資訊系統使用的效益"]}, {"n": 375, "ch": "第九章 人力資源模組", "stem": "對於人力資源模組的特性哪些是正確", "opts": ["1234", "123", "234", "2345"], "ans": 1, "exp": "HR 模組受各國法令影響、客製化需求多、各公司流程落差大 → 123。HR 模組其實<b>比較獨立</b>，與其他模組的互動較少。", "items": ["(1) 會受到不同國家法令的要求與限制之影響", "(2) 客製化的需求較多", "(3) 每家公司的人資管理功能及作業流程的設計落差大", "(4) 模組較不獨立", "(5) 與其他模組資料互動多"]}, {"n": 376, "ch": "第九章 人力資源模組", "stem": "關於傳統人力資源模組中(HR)的招募流程之敘述下列何者錯誤", "opts": ["當職缺需求成立時，會啟動提出職缺需求資料的功能", "當招募活動結案確定時，接著會啟動產生錄取名單功能", "當面試確認後，如果組織內部無適合人選，則啟動組織對外公佈職缺資料功能，接著進入應徵者提出申請狀態", "當面試確認後，如果組織內部有適合人選，則啟動產生錄取名單功能，接著招募活動結案"], "ans": 1, "exp": "應該是先「產生錄取名單」，再「招募活動結案」，B 把順序弄反了。"}, {"n": 377, "ch": "第九章 人力資源模組", "stem": "關於結合電子表單及公告、工作流程軟體等新技術後，改造後的人力資源模組中(HR)的訓練流程之敘述下列何者錯誤", "opts": ["當線上訓練需求調查確認後，啟動線上產生訓練需求資料", "當主管評核訓練成效確定後，接著才會進入心得報告繳交狀態", "當線上訓練資料彙整歸檔功能執行後，進入訓練經費核銷結案狀態", "當訓練計劃線上批示核可後，會進入線上公佈課程資訊狀態"], "ans": 1, "exp": "應該是先繳交心得報告，再由主管評核訓練成效，B 把順序弄反了。"}, {"n": 378, "ch": "第十章 系統評選", "stem": "一般而言就 ERP 系統功能面來看，其彈性主要可來自於", "opts": ["功能模組選擇", "系統參數設定", "客製化程式", "以上皆可，視情況在其中作選擇"], "ans": 3, "exp": "ERP 的功能彈性可以來自模組選擇、參數設定、客製化程式，要視情況選擇 → <b>以上皆可</b>。"}, {"n": 379, "ch": "第十章 系統評選", "stem": "系統導入成本中占總成本比例最高的通常是", "opts": ["軟體費用", "顧問費用", "硬體費用", "訓練費用"], "ans": 1, "exp": "導入成本中比例最高的通常是<b>顧問費用</b>。"}, {"n": 380, "ch": "第十章 系統評選", "stem": "下列選項中哪一個不是善用 ERP 系統內建的最佳化實務範例的好處", "opts": ["降低導入成本", "避免客製化", "避免系統升級時的困擾", "可以免費獲得許多 ERP 客製程式撰寫時間"], "ans": 3, "exp": "使用最佳實務範例可以降低導入成本、避免客製化、減少升級困擾；它並不會「免費提供客製程式的撰寫時間」。"}, {"n": 381, "ch": "第十章 系統評選", "stem": "對於 ERP 系統的獲得成本中，其變動最大、較不易掌握的部份是那一個", "opts": ["系統軟體本", "硬體成本", "建置顧問費用", "其他無形成本"], "ans": 3, "exp": "變動最大、最難掌握的是<b>其他無形成本</b>（例如流程變革、人員抗拒、生產力下降）。"}, {"n": 382, "ch": "第十章 系統評選", "stem": "從系統功能完整性的角度來看，一個 ERP 產品至少應該包含企業的", "opts": ["八大循環", "產銷循環", "融資循環", "品管循環"], "ans": 1, "exp": "ERP 至少要涵蓋企業的<b>產銷循環</b>（銷售、生產、採購、庫存）。"}, {"n": 383, "ch": "第十一章 系統導入", "stem": "在 ERP 系統導入時，對專案經理人所應具備的條件，下列何者為非", "opts": ["穩定的情緒", "程式撰寫能力要強", "正面的人際關係", "習慣於沒有掌聲的環境"], "ans": 1, "exp": "專案經理需要的是溝通、領導、情緒穩定等管理能力，不需要很強的程式撰寫能力。"}, {"n": 384, "ch": "第十一章 系統導入", "stem": "下列對 ERP 系統導入的描述，何者為非", "opts": ["ERP 系統導入的績效通常都可立即顯現", "ERP 系統導入可能導致流程調整", "ERP 系統導入需要用專案管理的角度來看待", "變革管理也是 ERP 系統導入時應注意的一環"], "ans": 0, "exp": "ERP 導入的效益通常要一段時間後才會顯現，不會立即出現，所以 A 錯。"}, {"n": 385, "ch": "第十一章 系統導入", "stem": "ERP 系統導入過程中的資料轉檔工作是指", "opts": ["將存在舊系統中的企業營運資料轉入 ERP 系統", "將企業既有的組織架構建置到 ERP 中以便授權", "舊有的物料編號與新的物料編號應對", "建置資料倉儲的綱要"], "ans": 0, "exp": "資料轉檔 ＝ 把舊系統中的營運資料<b>轉入 ERP</b>。"}, {"n": 386, "ch": "第十一章 系統導入", "stem": "企業對 ERP 導入專案的態度會依照企業對 ERP 系統的期望而有所不同，對於 Business 性質的ERP 導入專案態度而言，下列敘述何者為非", "opts": ["須訂定欲達成的營運目標", "以最節省人力與物力建置完成專案為目標", "訂定合適的導入策略", "注重企業流程調整"], "ans": 1, "exp": "Business 性質的專案重視營運目標與流程調整，而不是「用最少的人力物力完成」（那是 IT 性質專案的心態），所以 B 錯。"}, {"n": 387, "ch": "第十一章 系統導入", "stem": "執行 ERP 系統測試中，對使用單位而言，最重要的是何種測試", "opts": ["安裝測試", "單元測試", "整合測試", "外掛測試"], "ans": 2, "exp": "對使用單位最重要的是<b>整合測試</b>：驗證跨模組、端到端的流程能不能正確運作。"}, {"n": 388, "ch": "第十二章 ERP 系統導入的兩個案例", "stem": "請問何者指的是 ERP 系統流程與所支援的企業流程之間一致的程度", "opts": ["外掛(Add-On)", "適配(Fit)", "客製化", "個人化"], "ans": 1, "exp": "ERP 流程與企業流程一致的程度 → <b>適配 (Fit)</b>；不一致就叫 Misfit。"}, {"n": 389, "ch": "第十二章 ERP 系統導入的兩個案例", "stem": "下列何者不是旺宏電子個案中導入 ERP 所產生的主要效益", "opts": ["降低處理客戶抱怨的週期時間", "縮短整合訂單、庫存、產能各項資訊以完成生產規劃的時間", "減少客戶下單到確認可以接單的時間", "提升接單到交貨的總數量及平均時間"], "ans": 3, "exp": "旺宏的效益是<b>縮短</b>各種週期時間；D「提升平均時間」是反的，時間增加不是效益。"}, {"n": 390, "ch": "第十二章 ERP 系統導入的兩個案例", "stem": "在 ERP 系統導入過程中，往往會碰上 ERP 系統流程和組織流程二者之間有著不適合(Misfit)的狀況，而用以解決系統流程和組織流程間差異的做法不包括", "opts": ["軟體客製化", "開發外掛程式", "企業流程再造", "擴增資料庫硬碟空間"], "ans": 3, "exp": "解決 Misfit 的方法：軟體客製化、開發外掛、企業流程再造。擴增硬碟空間跟流程差異無關。"}, {"n": 391, "ch": "第十二章 ERP 系統導入的兩個案例", "stem": "在 ERP 導入的議題中，在導入後的階段是希望實現 ERP 系統的組織績效，而下列哪一選項不是實現 ERP 系統的組織績效", "opts": ["提升經營效率", "降低營運成本", "提高客戶滿意", "外籍員工數量增加"], "ans": 3, "exp": "組織績效包括效率、成本、客戶滿意度；外籍員工數量增加不是績效指標。"}, {"n": 392, "ch": "第十二章 ERP 系統導入的兩個案例", "stem": "從實際的 ERP 導入案例看來，BPR 和 ERP 的導入先後的最佳次序為何", "opts": ["BPR 在先", "BPR 在後", "二者同時", "只要導入的順序有符合企業的規劃就是最佳順序"], "ans": 3, "exp": "BPR 和 ERP 沒有絕對的先後，<b>只要符合企業的規劃</b>就是最佳順序。"}, {"n": 393, "ch": "第十三章 從 ERP 到企業 E 化", "stem": "下列何者為資料倉儲(Data Warehouse)之特性", "opts": ["分散式", "揮發性", "主題導向(Subject Oriented)", "時間不變性"], "ans": 2, "exp": "資料倉儲的特性：<b>主題導向</b>、整合性、時間變異性（時間相關）、非揮發性。B「揮發性」與 D「時間不變性」都是相反的描述。"}, {"n": 394, "ch": "第十三章 從 ERP 到企業 E 化", "stem": "下列何者為 ERP 系統的縱向延伸", "opts": ["顧客關係管理系統", "決策支援系統(DSS)", "供應鏈管理系統", "企業入口網站"], "ans": 1, "exp": "<b>縱向延伸</b>是往管理決策層延伸（DSS、EIS）；CRM、SCM 是往企業外部的<b>橫向</b>延伸。"}, {"n": 395, "ch": "第十三章 從 ERP 到企業 E 化", "stem": "下列何者最能描寫供應鏈管理(SCM)系統", "opts": ["線上分析處理", "非結構化資訊處理", "整合的生產規劃及排程", "提供個人化服務"], "ans": 2, "exp": "SCM 的核心是<b>整合的生產規劃與排程</b>（APS），跨企業協調供需。"}, {"n": 396, "ch": "第十三章 從 ERP 到企業 E 化", "stem": "下列何者是各種延伸 ERP 功能之基礎", "opts": ["資料倉儲(DW)", "決策支援系統", "知識管理", "全球資訊網(WWW)"], "ans": 0, "exp": "<b>資料倉儲 (DW)</b> 是 DSS、BI、CRM 分析等延伸功能的資料基礎。"}, {"n": 397, "ch": "第十三章 從 ERP 到企業 E 化", "stem": "請問為資料倉儲(Data Warehouse)複製的一部分之子集合的資料組合稱為", "opts": ["資料庫", "資料源", "資料市場", "資料挖掘"], "ans": 2, "exp": "資料倉儲的子集合（通常針對單一部門或主題） → <b>資料市場 (Data Mart)</b>。"}, {"n": 398, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列何者是雲端運算具有的基本特性", "opts": ["1234", "15", "25", "35"], "ans": 0, "exp": "NIST 定義的雲端特性：隨選自助、無所不在的網路存取、資源共用、快速彈性、<b>可測量</b>的服務 → 1234。(5)「不可測量」是錯的。", "items": ["(1) 隨選即用的自助服務(Self-Services)", "(2) 無所不在的網路存取(Ubiquitous Network Access)", "(3) 資源共用(Resource Pooling)", "(4) 快速彈性(Rapid Elasticity)", "(5) 不可測量的服務(Un-measured Services)"]}, {"n": 399, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列何者是雲端運算的服務模型", "opts": ["135", "234", "134", "345"], "ans": 2, "exp": "雲端服務模型：<b>IaaS、PaaS、SaaS</b> → 134。", "items": ["(1) 基礎設施即服務(Infrastructure as a Service, IaaS)", "(2) 資料即服務(Data as a Service, DaaS)", "(3) 平台即服務(Platform as a Service, PaaS)", "(4) 軟體即服務(Software as a Service, SaaS)", "(5) 硬體即服務 (Hardware as a Service, HaaS)"]}, {"n": 400, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列何者是雲端運算的部署模型", "opts": ["1234", "1235", "1245", "2345"], "ans": 0, "exp": "雲端部署模型：私有雲、社群雲、公有雲、混合雲 → 1234。沒有「公司雲」。", "items": ["(1) 私有雲 (Private cloud)", "(2) 社群雲 (Community cloud)", "(3) 公有雲 (Public cloud)", "(4) 混合雲 (Hybrid cloud)", "(5) 公司雲 (Company Cloud)"]}, {"n": 401, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "整體擁有成本 (Total Cost of Ownership, TCO)，包含下列哪幾項", "opts": ["13", "24", "14", "23"], "ans": 0, "exp": "TCO ＝ <b>整體獲得成本 (TCA) ＋ 營運成本</b> → 13。", "items": ["(1) 整體獲得成本(Total Cost of Acquisition, TCA)", "(2) 機會成本(Opportunity Cost)", "(3) 營運成本 (Operating Cost)", "(4) 銷貨成本(Cost of Goods Sold)"]}, {"n": 402, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "企業要著手規劃一個雲端架構時，通常會考慮使用以下準則來評估，下列哪一個選項不是考量的評估準則", "opts": ["延展性(Scalability)", "租用型態", "可靠度(Reliability)以及整體擁有成本", "國際創新創業"], "ans": 3, "exp": "雲端架構的評估準則：延展性、租用型態、可靠度、TCO 等。「國際創新創業」不是評估準則。"}, {"n": 403, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "企業欲規劃良好的雲端架構，請選擇評估一個企業雲端架構可使用下列哪些準則", "opts": ["123457", "13456", "12345678", "12568"], "ans": 2, "exp": "八項都是評估準則：延展性、租用型態、可靠度、TCO、可攜性、資安隱私、轉換成本、風險 → 12345678。", "items": ["(1) 延展性", "(2) 租用型態", "(3) 可靠度", "(4) 整體擁有成本", "(5) 可攜性 (Portability)", "(6) 資訊安全及隱私", "(7) 轉換成本 (Switching Cost)", "(8) 風險"]}, {"n": 404, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "服務導向架構(Service-Oriented Architecture, SOA)中包含下列哪些角色", "opts": ["123", "124", "234", "1234"], "ans": 0, "exp": "SOA 的三個角色：<b>服務要求者、服務登錄、服務提供者</b> → 123。", "items": ["(1) 服務要求者", "(2)服務登錄", "(3) 服務提供者", "(4) 服務代理者"]}, {"n": 405, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列何種核心技術最能描述雲端運算", "opts": ["12", "24", "124", "1234"], "ans": 2, "exp": "雲端運算的核心技術：伺服器虛擬化、SaaS、SOA → 124。", "items": ["(1) 伺服器虛擬化(Server Virtualization)", "(2) 軟體即服務(Software as a Service)", "(3) 網格運算(Grid Computing)", "(4) 服務導向架構(Service-Oriented Architecture)"]}, {"n": 406, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列何者是伺服器虛擬化(Server Virtualization)的效益", "opts": ["124", "234", "134", "1234"], "ans": 3, "exp": "伺服器虛擬化的效益：提高利用率、減少回應時間、降低成本、提升建置效率 → 1234。", "items": ["(1) 提高伺服器的有效利用率", "(2) 減少回應時間", "(3) 降低伺服器成本", "(4) 提升新系統的建置效率"]}, {"n": 407, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列何者非軟體即服務(Software as a Service)的效益", "opts": ["節省軟體購置成本", "節省軟體使用成本", "節省軟體與資料之轉換成本(Switching Cost)", "若提供軟體租賃方式，只需視使用多少來支付使用費"], "ans": 2, "exp": "SaaS 無法節省<b>轉換成本</b>；資料被綁在供應商平台上，換服務商時反而可能有轉換成本。"}, {"n": 408, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列有關雲端運算的敘述何者正確", "opts": ["在網際網路應用中，將共用軟體元件製作成網路服務(Web Service)，即是軟體即服務(Software as a Service, SaaS)", "將伺服器虛擬化即是雲端運算", "雲端運算融合伺服器虛擬化(Server Virtualization)、軟體即服務(Software as a Service)及服務導向架構(Service-Oriented Architecture)等核心技術", "分散式儲存即是雲端運算的一種應用"], "ans": 2, "exp": "雲端運算<b>融合</b>了伺服器虛擬化、SaaS、SOA 等技術；單獨一項技術並不等於雲端運算。"}, {"n": 409, "ch": "第十四章 電腦網路與 ERP 系統", "stem": "下列有關評估雲端架構的敘述何者正確", "opts": ["1245", "2345", "1234", "12345"], "ans": 2, "exp": "(1)～(4) 正確 → 1234。(5) 錯：整體擁有成本 ＝ 整體獲得成本 ＋ <b>營運成本</b>，不是折舊成本。", "items": ["(1) 萬一雲端系統損害事件或災難發生，如同將雞蛋(應用與資 let prefs    = Object.assign({scope:"ch:0", random:false, quizScope:"all", quizN:50, pos:{}}, LS.get(KEY+"prefs",{}));
const save = () => { LS.set(KEY+"wrong",[...wrongSet]); LS.set(KEY+"hist",history); LS.set(KEY+"best",best); LS.set(KEY+"prefs",prefs); };

function record(key, correct){
  const h = history[key] || {c:0,w:0};
  correct ? h.c++ : h.w++;
  h.last = correct ? 1 : 0;
  history[key] = h;
  if(!correct) wrongSet.add(key);
  save(); refreshStats();
}

/* ===================== 工具 ===================== */
const L = ["A","B","C","D"];
const $ = s => document.querySelector(s);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function refreshStats(){
  let c=0,w=0,done=0;
  for(const k in history){ if(!BY[k]) continue; c+=history[k].c; w+=history[k].w; done++; }
  $("#stDone").textContent = done + " / " + ALL.length;
  $("#stRate").textContent = (c+w) ? Math.round(c/(c+w)*100)+"%" : "–";
  $("#stWrong").textContent = wrongSet.size;
  $("#wrongBadge").textContent = wrongSet.size;
  $("#stBest").textContent = best==null ? "–" : best+" 分";
}
function srcChips(q, reveal){
  if(q.bank==="official") return `<span class="chip src-ok">官方題庫 #${q.no}</span>`;
  let h = "";
  if(reveal){ const s=SRC_LABEL[q.src]; h += `<span class="chip ${s[0]}">${s[1]}</span>`; }
  return h + `<span class="chip">課本 #${q.no}</span>`;
}
const itemsHTML = q => q.items ? `<ul class="items">${q.items.map(t=>`<li>${t}</li>`).join("")}</ul>` : "";
const expHTML = q => q.bank==="official" ? `<p>${q.exp}</p>` : q.exp;
