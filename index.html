function newSession(kind, o){
  o = o || {};
  let keys;
  if(kind==="wrong") keys = ALL.filter(q=>wrongSet.has(q.key)).map(q=>q.key);
  else if(kind==="quiz"){ keys = shuffle(scopeKeys(o.scope)); if(o.n && o.n<keys.length) keys = keys.slice(0,o.n); }
  else if(kind==="search") keys = [...o.keys];
  else keys = scopeKeys(prefs.scope);
  if(kind!=="quiz" && o.random) keys = shuffle(keys);
  let idx = 0;
  if(kind==="practice" && !o.random && o.resume){ idx = Math.min(prefs.pos[prefs.scope]||0, Math.max(0,keys.length-1)); }
  gridOpen = keys.length <= 80;
  return { kind, keys, idx, answers:{}, random:!!o.random, submitted:false, start:Date.now(), removed:{}, scope:o.scope, n:o.n, baseKeys:o.keys, term:o.term };
}

/* ===================== 關鍵字搜尋 ===================== */
// 去除 HTML 標籤、全形轉半形、不分大小寫
const norm = s => String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").normalize("NFKC").toLowerCase();
const parseTerms = s => [...new Set(norm(s).split(/[\s,，、]+/).filter(Boolean))];
let IDX = null;
function searchIndex(){
  if(IDX) return IDX;
  IDX = {};
  ALL.forEach(q=>{ IDX[q.key] = { t: norm(q.stem+" "+(q.items||[]).join(" ")+" "+q.opts.join(" ")), e: norm(q.exp) }; });
  return IDX;
}
// 每個關鍵字都要出現（AND）；withExp 時也比對解析
function matchQ(q, terms, withExp){
  const ix = searchIndex()[q.key];
  return terms.every(t => ix.t.includes(t) || (withExp && ix.e.includes(t)));
}
const onlyInExp = (q, terms) => !terms.every(t => searchIndex()[q.key].t.includes(t));
// 只在文字節點上加 <mark>，不會破壞原本的 HTML 標籤
function mkHL(terms){
  if(!terms.length) return s=>s;
  const re = new RegExp([...terms].sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"gi");
  return s => String(s).replace(/(<[^>]*>|&[#\w]+;)|([^<&]+)/g, (m,tag,txt) => tag ? tag : txt.replace(re,"<mark>$&</mark>"));
}

let srch = Object.assign({term:"", scope:"any", exp:false}, prefs.srch||{});
let srchPracticing = false;
const saveSrch = () => { prefs.srch = srch; save(); };
const KEYWORDS = ["MRP","BOM","ATP","MPS","物料需求","存貨","採購","生產","排程","顧客","會計","成本","財務","人力資源","品質","雲端","供應鏈","導入","CRM","SCM","BPR"];
let kwCounts = null;

function searchKeys(){
  const terms = parseTerms(srch.term);
  if(!terms.length) return {terms, keys:[]};
  const base = srch.scope==="any" ? ALL.map(q=>q.key) : scopeKeys(srch.scope);
  return {terms, keys: base.filter(k=>matchQ(BY[k], terms, srch.exp))};
}

    ? ESSAY.map((e,i)=>({e,i})).filter(({e})=>{ const t=norm(e.q+" "+e.a); return terms.every(w=>t.includes(w)); })
    : [];

    <div class="left"><span class="chip">找到 ${keys.length} 道選擇題${essays.length?`・${essays.length} 道問答題`:""}</span></div>
    ${keys.length?`<div class="left"><button class="btn primary" data-act="srchPractice">練習這 ${keys.length} 題</button></div>`:""}
  </div>`;
  const list = keys.map((k,i)=>{
    const q=BY[k], expOnly = srch.exp && onlyInExp(q, terms);
    return `<div class="review-item">
      <div class="qhead"><span class="qno">${i+1}.</span><span class="chips">${srcChips(q,true)}<button class="btn sm" data-sgo="${i}">練習這題 →</button></span></div>
      <div class="chlabel">${q.ch}</div>
      <p class="stem" style="font-size:1rem">${hl(q.stem)}</p>${q.items?`<ul class="items">${q.items.map(t=>`<li>${hl(t)}</li>`).join("")}</ul>`:""}
      ${q.opts.map((o,j)=>`<div class="optline">${L[j]}. ${hl(o)}</div>`).join("")}
      <details class="srch-ans" ${expOnly?"open":""}><summary>${expOnly?"答案與解析（關鍵字出現在解析中）":"看答案與解析"}</summary>

function startSearchPractice(i){
  const {keys} = searchKeys(); if(!keys.length) return;
  sessions.search = newSession("search", {keys, term:srch.term});
  sessions.search.idx = Math.max(0, Math.min(i, keys.length-1));

/* ===================== 單題渲染 ===================== */
function questionHTML(s){
  const key = s.keys[s.idx], q = BY[key];
  const picked = s.answers[key];
  const reveal = s.kind!=="quiz" ? picked!==undefined : s.submitted;
  const opts = q.opts.map((o,i)=>{
    let cls = "opt";
    if(reveal){ if(i===q.ans) cls+=" correct"; else if(i===picked) cls+=" wrong"; }
    else if(i===picked) cls+=" picked";
    const dis = (s.kind!=="quiz" && reveal) || s.submitted ? "disabled" : "";
    return `<button class="${cls}" data-pick="${i}" ${dis}><span class="key">${L[i]}</span><span>${o}</span></button>`;
  }).join("");
  let exp = "";
  if(reveal){
    const ok = picked===q.ans;
    const extra = (s.kind==="wrong" && ok && s.removed[key]) ? "　已從錯題本移除 ✓" : "";
    exp = `<div class="explain ${ok?"ok":"bad"}"><div class="verdict">${ok?"答對了！":"答錯了"}　正確答案：${L[q.ans]}${extra}</div>${expHTML(q)}</div>`;
  }
  const answeredN = s.keys.filter(k=>s.answers[k]!==undefined).length;
  const grid = s.keys.map((k,i)=>{
    let c="";
    const a=s.answers[k];
    if(a!==undefined){ if(s.kind!=="quiz" || s.submitted) c = a===BY[k].ans ? "ok":"bad"; else c="done"; }
    if(i===s.idx) c+=" cur";
    return `<button class="${c}" data-go="${i}">${i+1}</button>`;
  }).join("");
  return `
  <div class="qhead"><span class="qno">第 ${s.idx+1} / ${s.keys.length} 題</span><span class="chips">${srcChips(q, reveal)}</span></div>
  <div class="chlabel">${q.ch}</div>
  <p class="stem">${q.stem}</p>${itemsHTML(q)}
  <div class="opts">${opts}</div>${exp}
  <div class="navrow">
    <button class="btn" data-nav="-1" ${s.idx===0?"disabled":""}>← 上一題</button>
    ${s.kind==="quiz" && !s.submitted ? `<button class="btn primary" data-act="submit">交卷</button>` : ""}
    <button class="btn" data-nav="1" ${s.idx===s.keys.length-1?"disabled":""}>下一題 →</button>
  </div>
  <details class="navgrid" ${gridOpen?"open":""}><summary>題目導覽（已作答 ${answeredN} / ${s.keys.length}）</summary><div class="grid">${grid}</div></details>
  <div class="hint">鍵盤快捷鍵：A–D 或 1–4 選答，← → 切換題目</div>`;
}

function renderResult(s){
  const correct = s.keys.filter(k=>s.answers[k]===BY[k].ans).length;
  const score = Math.round(correct/s.keys.length*100);
  const secs = Math.round((s.end - s.start)/1000);
  const pass = score>=70;
  const items = s.keys.map((k,i)=>{
    const q=BY[k], a=s.answers[k], ok=a===q.ans;
    return `<div class="review-item" data-ok="${ok}">
      <div class="qhead"><span class="qno">${i+1}. ${ok?"✅":"❌"}</span><span class="chips">${srcChips(q,true)}</span></div>
      <div class="chlabel">${q.ch}</div>
      <p class="stem" style="font-size:1rem">${q.stem}</p>${itemsHTML(q)}
      <div class="ans-line">你的答案：<span class="${ok?"c":"w"}">${a===undefined?"未作答":L[a]+". "+q.opts[a]}</span></div>
      ${ok?"":`<div class="ans-line">正確答案：<span class="c">${L[q.ans]}. ${q.opts[q.ans]}</span></div>`}
      <div class="explain ${ok?"ok":"bad"}">${expHTML(q)}</div>
    </div>`;
  }).join("");
  $("#view").innerHTML = `
  <div class="card" style="margin-bottom:14px">
    <div class="result-top">
      <div class="score">${score}<small> / 100</small></div>
      <div>
        <span class="pass ${pass?"y":"n"}">${pass?"及格":"未及格"}</span>
        <div style="color:var(--muted);font-size:.9rem;margin-top:4px">${esc(scopeName(s.scope))}・答對 ${correct} / ${s.keys.length} 題・用時 ${Math.floor(secs/60)} 分 ${secs%60} 秒</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
      <button class="btn primary" data-act="retryQuiz">同範圍再測一次</button>
      <button class="btn" data-act="newQuiz">更換範圍</button>
      <button class="btn" data-act="toWrong">練習錯題本</button>
      <label class="toggle"><input type="checkbox" id="onlyWrong"> 只顯示答錯的題目</label>
    </div>
  </div>
  <div class="card" id="reviewList">${items}</div>`;
}

/* ===================== 計時 ===================== */
let timerId=null;
function tickTimer(){
  clearInterval(timerId);
  const upd=()=>{ const s=sessions.quiz, el=$("#timer"); if(!s||s.submitted||!el){clearInterval(timerId);return;}
    const t=Math.floor((Date.now()-s.start)/1000); el.textContent=`⏱ ${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; };
  upd(); timerId=setInterval(upd,1000);
}

/* ===================== 路由與事件 ===================== */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  if(tab==="practice") renderPractice("practice");
  else if(tab==="wrong") renderPractice("wrong");
  else if(tab==="quiz") renderQuiz();
  else if(tab==="progress") renderProgress();
  else if(tab==="essay") renderEssay();
  else if(tab==="search") renderSearch();
  else renderAll();
}
const curSession = () => tab==="practice"?sessions.practice : tab==="wrong"?sessions.wrong : tab==="quiz"?sessions.quiz : (tab==="search"&&srchPracticing)?sessions.search : null;

function pick(i){
  const s = curSession(); if(!s || s.submitted || !s.keys.length) return;
  const key = s.keys[s.idx], q = BY[key];
  if(s.kind!=="quiz"){
    if(s.answers[key]!==undefined) return;
    s.answers[key]=i;
    const ok = i===q.ans;
    record(key, ok);
    if(s.kind==="wrong" && ok){ wrongSet.delete(key); s.removed[key]=true; save(); refreshStats(); }
  } else s.answers[key]=i;
  render();
}
function go(n){
  const s=curSession(); if(!s) return;
  s.idx=Math.max(0,Math.min(s.keys.length-1,n));
  if(s.kind==="practice" && !s.random){ prefs.pos[prefs.scope]=s.idx; save(); }
  render();
  const c=$("#qcard"); if(c && c.getBoundingClientRect().top<0) c.scrollIntoView({block:"start"});
}
function startPracticeScope(sc){
  prefs.scope=sc; save();
  sessions.practice=newSession("practice",{random:prefs.random, resume:true});
  tab="practice"; render(); window.scrollTo({top:0});
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  tab=b.dataset.tab;
  if(tab==="wrong") sessions.wrong = newSession("wrong");
  if(tab==="search") srchPracticing = false;
  render(); window.scrollTo({top:0});
});

document.getElementById("view").addEventListener("click",e=>{
  const sc=e.target.closest("[data-scope]");
  if(sc){ e.preventDefault(); return startPracticeScope(sc.dataset.scope); }
  const kw=e.target.closest("[data-kw]");
  if(kw){ srch.term=kw.dataset.kw; saveSrch(); $("#srchInput").value=srch.term; renderSearchResults(); return; }
  const t=e.target.closest("[data-pick],[data-nav],[data-go],[data-act],[data-sgo]"); if(!t) return;
  if(t.dataset.sgo!==undefined) return startSearchPractice(+t.dataset.sgo);
  if(t.dataset.pick!==undefined) return pick(+t.dataset.pick);
  if(t.dataset.nav) return go(curSession().idx + (+t.dataset.nav));
  if(t.dataset.go!==undefined) return go(+t.dataset.go);
  const a=t.dataset.act;
  if(a==="restart"){
    if(tab==="practice"){ prefs.pos[prefs.scope]=0; save(); sessions.practice=newSession("practice",{random:prefs.random}); }
    else if(tab==="search"){ const o=sessions.search; sessions.search=newSession("search",{keys:o.baseKeys, term:o.term, random:o.random}); }
    else sessions.wrong=newSession("wrong",{random:sessions.wrong&&sessions.wrong.random});
    render();
  }
  if(a==="srchPractice") return startSearchPractice(0);
  if(a==="srchBack"){ srchPracticing=false; render(); window.scrollTo({top:0}); return; }
  if(a==="clear"){ if(confirm("確定要清除所有作答紀錄、錯題本與最高分嗎？")){ wrongSet=new Set(); history={}; best=null; prefs.pos={}; save(); refreshStats(); sessions.practice=null; render(); } }
  if(a==="startQuiz"){
    prefs.quizScope=$("#quizScope").value; prefs.quizN=+$("#quizN").value; save();
    sessions.quiz=newSession("quiz",{scope:prefs.quizScope, n:prefs.quizN}); render(); window.scrollTo({top:0});
  }
  if(a==="retryQuiz"){ sessions.quiz=newSession("quiz",{scope:prefs.quizScope, n:prefs.quizN}); render(); window.scrollTo({top:0}); }
  if(a==="newQuiz"){ sessions.quiz=null; render(); }
  if(a==="abandon"){ if(confirm("確定放棄這次測驗？")){ sessions.quiz=null; render(); } }
  if(a==="submit"){
    const s=sessions.quiz; const left=s.keys.length-Object.keys(s.answers).length;
    if(left>0 && !confirm(`還有 ${left} 題未作答，確定要交卷嗎？`)) return;
    s.submitted=true; s.end=Date.now();
    s.keys.forEach(k=>record(k, s.answers[k]===BY[k].ans));
    const score=Math.round(s.keys.filter(k=>s.answers[k]===BY[k].ans).length/s.keys.length*100);
    if(best==null || score>best){ best=score; save(); }
    refreshStats(); render(); window.scrollTo({top:0});
  }
  if(a==="toWrong"){ tab="wrong"; sessions.wrong=newSession("wrong"); render(); window.scrollTo({top:0}); }
  if(a==="openAll") document.querySelectorAll("details.qa").forEach(d=>d.open=true);
  if(a==="closeAll") document.querySelectorAll("details.qa").forEach(d=>d.open=false);
});

document.getElementById("view").addEventListener("toggle",e=>{
  if(e.target.classList && e.target.classList.contains("navgrid")) gridOpen=e.target.open;
}, true);

document.getElementById("view").addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="scopeSel") startPracticeScope(e.target.value);
  if(id==="rnd"){
    if(tab==="practice"){ prefs.random=e.target.checked; save(); sessions.practice=newSession("practice",{random:prefs.random, resume:true}); }
    else if(tab==="search"){ const o=sessions.search; sessions.search=newSession("search",{keys:o.baseKeys, term:o.term, random:e.target.checked}); }
    else sessions.wrong=newSession("wrong",{random:e.target.checked});
    render();
  }
  if(id==="srchScope"){ srch.scope=e.target.value; saveSrch(); renderSearchResults(); }
  if(id==="srchExp"){ srch.exp=e.target.checked; saveSrch(); renderSearchResults(); }
  if(id==="ovScope"){ ovScope=e.target.value; $("#ovSearch").value=""; renderOvList(); }
  if(id==="hideAns") renderOvList();
  if(id==="onlyWrong"){
    const only=e.target.checked;
    document.querySelectorAll("#reviewList .review-item").forEach(el=>el.classList.toggle("hidden", only && el.dataset.ok==="true"));
  }
});
let searchTimer=null;
document.getElementById("view").addEventListener("input",e=>{
  if(e.target.id==="ovSearch"){ clearTimeout(searchTimer); searchTimer=setTimeout(renderOvList,200); }
  if(e.target.id==="srchInput"){ clearTimeout(searchTimer); const v=e.target.value; searchTimer=setTimeout(()=>{ srch.term=v; saveSrch(); renderSearchResults(); },150); }
});

document.addEventListener("keydown",e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  if(e.key==="/"){ e.preventDefault(); tab="search"; srchPracticing=false; render(); window.scrollTo({top:0}); return; }
  if(!["practice","wrong","quiz","search"].includes(tab)) return;
  const s=curSession(); if(!s || !s.keys.length || (tab==="quiz"&&s.submitted)) return;
  const k=e.key.toUpperCase();
  const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ e.preventDefault(); pick(map[k]); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); go(s.idx+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); go(s.idx-1); }
});

(function(){
  const saved=LS.get("erp_theme",null); if(saved) document.documentElement.dataset.theme=saved;
  $("#themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; LS.set("erp_theme",next);
  });
})();

refreshStats();
render();
</script>
</body>
</html>
